<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>MAGASIN · Quản trị nội bộ</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7fb}#app{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="app" title="MAGASIN Manager / OWNER"></iframe>
<script>
(function(){
  'use strict';
  const frame=document.getElementById('app');
  const bridge=document.createElement('script');
  bridge.src='/manager-route-bridge-v1.js?v=20260903-route-bridge-v3';
  bridge.async=false;
  document.head.appendChild(bridge);
  frame.src='/manager-v11.html?v=20260903-v11-5';
  frame.addEventListener('load',function(){
    try{
      const d=frame.contentDocument;
      if(!d)return;
      const load=(src)=>{const s=d.createElement('script');s.src=src;s.async=false;(d.body||d.documentElement).appendChild(s);return s};
      load('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');
      load('/manager-ui-source-header-suppress-v1.js?v=20260903-v3');
      load('/manager-ui-shell-v2.js?v=20260903-v6');
      load('/manager-ui-header-fix-v1.js?v=20260903-v6');
      const css=d.createElement('link');css.rel='stylesheet';css.href='/manager-drawer-fix.css?v=20260903-v5';d.head.appendChild(css);
      load('/manager-route-state-v2.js?v=20260903-route-v6');
      load('/manager-workforce-day-header-fix-v2.js?v=20260903-v5');
      const waitForSupabase=()=>{
        if(window.supabase?.createClient || d.defaultView?.supabase?.createClient){
          load('/app-time-picker-24h.js?v=20260903-v3');
          load('/manager-workforce-live.js?v=20260903-review-base-v3');
          load('/manager-workforce-review-v2.js?v=20260903-review-edit-v3');
          load('/manager-workforce-demand-v4.js?v=20260903-v9');
          load('/manager-workforce-auto.js?v=20260903-v3');
          load('/manager-workforce-tabs-v1.js?v=20260903-v3');
        }else setTimeout(waitForSupabase,100);
      };
      waitForSupabase();
      let checks=0;
      const injectSecurity=()=>{
        const doc=frame.contentDocument;if(!doc)return;
        const hasSecurity=[...doc.scripts].some(x=>(x.src||'').includes('security-runtime.js'));
        if(!hasSecurity){const sec=doc.createElement('script');sec.src='/security-runtime.js?v=20260903-security-v4';sec.async=false;(doc.body||doc.documentElement).appendChild(sec)}
        if(++checks<10)setTimeout(injectSecurity,300);
      };
      setTimeout(injectSecurity,400);
    }catch(e){console.error('Manager runtime load failed',e)}
  },{once:true});
})();
</script>
</body>
</html>
