<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>MAGASIN · Nhân viên</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7fb}#employeeApp{display:block;width:100%;height:100%;border:0;background:#f4f7fb}#runtimeError{position:fixed;left:16px;right:16px;bottom:16px;z-index:9999;display:none;padding:12px 14px;border:1px solid #f2c8c0;border-radius:12px;background:#fff4f1;color:#9d3f30;font:600 13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;box-shadow:0 8px 24px rgba(15,23,42,.12)}</style>
</head>
<body>
<iframe id="employeeApp" title="MAGASIN Employee V41"></iframe>
<div id="runtimeError" role="alert"></div>
<script src="/shared-core-v1.js?v=20260903-core-110"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{'use strict';
const C=globalThis.MAGASIN_CORE,f=document.getElementById('employeeApp'),err=document.getElementById('runtimeError');
if(!C||!f){err.textContent='Không thể khởi tạo Employee Core.';err.style.display='block';return}
const state=globalThis.MAGASIN_EMPLOYEE=globalThis.MAGASIN_EMPLOYEE||{};
state.events=state.events||{emit(name,detail){document.dispatchEvent(new CustomEvent('magasin:'+name,{detail}))}};
let profile=null;
const fail=e=>{console.error('Employee runtime',e);err.textContent=e?.message||'Không thể tải hệ thống nhân viên.';err.style.display='block'};
(async()=>{try{profile=await C.supabase.requireActive();if(!C.roles.hasRole(profile,['STAFF','EMPLOYEE']))throw Error('Tài khoản không có quyền truy cập khu vực nhân viên.');state.profile=profile;f.addEventListener('load',()=>{try{f.dataset.employeeBooted='1';globalThis.MAGASIN_EMPLOYEE.schedule?.refresh?.();globalThis.MAGASIN_EMPLOYEE.attendance?.refresh?.();globalThis.MAGASIN_EMPLOYEE.dashboard?.refresh?.()}catch(e){fail(e)}},{once:false});f.src='/employee-v40.html?ui=v41-template&runtime=engine';}catch(e){fail(e)}})();
})();
</script>
<script src="/employee-schedule-engine-v1.js?v=20260903-emp-schedule1"></script>
<script src="/employee-attendance-engine-v1.js?v=20260903-emp-attendance1"></script>
<script src="/employee-dashboard-engine-v1.js?v=20260903-emp-dashboard1"></script>
</body></html>
