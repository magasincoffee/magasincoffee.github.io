<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>MAGASIN · Nhập hàng kế toán</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f8fb;color:#344054;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}p{font-weight:700}</style>
</head>
<body>
<p>Đang mở hệ thống nhập hàng…</p>
<script>
(async () => {
  const friendlyPath = '/nhap-hang/';
  const sourcePath = '/04_OWNER/Procurement/';
  try {
    history.replaceState(history.state, '', sourcePath + location.search + location.hash);
    const res = await fetch(sourcePath + 'index.html', { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    let html = await res.text();
    html = html.replace('<head>', '<head><base href="/04_OWNER/Procurement/">');
    html = html.replace('</body>', `<script>addEventListener('load',()=>history.replaceState(history.state,'','${friendlyPath}'+location.search+location.hash),{once:true});<\/script></body>`);
    document.open();
    document.write(html);
    document.close();
  } catch (err) {
    console.error('[NHAP_HANG_ROUTE]', err);
    history.replaceState(history.state, '', friendlyPath);
    document.body.innerHTML = '<main style="padding:24px"><h2>Không mở được hệ thống nhập hàng</h2><p>Vui lòng tải lại trang hoặc liên hệ quản trị hệ thống.</p></main>';
  }
})();
</script>
</body>
</html>
