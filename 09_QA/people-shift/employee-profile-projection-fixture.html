<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TASK-101 Profile QA</title><style>html,body{margin:0;width:100%}#employeeApp{display:block;width:100%;min-height:720px;border:0}</style></head>
<body>
<iframe id="employeeApp" title="TASK-101 Employee Profile QA"></iframe>
<script>
(()=>{
  const calls=[];
  const state={mode:'ok'};
  const row={
    employee_id:'u-a',
    username:'an.nguyen',
    full_name:'Nguyễn An',
    phone:'0900000000',
    employee_role:'STAFF',
    profile_status:'ACTIVE',
    join_date:null,
    primary_store_id:'store-a',
    primary_store_code:'CN1',
    primary_store_name:'Cửa hàng QA',
    employee_level:null,
    pay_rule_reference:null
  };
  window.__TASK101_QA={
    calls,state,row,
    fail(){state.mode='error'},
    recover(){state.mode='ok'},
    rpcCount(){return calls.filter(x=>x.kind==='rpc'&&x.name==='get_my_employee_profile_v1').length}
  };
  window.MAGASIN_CORE={
    supabase:{
      async rpc(name,args={}){
        calls.push({kind:'rpc',name,args:structuredClone(args||{})});
        if(name!=='get_my_employee_profile_v1')return {data:null,error:{message:'UNEXPECTED_RPC'}};
        if(state.mode==='error')return {data:null,error:{message:'PROFILE_INACTIVE'}};
        return {data:[structuredClone(row)],error:null};
      },
      from(name){calls.push({kind:'from',name});throw new Error('Direct table access forbidden')}
    }
  };
  const frame=document.getElementById('employeeApp');
  frame.srcdoc='<!doctype html><html lang="vi"><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{--line:#dbe4ef;--muted:#718199}*{box-sizing:border-box}body{font-family:system-ui;margin:0;padding:12px}.panel{border:1px solid var(--line);border-radius:14px;padding:14px}.profile-grid{display:grid;grid-template-columns:140px 1fr;gap:14px}.profile-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px}.field input{width:100%;min-width:0;height:38px}.header-user-text{display:flex;gap:6px}.header-avatar{width:36px;height:36px}.profile-avatar{width:90px;height:90px}.muted{color:var(--muted)}@media(max-width:600px){.profile-grid,.profile-fields{grid-template-columns:1fr}}</style></head><body><div class="header-user-text"><strong>Nhân viên</strong><span>Cấp nhân viên</span></div><button class="header-avatar">N</button><section id="view-profile"><div class="profile-layout"><div class="panel profile-main"><h2>Thông tin cá nhân</h2><div class="profile-grid"><div><button class="profile-avatar"><span id="profileAvatarFallback">N</span></button></div><div class="profile-fields"><div class="field"><label>Họ tên</label><input id="profileFullName" readonly></div><div class="field"><label>Tên đăng nhập</label><input id="profileUsername" readonly></div><div class="field"><label>Số điện thoại</label><input id="profilePhone" readonly></div><div class="field"><label>Vai trò</label><input id="profileRole" readonly></div><div class="field"><label>Trạng thái</label><input id="profileStatus" readonly></div><div class="field"><label>Chi nhánh chính</label><input id="profilePrimaryStore" readonly></div><div class="field"><label>Cấp độ</label><input id="profileLevel" readonly></div><div class="field"><label>Ngày vào làm</label><input id="profileJoinDate" readonly></div></div></div></div></div></section></body></html>';
})();
</script>
<script src="/06_EMPLOYEE/profile/engine-v1.js"></script>
</body>
</html>
