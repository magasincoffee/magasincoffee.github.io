<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UI2-007 Employee Schedule QA</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;max-width:100%;overflow:hidden;background:#eef2f7}
    iframe{display:block;width:100%;height:100vh;min-height:0;border:0;background:#fff}
  </style>
</head>
<body>
<iframe id="employeeApp" title="UI2-007 Employee Schedule QA" src="/06_EMPLOYEE/app/employee-v40.html#schedule"></iframe>
<script>
(() => {
  const calls=[],downstream=[],events=[],loadingWaiters=[];
  const employee={id:'employee-ui2-007',full_name:'Nguyễn An',username:'nguyen.an',role:'STAFF',status:'ACTIVE'};
  const state={today:'2026-09-25',mode:'populated'};
  const rows=[
    {schedule_id:'sch-mon',work_date:'2026-09-21',start_time:'08:00',end_time:'12:00',store_code:'CN-QA-A',store_name:'MAGASIN QA A',status:'APPROVED'},
    {schedule_id:'sch-fri-am',work_date:'2026-09-25',start_time:'08:00',end_time:'12:00',store_code:'CN-QA-A',store_name:'MAGASIN QA A',status:'APPROVED'},
    {schedule_id:'sch-fri-pm',work_date:'2026-09-25',start_time:'14:00',end_time:'18:00',store_code:'CN-QA-B',store_name:'MAGASIN QA B',status:'APPROVED'},
    {schedule_id:'sch-sat',work_date:'2026-09-26',start_time:'17:00',end_time:'22:00',store_code:'CN-QA-C',store_name:'MAGASIN QA C',status:'APPROVED'},
    {schedule_id:'sch-draft',work_date:'2026-09-24',start_time:'12:00',end_time:'16:00',store_code:'CN-QA-A',store_name:'MAGASIN QA A',status:'DRAFT'},
    {schedule_id:'sch-next',work_date:'2026-09-28',start_time:'12:00',end_time:'17:00',store_code:'CN-QA-A',store_name:'MAGASIN QA A',status:'APPROVED'}
  ];

  const pad=n=>String(n).padStart(2,'0');
  const dateObj=k=>new Date(String(k).slice(0,10)+'T00:00:00Z');
  const addDays=(k,n)=>{const d=dateObj(k);d.setUTCDate(d.getUTCDate()+n);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())};
  const monday=(k=state.today)=>{const d=dateObj(k),day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()-(day-1));return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())};
  const weekDays=k=>Array.from({length:7},(_,i)=>addDays(k,i));
  const formatDate=k=>{const p=String(k).slice(0,10).split('-');return p[2]+'/'+p[1]};
  const time5=v=>String(v||'').slice(0,5);
  const minutes=v=>Number(time5(v).slice(0,2))*60+Number(time5(v).slice(3,5));
  const shiftKind=v=>minutes(v)<720?'morning':minutes(v)<1020?'afternoon':'evening';
  const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function projection(week){
    const end=addDays(week,6);
    return rows.filter(r=>r.work_date>=week&&r.work_date<=end).map(r=>({...r}));
  }

  window.MAGASIN_CORE={
    security:{escapeHtml},
    time:{time5,minutes,shiftKind},
    date:{dateKey:()=>state.today,addDays,monday,weekDays,formatDate},
    roles:{label:{STAFF:'Nhân viên',EMPLOYEE:'Nhân viên'}},
    ui:{setLoading:(el,on=true)=>{if(el)el.dataset.loading=on?'1':'0'}},
    supabase:{
      async rpc(name,args={}){
        calls.push({type:'rpc',name,args:structuredClone(args||{}),mode:state.mode});
        if(name!=='list_my_approved_schedules_v2')return {data:null,error:{message:'UNEXPECTED_QA_RPC'}};
        if(state.mode==='loading')await new Promise(resolve=>loadingWaiters.push(resolve));
        if(state.mode==='error')return {data:null,error:{message:'SQLSTATE_UI2_007_QA'}};
        if(state.mode==='empty')return {data:[],error:null};
        return {data:projection(args.p_week_start),error:null};
      },
      from(name){calls.push({type:'from',name});throw new Error('DIRECT_TABLE_FORBIDDEN')}
    }
  };

  window.MAGASIN_EMPLOYEE={
    profile:employee,
    events:{emit:(name,detail)=>events.push({name,detail:structuredClone(detail||{})})},
    attendance:{async openSchedule(id,week){downstream.push({type:'attendance',id,week});return true}},
    swap:{
      async openGive(id,week){downstream.push({type:'give',id,week});return true},
      async openSwap(id,week){downstream.push({type:'swap',id,week});return true}
    },
    availability:{open(){downstream.push({type:'availability'})}}
  };

  window.__UI2_007_QA={
    calls,downstream,events,state,rows,
    async setMode(mode){state.mode=mode;return window.MAGASIN_EMPLOYEE.schedule?.refresh?.()},
    setModeOnly(mode){state.mode=mode},
    startLoading(){state.mode='loading';void window.MAGASIN_EMPLOYEE.schedule?.refresh?.()},
    releaseLoading(mode='populated'){
      state.mode=mode;
      while(loadingWaiters.length)loadingWaiters.shift()();
    },
    async refresh(){return window.MAGASIN_EMPLOYEE.schedule?.refresh?.()}
  };
})();
</script>
<script src="/06_EMPLOYEE/schedule/engine-v1.js?v=20260923-sched03"></script>
</body>
</html>
