<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>Employee attendance schedule-linked QA</title></head>
<body>
<iframe id="employeeApp" title="Employee Attendance QA"></iframe>
<script>
(() => {
  const calls=[];
  const toasts=[];
  const state={attendance:null,history:[]};
  window.__EMPLOYEE_ATTENDANCE_QA={calls,toasts,state};
  const addDays=(s,n)=>{const d=new Date(s+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
  window.MAGASIN_CORE={
    security:{escapeHtml:v=>String(v??"")},
    time:{
      time5:v=>String(v??"").slice(0,5),
      minutes:v=>{const s=String(v||"00:00").slice(0,5);return Number(s.slice(0,2))*60+Number(s.slice(3,5))}
    },
    date:{
      dateKey:()=> "2026-09-18",
      monday:()=> "2026-09-14",
      addDays,
      formatDate:v=>String(v??"").slice(0,10),
      localDate:v=>new Date(String(v)+"T00:00:00Z")
    },
    ui:{toast:(message,type)=>toasts.push({message,type})},
    supabase:{
      async rpc(name,args={}){
        calls.push({kind:"rpc",name,args:structuredClone(args||{})});
        if(name==="get_my_today_schedules"){
          return {data:[{
            schedule_id:"sch-1",work_date:"2026-09-18",start_time:"06:00",end_time:"12:00",
            store_id:"store-a",store_code:"CN1",store_name:"Cửa hàng QA",schedule_status:"APPROVED",
            attendance_id:state.attendance?.id||null,attendance_status:state.attendance?.status||null,
            check_in:state.attendance?.check_in||null,check_out:state.attendance?.check_out||null,
            planned_start:"06:00",planned_end:"12:00",late_minutes:0,early_minutes:0,
            hours_worked:state.attendance?.hours_worked||0,amount:state.attendance?.amount||0,grade:"A",hourly_rate:16000
          }],error:null};
        }
        if(name==="get_my_attendance_v2")return {data:state.history.map(x=>({...x})),error:null};
        if(name==="clock_in_for_schedule"){
          state.attendance={id:"att-1",status:"OPEN",check_in:"2026-09-18T06:00:00+07:00",check_out:null,hours_worked:0,amount:0};
          return {data:"att-1",error:null};
        }
        if(name==="clock_out_attendance"){
          state.attendance={...state.attendance,status:"COMPLETED",check_out:"2026-09-18T12:00:00+07:00",hours_worked:6,amount:96000};
          state.history=[{
            attendance_id:"att-1",schedule_id:"sch-1",work_date:"2026-09-18",store_id:"store-a",store_code:"CN1",store_name:"Cửa hàng QA",
            planned_start:"06:00",planned_end:"12:00",check_in:state.attendance.check_in,check_out:state.attendance.check_out,status:"COMPLETED",
            late_minutes:0,early_minutes:0,hours_worked:6,amount:96000,grade:"A",hourly_rate:16000
          }];
          return {data:{id:"att-1",status:"COMPLETED"},error:null};
        }
        if(name==="manual_attendance_from_schedule")return {data:"att-manual",error:null};
        if(name==="auto_attendance_from_approved_schedules")return {data:[],error:null};
        return {data:null,error:{message:"unexpected rpc "+name}};
      },
      from(name){calls.push({kind:"from",name});throw new Error("Direct table access forbidden: "+name)}
    }
  };
  const frame=document.getElementById("employeeApp");
  frame.srcdoc=`<!doctype html><html lang="vi"><body>
    <section id="view-attendance">
      <input id="attendanceFrom" type="date" value="2026-09-01">
      <input id="attendanceTo" type="date" value="2026-09-18">
      <select id="attendanceQuickRange"><option value="month">Tháng này</option><option value="week">Tuần này</option><option value="all">Tất cả</option></select>
      <div id="attendanceTotalShifts"></div><div id="attendanceTotalHours"></div><div id="attendanceTotalIncome"></div><div id="attendanceAvgIncome"></div>
      <div class="attendance-entry-grid">
        <div class="panel"></div>
        <div class="panel"><table id="attendanceHistoryTable"><tbody></tbody></table></div>
      </div>
    </section>
  </body></html>`;
})();
</script>
<script src="/06_EMPLOYEE/attendance/engine-v1.js"></script>
</body>
</html>
