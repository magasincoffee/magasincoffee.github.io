<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>Manager Workforce canonical QA</title>
<style>
:root{--border:#dce5f0;--muted:#617793;--text:#102a43;--primary:#16b7c5}
body{font:14px system-ui;margin:20px;color:var(--text)}.card{border:1px solid var(--border);border-radius:12px;padding:12px}.btn{padding:7px 10px;border:1px solid var(--border);background:#fff;border-radius:8px}.btn.primary{background:var(--primary);color:#fff}.badge{padding:5px 8px;border-radius:9px}.blue{background:#e9f1ff}.green{background:#e6f4ed}.muted{color:var(--muted)}.view,.panel{display:none}.view.active,.panel.active{display:block}.sidebar{display:flex;gap:8px;margin-bottom:12px}.tabs{display:flex;gap:8px;margin-bottom:12px}
</style></head>
<body>
<nav class="sidebar">
  <button data-view="workforce" class="active">Xếp lịch</button>
  <button data-view="schedule">Lịch làm</button>
  <button data-view="swap">Đổi ca</button>
</nav>
<section id="view-workforce" class="view active">
  <div class="tabs">
    <button data-tab="review">Đăng ký / Availability</button>
    <button data-tab="publish" class="active">Xếp lịch</button>
    <button data-tab="demand" hidden>Nhu cầu nhân sự · legacy</button>
  </div>
  <div id="panel-demand" class="panel"></div>
  <div id="panel-review" class="panel"></div>
  <div id="panel-publish" class="panel active"></div>
</section>
<section id="view-schedule" class="view"></section>
<section id="view-swap" class="view"></section>
<script>
(() => {
  window.__MAGASIN_WORKFORCE_TODAY__="2026-09-27";
  const calls=[];
  const store={id:"store-a",code:"CN-QA-A",name:"Cửa hàng QA A",status:"ACTIVE"};
  const people={
    "u-1":"Nhân viên QA 1",
    "u-2":"Nhân viên QA 2",
    "u-3":"Nhân viên QA 3"
  };
  const availability=[
    {availability_id:"av-1",user_id:"u-1",employee_name:people["u-1"],username:"qa1",work_date:"2026-09-28",start_time:"06:00",end_time:"12:00",preferred_store_id:"store-a",preferred_store_code:"CN-QA-A",availability_type:"AVAILABLE"},
    {availability_id:"av-2",user_id:"u-2",employee_name:people["u-2"],username:"qa2",work_date:"2026-09-28",start_time:"12:00",end_time:"17:00",preferred_store_id:"store-a",preferred_store_code:"CN-QA-A",availability_type:"PREFERRED"},
    {availability_id:"av-3",user_id:"u-3",employee_name:people["u-3"],username:"qa3",work_date:"2026-09-29",start_time:"17:00",end_time:"22:00",preferred_store_id:"store-a",preferred_store_code:"CN-QA-A",availability_type:"AVAILABLE"}
  ];
  const state={
    generation:null,
    assignments:[],
    official:[],
    swapPending:true,
    givePending:true,
    createCount:0
  };
  function mapAssignment(x,i){
    return {
      ...x,
      id:"asg-"+(i+1),
      generation_id:state.generation?.id||"gen-1",
      employee_name:people[x.user_id]||"Nhân viên QA",
      full_name:people[x.user_id]||"Nhân viên QA",
      store_code:"CN-QA-A"
    };
  }
  const api={
    async rpc(name,args={}){
      calls.push({kind:"rpc",name,args:structuredClone(args||{})});
      if(name==="current_user_role")return {data:"STORE_MANAGER",error:null};
      if(name==="get_manager_accessible_stores")return {data:[store],error:null};
      if(name==="get_manager_weekly_availability"){
        const end=new Date(args.p_week_start+"T00:00:00Z");end.setUTCDate(end.getUTCDate()+6);const to=end.toISOString().slice(0,10);
        return {data:availability.filter(x=>(!args.p_store_id||x.preferred_store_id===args.p_store_id)&&x.work_date>=args.p_week_start&&x.work_date<=to).map(x=>({...x})),error:null};
      }
      if(name==="list_schedule_generations"){
        const rows=state.generation&&state.generation.store_id===args.p_store_id&&state.generation.week_start===args.p_week_start?[{...state.generation}]:[];
        return {data:rows,error:null};
      }
      if(name==="create_schedule_generation"){
        state.createCount++;
        state.generation={id:"gen-"+state.createCount,status:"DRAFT",store_id:args.p_store_id,store_code:"CN-QA-A",store_name:"Cửa hàng QA A",week_start:args.p_week_start,week_end:"2026-10-04",algorithm_version:args.p_algorithm_version,created_at:"2026-09-27T12:00:00Z"};
        state.assignments=[];
        return {data:state.generation.id,error:null};
      }
      if(name==="get_schedule_generation_assignments")return {data:state.assignments.map(x=>({...x})),error:null};
      if(name==="replace_schedule_generation_assignments"){
        if(!state.generation||state.generation.status!=="DRAFT")return {data:null,error:{message:"GENERATION_NOT_DRAFT"}};
        state.assignments=(args.p_assignments||[]).map(mapAssignment);
        return {data:state.assignments.length,error:null};
      }
      if(name==="validate_schedule_generation_v1")return {data:{valid:true,violations:[],warnings:[],assignment_count:state.assignments.length},error:null};
      if(name==="review_schedule_generation"){
        if(state.generation?.status!=="DRAFT")return {data:null,error:{message:"GENERATION_NOT_DRAFT"}};
        state.generation.status=args.p_decision==="APPROVED"?"REVIEWED":"CANCELLED";
        return {data:{status:state.generation.status,validation:{valid:true,violations:[],warnings:[]}},error:null};
      }
      if(name==="publish_schedule_generation"){
        if(state.generation?.status!=="REVIEWED")return {data:{published:false,error_code:"NOT_REVIEWED"},error:null};
        state.generation.status="PUBLISHED";
        state.official=state.assignments.map((x,i)=>({schedule_id:"schedule-"+(i+1),work_date:x.work_date,start_time:x.start_time,end_time:x.end_time,store_id:x.store_id,store_code:"CN-QA-A",store_name:"Cửa hàng QA A",user_id:x.user_id,employee_name:people[x.user_id]||"Nhân viên QA",status:"APPROVED",origin:"SCHEDULE_GENERATION"}));
        return {data:{published:true,inserted_schedule_count:state.official.length},error:null};
      }
      if(name==="get_manager_weekly_schedule"){
        const end=new Date(args.p_week_start+"T00:00:00Z");end.setUTCDate(end.getUTCDate()+6);const to=end.toISOString().slice(0,10);
        return {data:state.official.filter(x=>(!args.p_store_id||x.store_id===args.p_store_id)&&x.work_date>=args.p_week_start&&x.work_date<=to),error:null};
      }
      if(name==="list_shift_swap_requests_v1")return {data:state.swapPending&&state.official.length>1?[{id:"swap-1",status:"PENDING",reason:"Đổi ca QA",requested_at:"2026-09-28T00:00:00Z",store_id:"store-a",store_code:"CN-QA-A",store_name:"Cửa hàng QA A",requester_id:state.official[0].user_id,requester_name:state.official[0].employee_name,requester_schedule_id:state.official[0].schedule_id,target_schedule_id:state.official[1].schedule_id,target_user_id:state.official[1].user_id,target_user_name:state.official[1].employee_name,requester_date:state.official[0].work_date,requester_start:state.official[0].start_time,requester_end:state.official[0].end_time,target_date:state.official[1].work_date,target_start:state.official[1].start_time,target_end:state.official[1].end_time}]:[],error:null};
      if(name==="approve_shift_swap"){
        state.swapPending=false;
        if(state.official.length>1){
          const a=state.official[0].user_id,b=state.official[1].user_id;
          state.official[0].user_id=b;state.official[0].employee_name=people[b];
          state.official[1].user_id=a;state.official[1].employee_name=people[a];
        }
        return {data:{id:args.p_swap_id,status:"APPROVED",swapped:true},error:null};
      }
      if(name==="reject_shift_swap"){state.swapPending=false;return {data:{id:args.p_swap_id,status:"REJECTED"},error:null};}
      if(name==="list_shift_give_requests_v1")return {data:state.givePending&&state.official.length?[{id:"give-1",status:"PENDING_MANAGER",reason:"Cho ca QA",requested_at:"2026-09-28T00:00:00Z",giver_id:state.official[0].user_id,giver_name:state.official[0].employee_name,recipient_id:"u-3",recipient_name:people["u-3"],schedule_id:state.official[0].schedule_id,work_date:state.official[0].work_date,start_time:state.official[0].start_time,end_time:state.official[0].end_time,store_id:"store-a",store_code:"CN-QA-A",store_name:"Cửa hàng QA A",recipient_responded_at:"2026-09-28T01:00:00Z"}]:[],error:null};
      if(name==="approve_shift_give"){
        state.givePending=false;
        if(state.official[0]){state.official[0].user_id="u-3";state.official[0].employee_name=people["u-3"]}
        return {data:{id:args.p_give_id,status:"APPROVED",transferred:true,schedule_id:state.official[0]?.schedule_id,giver_id:"u-1",recipient_id:"u-3"},error:null};
      }
      if(name==="reject_shift_give"){state.givePending=false;return {data:{id:args.p_give_id,status:"REJECTED_MANAGER"},error:null};}
      return {data:null,error:{message:"unexpected rpc "+name}};
    },
    from(name){calls.push({kind:"from",name});throw new Error("Direct table access forbidden:"+name)}
  };
  window.__MW31_QA={calls,state,store,availability,people};
  window.supabase={createClient(){return api}};
  document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.querySelector('#view-'+b.dataset.view)?.classList.add('active');
    document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));
  }));
  document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    document.querySelector('#panel-'+b.dataset.tab)?.classList.add('active');
    document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));
  }));
})();
</script>
<script src="/05_MANAGER/Workforce/engine-v1.js"></script>
</body></html>
