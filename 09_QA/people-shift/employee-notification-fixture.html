<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Employee Notification QA</title></head><body>
<iframe id="employeeApp" title="Employee Notification QA"></iframe>
<script>
(()=>{
  const calls=[],rows=[
    {id:"n-1",event_type:"SCHEDULE_CHANGED",audience_type:"USER",title:"Lịch làm đã thay đổi",message:"Ca Thứ Sáu đã được cập nhật.",available_at:"2026-09-18T10:00:00Z",created_at:"2026-09-18T10:00:00Z",entity_type:"WORK_SCHEDULE",entity_id:"e-1",related_schedule_id:"s-1",store_id:"store-a"},
    {id:"n-2",event_type:"CLOCK_OUT_REMINDER",audience_type:"USER",title:"Nhắc chấm công ra ca",message:"Ca của bạn đã kết thúc. Hãy chấm công ra ca.",available_at:"2026-09-18T11:00:00Z",created_at:"2026-09-18T09:00:00Z",entity_type:"WORK_SCHEDULE",entity_id:"e-2",related_schedule_id:"s-2",store_id:"store-a"}
  ];
  window.__NOTIFICATION_QA={calls,rows};
  window.MAGASIN_CORE={
    security:{escapeHtml:v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))},
    supabase:{
      async rpc(name,args={}){calls.push({kind:"rpc",name,args:structuredClone(args||{})});if(name==="list_my_notifications_v1")return {data:rows.map(x=>({...x})),error:null};return {data:null,error:{message:"unexpected rpc "+name}}},
      from(name){calls.push({kind:"from",name});throw new Error("Direct table access forbidden: "+name)}
    }
  };
  const f=document.getElementById("employeeApp");
  f.srcdoc=`<!doctype html><html lang="vi"><body><section id="view-notice"><div class="panel"><h2>Thông báo</h2><div class="timeline"><div class="timeline-item">Chưa có thông báo mới.</div></div></div></section></body></html>`;
})();
</script>
<script src="/06_EMPLOYEE/notification/engine-v1.js"></script>
</body></html>
