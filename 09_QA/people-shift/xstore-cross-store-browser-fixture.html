<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>XSTORE four-store master QA</title>
<style>:root{--border:#dce5f0;--muted:#667085}.btn{padding:8px}.msd{padding:10px}</style></head><body>
<div id="panel-publish"><section class="msd"><div id="xstoreMasterMount"></div></section></div>
<script>
(()=>{'use strict';
const week=new URLSearchParams(location.search).get('week')||'2026-10-05';
const stores=[
 {id:'s1',code:'CN1',name:'MAGASIN COFFEE CN1',status:'ACTIVE'},
 {id:'s2',code:'CN2',name:'MAGASIN COFFEE CN2',status:'ACTIVE'},
 {id:'s3',code:'CN3',name:'MAGASIN COFFEE CN3',status:'ACTIVE'},
 {id:'s4',code:'CN4',name:'MAGASIN COFFEE CN4',status:'ACTIVE'}
];
const plan=[
 {plan_source:'DRAFT',store_id:'s1',store_code:'CN1',store_name:'MAGASIN COFFEE CN1',user_id:'e1',employee_name:'Như Huỳnh',work_date:'2026-10-05',start_time:'06:00',end_time:'12:00',row_status:'DRAFT'},
 {plan_source:'OFFICIAL',store_id:'s3',store_code:'CN3',store_name:'MAGASIN COFFEE CN3',user_id:'e2',employee_name:'Mai Chi',work_date:'2026-10-06',start_time:'17:00',end_time:'22:00',row_status:'APPROVED'}
];
let priorityConfigured=false;
try{priorityConfigured=localStorage.getItem('xstore-c05-priority-e3')==='1'}catch(_){}
const availability=[
 {availability_id:'a1',user_id:'e1',employee_name:'Như Huỳnh',work_date:'2026-10-05',start_time:'06:00',end_time:'12:00',priority_store_ids:['s3','s2','s4','s1'],priority_store_codes:['CN3','CN2','CN4','CN1']},
 {availability_id:'a2',user_id:'e2',employee_name:'Mai Chi',work_date:'2026-10-06',start_time:'17:00',end_time:'22:00',priority_store_ids:['s1','s3'],priority_store_codes:['CN1','CN3']},
 {availability_id:'a3',user_id:'e3',employee_name:'Chưa cấu hình',work_date:'2026-10-07',start_time:'12:00',end_time:'17:00',priority_store_ids:priorityConfigured?['s1']:[],priority_store_codes:priorityConfigured?['CN1']:[]}
];
const defaultRequirements=[
 {requirement_id:'r1',store_id:'s1',store_code:'CN1',store_name:'MAGASIN COFFEE CN1',day_of_week:1,start_time:'06:00',end_time:'12:00',target_headcount:2},
 {requirement_id:'r2',store_id:'s2',store_code:'CN2',store_name:'MAGASIN COFFEE CN2',day_of_week:1,start_time:'07:00',end_time:'12:00',target_headcount:2},
 {requirement_id:'r3',store_id:'s3',store_code:'CN3',store_name:'MAGASIN COFFEE CN3',day_of_week:2,start_time:'17:00',end_time:'22:00',target_headcount:3},
 {requirement_id:'r4',store_id:'s4',store_code:'CN4',store_name:'MAGASIN COFFEE CN4',day_of_week:7,start_time:'08:00',end_time:'13:00',target_headcount:2},
 {requirement_id:'r5',store_id:'s1',store_code:'CN1',store_name:'MAGASIN COFFEE CN1',day_of_week:5,start_time:'12:00',end_time:'17:00',target_headcount:1}
];
let persistedRequirements=null;
try{persistedRequirements=JSON.parse(localStorage.getItem('xstore-c05-recurring-requirements')||'null')}catch(_){}
const requirements=Array.isArray(persistedRequirements)?persistedRequirements.map(x=>({...x})):defaultRequirements.map(x=>({...x}));
const calls=[],opens=[];
window.__XSTORE_QA={calls,opens,stores,plan,availability,requirements};
window.MAGASIN_MANAGER_SCHEDULE_DRAFT={getState:()=>({week,storeId:'s1'})};
const api={rpc:async(name,args)=>{
 calls.push({name,args});
 if(name==='get_manager_accessible_stores')return{data:stores,error:null};
 if(name==='get_cross_store_weekly_plan_v1')return{data:plan,error:null};
 if(name==='get_cross_store_weekly_availability_v1')return{data:availability,error:null};
 if(name==='list_workforce_recurring_staffing_requirements_v1')return{data:requirements.map(x=>({...x})),error:null};
 if(name==='replace_workforce_recurring_staffing_requirements_v1'){
  const incoming=Array.isArray(args?.p_requirements)?args.p_requirements:[];
  requirements.splice(0,requirements.length,...incoming.map((x,i)=>({
   requirement_id:'saved-'+(i+1),
   store_id:x.store_id,
   store_code:stores.find(s=>s.id===x.store_id)?.code||'',
   store_name:stores.find(s=>s.id===x.store_id)?.name||'',
   day_of_week:Number(x.day_of_week),
   start_time:x.start_time,
   end_time:x.end_time,
   target_headcount:Number(x.target_headcount)
  })));
  localStorage.setItem('xstore-c05-recurring-requirements',JSON.stringify(requirements));
  return{data:{requirement_count:requirements.length,accessible_store_count:4,accessible_store_codes:['CN1','CN2','CN3','CN4']},error:null};
 }
 if(name==='auto_generate_cross_store_schedule_v1')return{data:{week_start:args?.p_week_start||week,status:'DRAFT',algorithm_version:'XSTORE_GLOBAL_RECURRING_V1',staffing_authority:'RECURRING_WEEKLY_V1',assignment_count:8,shortages:[],shortage_count:0,requires_manager_review:true,published:false},error:null};
 return{data:null,error:{message:'UNEXPECTED '+name}};
}};
window.supabase={createClient:()=>api};
window.MAGASIN_MANAGER_WORKFORCE_CONTEXT={
 version:'QA',
 client:()=>api,
 stores:async()=>{const q=await api.rpc('get_manager_accessible_stores',{});if(q.error)throw q.error;return q.data||[]},
 actor:async()=>({id:'manager-qa',role:'STORE_MANAGER',status:'ACTIVE',access_scope:'ALL'})
};
document.addEventListener('magasin:manager-schedule-open',e=>opens.push(e.detail));
})();
</script>
<script src="/02_CORE/shared/shared-core-v1.js?v=20261002-sched-ui-005"></script>
<script src="/02_CORE/ui/app-time-picker-24h.js"></script>
<script src="/05_MANAGER/Workforce/cross-store-master-v1.js"></script>
<script src="/05_MANAGER/Workforce/cross-store-auto-schedule-v1.js"></script>
</body></html>
