<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>Manager registration review QA</title>
<style>
:root{--border:#dce5f0;--muted:#617793;--text:#102a43}
body{font:14px system-ui;margin:20px}.card{border:1px solid var(--border);border-radius:12px;padding:12px}.btn{padding:7px;border:1px solid var(--border);background:#fff;border-radius:8px}.badge{padding:5px}.blue{background:#e9f1ff}.muted{color:var(--muted)}
</style>
</head>
<body>
<section id="panel-review"></section>
<script>
(() => {
  const calls=[];
  const state={
    rows:[
      {availability_id:"av-1",user_id:"u-1",employee_name:"Nhân viên QA A",username:"qa-a",work_date:null,start_time:"06:00",end_time:"12:00",preferred_store_id:"store-a",preferred_store_code:"CN-QA-A",availability_type:"AVAILABLE",note:null},
      {availability_id:"av-2",user_id:"u-2",employee_name:"Nhân viên QA B",username:"qa-b",work_date:null,start_time:"12:00",end_time:"17:00",preferred_store_id:"store-b",preferred_store_code:"CN-QA-B",availability_type:"AVAILABLE",note:null}
    ]
  };
  function add(date,n){const d=new Date(date+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
  const api={
    async rpc(name,args={}){
      calls.push({kind:"rpc",name,args:JSON.parse(JSON.stringify(args||{}))});
      if(name==="current_user_role") return {data:"STORE_MANAGER",error:null};
      if(name==="get_manager_accessible_stores") return {data:[
        {id:"store-a",code:"CN-QA-A",name:"Cửa hàng QA A"},
        {id:"store-b",code:"CN-QA-B",name:"Cửa hàng QA B"}
      ],error:null};
      if(name==="get_manager_weekly_availability"){
        state.rows[0].work_date=args.p_week_start;
        state.rows[1].work_date=add(args.p_week_start,1);
        const data=state.rows.filter(r=>!args.p_store_id||r.preferred_store_id===args.p_store_id).map(r=>({...r}));
        return {data,error:null};
      }
      if(name==="manager_update_employee_availability"){
        const row=state.rows.find(r=>r.availability_id===args.p_availability_id);
        if(row){
          row.start_time=args.p_start_time;
          row.end_time=args.p_end_time;
          row.preferred_store_id=args.p_preferred_store_id;
          row.preferred_store_code=args.p_preferred_store_id==="store-b"?"CN-QA-B":"CN-QA-A";
          row.note=args.p_note;
        }
        return {data:true,error:null};
      }
      return {data:null,error:{message:"unexpected rpc "+name}};
    },
    from(name){
      calls.push({kind:"from",name});
      throw new Error("Direct table access forbidden in Manager registration review QA: "+name);
    }
  };
  window.__MANAGER_REVIEW_QA={calls,state};
  window.supabase={createClient(){return api}};
})();
</script>
<script src="/05_MANAGER/runtime/compat/workforce/manager-workforce-review-v2.js"></script>
</body>
</html>
