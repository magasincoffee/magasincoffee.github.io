<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Post-publish isolated fixture</title></head><body>
<section id="view-schedule" class="active"><div class="mos-head"><div class="mos-controls"></div></div>
<div class="mos-shift" data-schedule-id="33333333-3333-4333-8333-333333333333">Ca đã phát hành</div></section>
<script>
const store='11111111-1111-4111-8111-111111111111',staff='22222222-2222-4222-8222-222222222222',shift='33333333-3333-4333-8333-333333333333';
window.fixture={calls:[],refreshes:0,store,staff,shift};
const week='2099-01-05',row={schedule_id:shift,store_id:store,work_date:week,start_time:'08:00:00',end_time:'12:00:00',user_id:'44444444-4444-4444-8444-444444444444',employee_name:'Nhân viên trước'};
window.MAGASIN_MANAGER_OFFICIAL_SCHEDULE={
 getState:()=>({week,storeId:store,stores:[{id:store,code:'M01',name:'Cửa hàng thử nghiệm'}],rows:[row]}),
 refresh:async()=>{window.fixture.refreshes++}
};
window.MAGASIN_MANAGER_WORKFORCE_CONTEXT={client:()=>({
 rpc:async(name,payload)=>{
 window.fixture.calls.push({name,payload});
 if(name==='list_employee_workforce_profiles_v1')return {data:[
 {employee_id:staff,full_name:'Nhân viên đủ điều kiện',profile_status:'ACTIVE',priority_store_ids:[store]},
 {employee_id:'55555555-5555-4555-8555-555555555555',full_name:'Nhân viên đã nghỉ',profile_status:'INACTIVE',priority_store_ids:[store]}
 ]};
 if(name==='list_manager_post_publish_audit_v1')return {data:[{schedule_id:shift,action:'REASSIGN',work_date:week,reason:'Bổ sung theo nhu cầu',changed_at:'2026-10-18T13:00:00Z'}]};
 if(name==='add_published_shift_v1'||name==='reassign_published_shift_v1')return {data:{saved:true,schedule_id:shift}};
 return {error:{message:'UNEXPECTED_RPC'}};
 }
})};
</script>
<script src="/05_MANAGER/Workforce/post-publish-adjustment-v1.js"></script></body></html>
