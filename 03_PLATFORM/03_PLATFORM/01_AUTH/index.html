<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/03_PLATFORM/02_ASSETS/favicon.svg"><title>MAGASIN · Đăng nhập</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7fb;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(460px,92vw);padding:30px;background:#fff;border:1px solid #dce5f0;border-radius:18px}h1{margin:0 0 8px}.sub{color:#617793;margin-bottom:20px}.field{margin:12px 0}.field label{display:block;font-weight:700;font-size:12px;margin-bottom:6px}.input{width:100%;height:44px;box-sizing:border-box;border:1px solid #dce5f0;border-radius:10px;padding:0 12px}.btn{width:100%;height:46px;margin-top:14px;border:0;border-radius:10px;background:#16b7c5;color:#fff;font-weight:800}.links{display:flex;justify-content:space-between;margin-top:12px;font-size:12px}.links a{color:#2f6fde;text-decoration:none}.view{display:none}.view.active{display:block}.msg{margin:12px 0;padding:10px;border-radius:10px;background:#eef8f5;color:#217653;font-size:12px}.msg.error{background:#fff0ee;color:#a33d32}</style></head><body><main class="card"><h1>MAGASIN</h1><div class="sub">Hệ thống nội bộ</div><div id="msg" class="msg" hidden></div><section id="login" class="view active"><form id="loginForm"><div class="field"><label>Tên đăng nhập hoặc email</label><input class="input" id="username" autocomplete="username" required></div><div class="field"><label>Mật khẩu</label><input class="input" id="password" type="password" autocomplete="current-password" required></div><button class="btn">Đăng nhập</button></form><div class="links"><a href="#" data-view="register">Đăng ký</a><a href="#" data-view="forgot">Quên mật khẩu?</a></div></section><section id="register" class="view"><form id="registerForm"><div class="field"><label>Họ và tên</label><input class="input" id="fullName" required></div><div class="field"><label>Số điện thoại</label><input class="input" id="phone"></div><div class="field"><label>Email</label><input class="input" id="email" type="email" required></div><div class="field"><label>Tên đăng nhập</label><input class="input" id="regUsername" required></div><div class="field"><label>Mật khẩu</label><input class="input" id="regPassword" type="password" minlength="8" required></div><button class="btn">Đăng ký</button></form><div class="links"><a href="#" data-view="login">← Đăng nhập</a></div></section><section id="forgot" class="view"><form id="forgotForm"><div class="field"><label>Email</label><input class="input" id="forgotEmail" type="email" required></div><button class="btn">Gửi hướng dẫn</button></form><div class="links"><a href="#" data-view="login">← Đăng nhập</a></div></section><section id="reset" class="view"><form id="resetForm"><div class="field"><label>Mật khẩu mới</label><input class="input" id="newPassword" type="password" minlength="8" required></div><div class="field"><label>Nhập lại mật khẩu</label><input class="input" id="confirmPassword" type="password" minlength="8" required></div><button class="btn">Cập nhật mật khẩu</button></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/03_PLATFORM/01_AUTH/auth-runtime-v1.js"></script></body></html>
