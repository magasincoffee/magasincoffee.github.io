<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="/03_PLATFORM/02_ASSETS/favicon.svg">
  <link rel="stylesheet" href="/02_CORE/ui/magasin-ui-v2-tokens.css">
  <link rel="stylesheet" href="/02_CORE/ui/magasin-ui-v2-primitives.css">
  <title>MAGASIN · Chờ cấp quyền</title>
  <style>
    body{
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(circle at 15% 20%,rgba(15,143,156,.10),transparent 30%),
        var(--m-color-neutral-50);
      color:var(--m-color-neutral-950);
      overflow-x:hidden;
    }
    .pending-shell{
      min-height:100vh;
      min-height:100dvh;
      display:grid;
      place-items:center;
      padding:
        calc(var(--m-space-6) + var(--m-safe-top))
        calc(var(--m-space-6) + var(--m-safe-right))
        calc(var(--m-space-6) + var(--m-safe-bottom))
        calc(var(--m-space-6) + var(--m-safe-left));
    }
    .pending-card{
      width:min(620px,100%);
      padding:clamp(28px,5vw,48px);
      border-radius:var(--m-radius-2xl);
      box-shadow:var(--m-shadow-md);
    }
    .brand{
      display:flex;
      align-items:center;
      gap:var(--m-space-3);
      margin-bottom:var(--m-space-7);
    }
    .brand-mark{
      width:48px;
      height:48px;
      display:grid;
      place-items:center;
      flex:0 0 48px;
      border-radius:var(--m-radius-lg);
      background:var(--m-color-brand-600);
      color:#fff;
      font-size:19px;
      font-weight:800;
    }
    .brand-copy h1{
      margin:0;
      font-size:22px;
      line-height:28px;
      letter-spacing:-.02em;
    }
    .brand-copy p{
      margin:2px 0 0;
      color:var(--m-color-neutral-500);
      font-size:12px;
      line-height:18px;
    }
    .pending-icon{
      width:48px;
      height:48px;
      display:grid;
      place-items:center;
      margin-bottom:var(--m-space-4);
      border-radius:50%;
      background:var(--m-color-info-soft);
      color:var(--m-color-info);
      font-size:20px;
      font-weight:700;
    }
    .pending-card h2{
      margin:0;
      font-size:28px;
      line-height:34px;
      font-weight:600;
      letter-spacing:-.025em;
    }
    .pending-card p{
      margin:var(--m-space-3) 0 0;
      color:var(--m-color-neutral-500);
      font-size:14px;
      line-height:21px;
    }
    .pending-note{
      margin-top:var(--m-space-5);
      padding:var(--m-space-4);
      border:1px solid var(--m-border-default);
      border-radius:var(--m-radius-lg);
      background:var(--m-color-neutral-50);
      color:var(--m-color-neutral-700);
      font-size:13px;
      line-height:19px;
    }
    .pending-actions{
      display:flex;
      flex-wrap:wrap;
      gap:var(--m-space-3);
      margin-top:var(--m-space-6);
    }
    .pending-actions .m-button{
      min-height:46px;
      text-decoration:none;
    }
    .pending-status{
      min-height:22px;
      margin-top:var(--m-space-4);
      color:var(--m-color-neutral-600);
      font-size:13px;
      line-height:19px;
    }
    .pending-status[data-kind="error"]{color:var(--m-color-danger);}
    @media(max-width:520px){
      .pending-shell{
        display:block;
        padding:
          calc(var(--m-space-3) + var(--m-safe-top))
          calc(var(--m-space-3) + var(--m-safe-right))
          calc(var(--m-space-3) + var(--m-safe-bottom))
          calc(var(--m-space-3) + var(--m-safe-left));
        background:var(--m-color-surface);
      }
      .pending-card{
        min-height:calc(100dvh - var(--m-safe-top) - var(--m-safe-bottom) - 24px);
        width:100%;
        padding:var(--m-space-5) var(--m-space-2) var(--m-space-7);
        border:0;
        border-radius:0;
        box-shadow:none;
      }
      .pending-actions .m-button{
        width:100%;
        min-height:48px;
      }
    }
  </style>
</head>
<body data-magasin-ui-v2>
  <main class="pending-shell">
    <section class="pending-card m-card">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">M</div>
        <div class="brand-copy"><h1>MAGASIN</h1><p>Hệ thống nội bộ</p></div>
      </div>
      <div class="pending-icon" aria-hidden="true">…</div>
      <h2>Đang chờ cấp quyền truy cập</h2>
      <p>Tài khoản của bạn đã được xác thực nhưng chưa được cấp quyền làm việc trong hệ thống.</p>
      <div class="pending-note" role="status">
        Khi quản lý kích hoạt quyền phù hợp, bạn có thể quay lại màn hình đăng nhập và tiếp tục bằng chính tài khoản này.
      </div>
      <div class="pending-actions">
        <button id="checkAccessBtn" class="m-button m-button--secondary" type="button">Kiểm tra quyền</button>
        <button id="switchAccountBtn" class="m-button m-button--primary" type="button">Đăng xuất / Dùng tài khoản khác</button>
      </div>
      <div id="pendingStatus" class="pending-status" role="status" aria-live="polite"></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/02_CORE/shared/shared-core-v1.js?v=20260927-auth-prod-002"></script>
  <script>
  (() => {
    'use strict';

    const AUTH_URL = '/03_PLATFORM/01_AUTH/';
    const RECOVERY_STORAGE_KEY = 'magasin.auth.recovery.session.v1';
    const checkBtn = document.getElementById('checkAccessBtn');
    const switchBtn = document.getElementById('switchAccountBtn');
    const statusNode = document.getElementById('pendingStatus');
    const core = window.MAGASIN_CORE;
    const sb = core && core.supabase && core.supabase.get ? core.supabase.get() : null;

    const setStatus = (message, kind = '') => {
      statusNode.textContent = message || '';
      statusNode.dataset.kind = kind;
    };

    const setBusy = busy => {
      checkBtn.disabled = !!busy;
      switchBtn.disabled = !!busy;
    };

    const clearLocalMarkers = () => {
      sessionStorage.removeItem(RECOVERY_STORAGE_KEY);
    };

    const route = profile => {
      const role = String(profile && profile.role || '').toUpperCase();
      if (role === 'OWNER') location.replace('/04_OWNER/');
      else if (role === 'ACCOUNTANT') location.replace('/nhap-hang/');
      else if (['STAFF', 'EMPLOYEE'].includes(role)) location.replace('/06_EMPLOYEE/');
      else location.replace('/05_MANAGER/');
    };

    const readAuthoritativeState = async () => {
      if (!sb) throw new Error('Không tải được hệ thống xác thực.');
      const sessionResult = await sb.auth.getSession();
      if (sessionResult.error) throw sessionResult.error;
      const session = sessionResult.data && sessionResult.data.session;
      if (!session || !session.user) return { session: null, profile: null };
      const profileResult = await sb.from('profiles').select('role,status').eq('id', session.user.id).single();
      if (profileResult.error) throw profileResult.error;
      return { session, profile: profileResult.data };
    };

    const checkAccess = async () => {
      setBusy(true);
      setStatus('Đang kiểm tra quyền truy cập…');
      try {
        const { session, profile } = await readAuthoritativeState();
        if (!session) {
          clearLocalMarkers();
          location.replace(AUTH_URL);
          return;
        }

        const accountStatus = String(profile && profile.status || '').toUpperCase();
        if (accountStatus === 'ACTIVE') {
          route(profile);
          return;
        }
        if (accountStatus === 'INACTIVE') {
          setStatus('Tài khoản hiện không hoạt động. Bạn có thể đăng xuất và dùng tài khoản khác.', 'error');
          return;
        }
        setStatus('Tài khoản vẫn đang chờ quản lý kích hoạt.');
      } catch (_) {
        setStatus('Chưa thể kiểm tra quyền lúc này. Vui lòng thử lại.', 'error');
      } finally {
        setBusy(false);
      }
    };

    const switchAccount = async () => {
      setBusy(true);
      setStatus('Đang đăng xuất…');
      try {
        if (!sb) throw new Error('Không tải được hệ thống xác thực.');
        const result = await sb.auth.signOut({ scope: 'local' });
        if (result && result.error) throw result.error;
        clearLocalMarkers();
        location.replace(AUTH_URL + '?switch=1');
      } catch (_) {
        setStatus('Chưa thể đăng xuất lúc này. Vui lòng thử lại.', 'error');
        setBusy(false);
      }
    };

    checkBtn.addEventListener('click', checkAccess);
    switchBtn.addEventListener('click', switchAccount);

    (async () => {
      try {
        const current = await sb.auth.getSession();
        if (current.error || !current.data || !current.data.session) {
          clearLocalMarkers();
          location.replace(AUTH_URL);
        }
      } catch (_) {
        setStatus('Chưa thể xác minh phiên đăng nhập lúc này.', 'error');
      }
    })();
  })();
  </script>
</body>
</html>
