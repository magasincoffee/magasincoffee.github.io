name: Validate MAGASIN GitHub Pages source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout github.io source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate production structure
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s app.js
          test -s employee/index.html
          test -s employee-v40.html
          test -s employee-v40-runtime.html
          test -s attendance-auto-ui.js
          test -s manager/index.html
          test -s manager-shell.html
          test -s auth-runtime-v4.js

          if grep -RIn --exclude-dir=.git 'magasincoffee/noibo' .github employee employee-v40-runtime.html employee-v40.html attendance-auto-ui.js; then
            echo 'Production runtime still references noibo.'
            exit 1
          fi

          if grep -RIn --exclude-dir=.git 'attendance-ui-finalize\|patch-attendance-runtime' .github; then
            echo 'Legacy attendance patch workflow reference found.'
            exit 1
          fi

          node --check app.js
          node --check auth-runtime-v4.js
          node --check attendance-auto-ui.js
