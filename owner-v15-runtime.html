<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>MAGASIN · Owner</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7fb}#app{display:block;width:100%;height:100%;border:0}</style></head>
<body><iframe id="app" title="MAGASIN Owner"></iframe>
<script>(function(){'use strict';
const frame=document.getElementById('app');
const load=(d,src)=>new Promise((resolve,reject)=>{if([...d.scripts].some(s=>(s.src||'').split('?')[0]===src))return resolve();const s=d.createElement('script');s.src=src;s.async=true;s.onload=resolve;s.onerror=reject;(d.body||d.documentElement).appendChild(s)});
const loadMany=async(d,list)=>{await Promise.all(list.map(src=>load(d,src)))};
const boot=async()=>{try{const d=frame.contentDocument;if(!d)return;
 await loadMany(d,[
  'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2',
  '/manager-ui-source-header-suppress-v1.js?v=20260903-owner-v15',
  '/manager-ui-shell-v3.js?v=20260903-owner-v15',
  '/manager-ui-header-fix-v1.js?v=20260903-owner-v15',
  '/manager-workforce-day-header-fix-v2.js?v=20260903-owner-v15',
  '/manager-workforce-layout-v2.js?v=20260903-owner-v15',
  '/manager-workforce-tabs-v2.js?v=20260903-owner-v15',
  '/app-time-picker-24h.js?v=20260903-owner-v15',
  '/manager-workforce-demand-v4.js?v=20260903-owner-v19'
 ]);
 const wireLazy=()=>{const view=d.querySelector('#view-workforce');if(!view||view.dataset.ownerV15Lazy==='1')return false;view.dataset.ownerV15Lazy='1';let reviewLoaded=false,publishLoaded=false;
 const loadReview=async()=>{if(reviewLoaded)return;reviewLoaded=true;await loadMany(d,[
  '/manager-workforce-review-v2.js?v=20260903-owner-v15',
  '/manager-workforce-review-store-filter-v1.js?v=20260903-owner-v15'
 ]);await loadMany(d,[
  '/manager-workforce-review-transfer-fix-v1.js?v=20260903-owner-v15',
  '/manager-workforce-review-edit-cleanup-v1.js?v=20260903-owner-v15',
  '/manager-workforce-review-time-color-v3.js?v=20260903-owner-v15'
 ]);};
 const loadPublish=async()=>{if(publishLoaded)return;publishLoaded=true;await load(d,'/manager-workforce-auto.js?v=20260903-owner-v15');};
 const click=e=>{const btn=e.target.closest?.('button[data-tab]');if(!btn)return;const key=btn.dataset.tab;if(key==='review')loadReview().catch(console.error);if(key==='publish')loadPublish().catch(console.error)};
 view.addEventListener('click',click,true);return true};
 const ready=()=>{if(!wireLazy())setTimeout(ready,100)};ready();
 const security=()=>{const has=[...d.scripts].some(x=>(x.src||'').includes('security-runtime.js'));if(!has){const s=d.createElement('script');s.src='/security-runtime.js?v=20260903-owner-v15';s.async=true;(d.body||d.documentElement).appendChild(s)}};setTimeout(security,300);
 }catch(e){console.error('Owner v15 runtime failed',e)}};
 frame.addEventListener('load',boot,{once:true});
 frame.src='/manager-v11.html?v=20260903-owner-v15-base';
})();</script></body></html>
