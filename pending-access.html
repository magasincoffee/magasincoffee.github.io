hy23F0v8XMkOud43s4PtyQjREvWtmhJJOKP8DB+nqfv3EzvqTgXiK9+uJzLZGxANJIGprM5XqHKgAKoAKoAKoACqACqACeBIB/gNgkzbIKx6OHgAAAABJRU5ErkJggg=="><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAGASIN · Chờ cấp quyền</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:#071426;color:#fff}body{display:grid;place-items:center;padding:24px}.card{width:min(560px,100%);background:#1d304d;border-radius:24px;padding:34px 32px;box-shadow:0 18px 50px rgba(0,0,0,.22)}.brand{text-align:center}.logo{width:76px;height:76px;border-radius:20px;background:#16c2cf;display:grid;place-items:center;margin:0 auto 16px}.logo svg{width:48px;height:48px}.brand h1{margin:0;font-size:32px}.brand p{margin:6px 0 0;color:#25d3dc;font-weight:600}.status-card{margin-top:24px;padding:18px;border-radius:14px;background:#243a5b;border:1px solid #365174}.status-card strong{display:block;font-size:18px}.status-card span{display:block;margin-top:6px;color:#cbd7e8;line-height:1.6}.info{margin-top:18px;display:grid;gap:10px}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;background:#f7f9fc;color:#172b45;border-radius:10px}.row span{color:#667b98}.row strong{word-break:break-word}.actions{margin-top:20px;display:grid;gap:10px}.btn{height:52px;border:0;border-radius:11px;font-weight:800;font-size:16px;cursor:pointer}.primary{background:#16c2cf;color:#fff}.secondary{background:transparent;color:#dce7f5;border:1px solid #48617f}.message{text-align:center;min-height:24px;margin-top:14px;color:#8ff0cb}.message.error{color:#ffb6aa}.hint{text-align:center;margin-top:16px;color:#aebed1;font-size:13px;line-height:1.6}@media(max-width:600px){.card{padding:28px 20px}.brand h1{font-size:28px}.row{flex-direction:column;gap:4px}}</style></head><body><main class="card"><div class="brand"><div class="logo"><svg viewBox="0 0 100 100" aria-hidden="true"><path fill="#fff" d="M18 82V53L28 22Q30 16 36 16H64Q70 16 72 22L82 53V82H67V50L61 29H39L33 50V82H18Z"/></svg></div><h1>MAGASIN</h1><p>Hệ thống quản lý nội bộ</p></div><section class="status-card"><strong>Tài khoản đang chờ cấp quyền</strong><span>Bạn đã đăng nhập thành công nhưng tài khoản chưa được quản lý kích hoạt. Bạn có thể gửi yêu cầu cấp quyền ngay tại đây.</span></section><div id="info" class="info"></div><div id="message" class="message"></div><div class="actions"><button id="requestBtn" class="btn primary" type="button">Gửi yêu cầu cấp quyền</button><button id="logoutBtn" class="btn secondary" type="button">Đăng xuất</button></div><div class="hint">Sau khi quản lý duyệt, bạn chỉ cần đăng nhập lại để vào hệ thống đầy đủ.</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(function(){'use strict';const SUPABASE_URL='https://menvbzlsncmpuvnaifxa.supabase.co';const SUPABASE_KEY='sb_publishable_HsvCS6HDZnCDInd9PUoh0g_V34wJVqx';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:true}});const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const msg=(t,e=false)=>{$('message').textContent=t||'';$('message').classList.toggle('error',e)};async function boot(){try{const {data,error}=await sb.auth.getSession();if(error)throw error;if(!data.session){location.replace('./index.html');return}const {data:p,error:pe}=await sb.from('profiles').select('id,full_name,username,email,phone,role,status').eq('id',data.session.user.id).single();if(pe)throw pe;if(String(p.status||'').toUpperCase()==='ACTIVE'){location.replace(['STAFF','EMPLOYEE'].includes(String(p.role||'STAFF').toUpperCase())?'./secure-app-runtime.html?target=employee':'./secure-app-runtime.html?target=manager');return}$('info').innerHTML=`<div class="row"><span>Họ và tên</span><strong>${esc(p.full_name||'—')}</strong></div><div class="row"><span>Tên đăng nhập</span><strong>${esc(p.username||'—')}</strong></div><div class="row"><span>Email</span><strong>${esc(p.email||data.session.user.email||'—')}</strong></div><div class="row"><span>Trạng thái</span><strong>Chờ cấp quyền</strong></div>`;}catch(e){msg(e.message||'Không thể tải thông tin tài khoản.',true)}}$('requestBtn').addEventListener('click',async()=>{const b=$('requestBtn');b.disabled=true;b.textContent='Đang gửi…';try{const {data,error}=await sb.rpc('submit_approval_request');if(error)throw error;const r=typeof data==='string'?JSON.parse(data):data;msg(r?.message||'Đã gửi yêu cầu cấp quyền.');if(r?.status==='ACTIVE')setTimeout(()=>location.replace('./secure-app-runtime.html?target=employee'),300)}catch(e){const m=String(e.message||e);msg(m==='EMAIL_NOT_CONFIRMED'?'Bạn cần xác nhận email trước khi gửi yêu cầu cấp quyền.':(m||'Không thể gửi yêu cầu.'),true)}finally{b.disabled=false;b.textContent='Gửi yêu cầu cấp quyền'}});$('logoutBtn').addEventListener('click',async()=>{await sb.auth.signOut();location.replace('./index.html')});sb.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT')location.replace('./index.html');if(event==='SIGNED_IN')boot()});boot();})();</script></body></html>
