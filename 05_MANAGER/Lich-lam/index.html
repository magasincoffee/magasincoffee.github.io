<iframe id="app" title="MAGASIN Quản lý · Xếp lịch" hidden></iframe>
<script src="/02_CORE/shared/shared-core-v1.js?v=20260903-core-structure1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async()=>{
  const C=window.MAGASIN_CORE;
  try{
    if(!C)throw Error('Shared Core chưa sẵn sàng.');
    const p=await C.supabase.requireActive();
    const role=String(p.role||'').toUpperCase();
        if(['STAFF','EMPLOYEE'].includes(role)){location.replace('/06_EMPLOYEE/');return}
    if(!['STORE_MANAGER','OWNER'].includes(role)){location.replace('/03_PLATFORM/01_AUTH/role-unavailable.html');return}
    const f=document.getElementById('app');
    f.src='/05_MANAGER/SchedulingV2/index.html?mode=live&draft-editor&release-preview&auto-preview&post-publish-preview&v=20261019-v2-live';
    f.hidden=false;
  }catch(e){
    console.error('Manager route access failed',e);
    location.replace('/');
  }
})();
</script>
</body>
