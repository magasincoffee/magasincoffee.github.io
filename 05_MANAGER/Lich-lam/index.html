<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>MAGASIN · Xếp lịch</title>
<style>
html,body{margin:0;min-height:100%;background:#f7f9fb;color:#17324a;font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{min-height:100dvh;display:grid;place-items:center;padding:24px;text-align:center;box-sizing:border-box}
main a{color:#087c94}
</style>
</head>
<body>
<main><div><strong>MAGASIN</strong><p id="message">Đang chuyển đến lịch làm việc…</p><a id="login" href="/03_PLATFORM/01_AUTH/" hidden>Đến trang đăng nhập</a></div></main>
<script src="/02_CORE/shared/shared-core-v1.js?v=20261019-scheduling-canonical-1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async()=>{
  try{
    const core=window.MAGASIN_CORE;
    if(!core?.supabase?.requireActive)throw Error('SHARED_CORE_NOT_READY');
    const profile=await core.supabase.requireActive();
    const role=String(profile?.role||'').toUpperCase();
    if(String(profile?.status||'').toUpperCase()!=='ACTIVE'){
      location.replace('/03_PLATFORM/01_AUTH/role-unavailable.html');
    }else if(role==='STORE_MANAGER'){
      location.replace('/manager/scheduling/');
    }else if(role==='OWNER'){
      location.replace('/owner/scheduling/');
    }else if(role==='STAFF'||role==='EMPLOYEE'){
      location.replace('/employee/');
    }else{
      location.replace('/03_PLATFORM/01_AUTH/role-unavailable.html');
    }
  }catch(error){
    console.error('Legacy scheduling bridge failed',error);
    document.getElementById('message').textContent='Không thể xác minh phiên truy cập. Vui lòng đăng nhập lại.';
    document.getElementById('login').hidden=false;
  }
})();
</script>
</body>
</html>
