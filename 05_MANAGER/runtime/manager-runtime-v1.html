<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>MAGASIN · Quản trị nội bộ</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7fb}#app{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="app" title="MAGASIN Manager / OWNER"></iframe>
<script>
(function(){
  'use strict';
  const frame=document.getElementById('app');
  const bridge=document.createElement('script');
  bridge.src='/05_MANAGER/runtime/compat/router/manager-route-bridge-v1.js?v=20260903-manager-structure1';
  bridge.async=false;
  document.head.appendChild(bridge);
  const allowedRouteHash=new Set(['dashboard','staff','workforce','schedule','swap','attendance','payroll-self-check']);
  const routeHash=allowedRouteHash.has(location.hash.slice(1))?location.hash:'';
  frame.src='/05_MANAGER/runtime/manager-shell-v1.html?v=20260926-ui2-011'+routeHash;
  frame.addEventListener('load',function(){
    try{
      const d=frame.contentDocument;
      if(!d)return;
      const load=(src)=>{const s=d.createElement('script');s.src=src;s.async=false;(d.body||d.documentElement).appendChild(s);return s};
      load('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');
      const addCss=(href)=>{const l=d.createElement('link');l.rel='stylesheet';l.href=href;d.head.appendChild(l);return l};
      addCss('/02_CORE/ui/magasin-ui-v2-tokens.css?v=20260925-ui2-004');
      addCss('/02_CORE/ui/magasin-ui-v2-primitives.css?v=20260925-ui2-004');
      addCss('/02_CORE/ui/magasin-ui-v2-shell.css?v=20260925-ui2-004');
      addCss('/02_CORE/ui/magasin-ui-v2-manager-operations.css?v=20260926-ui2-011');
      addCss('/02_CORE/ui/magasin-ui-v2-manager.css?v=20260926-ui2-011');
      d.body.dataset.magasinUiV2='';
      d.body.dataset.magasinShellV2='';
      d.body.dataset.magasinShellRole='manager';
      d.body.dataset.magasinShellMode='legacy-manager';
      d.defaultView.__MAGASIN_UI_V2_SHELL__={role:'MANAGER',mode:'legacy-manager'};
      load('/05_MANAGER/runtime/compat/router/manager-route-state-v2.js?v=20260903-manager-structure1');
      load('/02_CORE/ui/magasin-ui-v2-shell.js?v=20260925-ui2-004');
      load('/02_CORE/ui/magasin-ui-v2-manager-operations.js?v=20260926-ui2-011');
      load('/02_CORE/ui/magasin-ui-v2-manager.js?v=20260926-ui2-011');
      const waitForSupabase=()=>{
        if(window.supabase?.createClient || d.defaultView?.supabase?.createClient){
          load('/02_CORE/ui/app-time-picker-24h.js?v=20260903-manager-structure1');
          load('/05_MANAGER/Workforce/engine-v1.js?v=20260926-ui2-011');
        }else setTimeout(waitForSupabase,100);
      };
      waitForSupabase();
      let checks=0;
      const injectSecurity=()=>{
        const doc=frame.contentDocument;if(!doc)return;
        const hasSecurity=[...doc.scripts].some(x=>(x.src||'').includes('security-runtime.js'));
        if(!hasSecurity){const sec=doc.createElement('script');sec.src='/02_CORE/security/security-runtime.js?v=20260903-manager-structure1';sec.async=false;(doc.body||doc.documentElement).appendChild(sec)}
        if(++checks<10)setTimeout(injectSecurity,300);
      };
      setTimeout(injectSecurity,400);
    }catch(e){console.error('Manager runtime load failed',e)}
  },{once:true});
})();
</script>
</body>
</html>
