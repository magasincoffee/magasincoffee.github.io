name: Supervisor Profile Setup
# real Chrome + CDP setup

on:
  push:
    branches:
      - feat/supervisor-ui-adapter
    paths:
      - '.github/workflows/supervisor-profile-setup.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supervisor-profile-setup-${{ github.repository }}
  cancel-in-progress: false

jobs:
  profile-setup:
    if: github.actor == 'magasincoffee'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 08_INTEGRATIONS/supervisor
        shell: powershell

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pinned UI dependency
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Resolve installed Chrome
        run: |
          $candidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe"
          )
          $chrome = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $chrome) { throw "Installed Google Chrome not found." }
          "MAGASIN_SUPERVISOR_CHROME=$chrome" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Launch real Chrome with dedicated local profile
        run: |
          $profile = Join-Path $env:LOCALAPPDATA 'MAGASIN\BusinessOS\supervisor\browser_profile'
          New-Item -ItemType Directory -Force -Path $profile | Out-Null

          $args = @(
            '--remote-debugging-address=127.0.0.1',
            '--remote-debugging-port=9222',
            "--user-data-dir=$profile",
            '--no-first-run',
            '--no-default-browser-check',
            'https://chatgpt.com/'
          )

          Start-Process -FilePath $env:MAGASIN_SUPERVISOR_CHROME -ArgumentList $args

          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $null = Invoke-RestMethod -Uri 'http://127.0.0.1:9222/json/version' -TimeoutSec 2
              $ready = $true
              break
            } catch {
              Start-Sleep -Seconds 1
            }
          }

          if (-not $ready) { throw 'Real Chrome remote-debug endpoint did not become ready.' }
          Write-Host 'REAL_CHROME_READY=True'
          Write-Host 'The Owner must enter credentials directly in this real Chrome window.'

      - name: Attach Supervisor and wait for authenticated MAGASIN conversation
        run: |
          node src/ui/profile-setup-cli.mjs --cdp-url http://127.0.0.1:9222
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Confirm local-only target
        run: |
          $target = Join-Path $env:LOCALAPPDATA 'MAGASIN\BusinessOS\supervisor\target.json'
          if (-not (Test-Path $target)) { throw 'Local supervisor target was not created.' }
          Write-Host 'PASS: real Chrome profile and conversation target exist locally.'
          Write-Host 'No target URL, conversation ID, credentials, cookies, tokens, or message text are uploaded.'
