name: Patch Attendance runtime

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/fix/attendance-runtime-clean'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/attendance-runtime-clean

      - name: Patch renderAttendance only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('employee-v40-runtime.html')
          s = p.read_text(encoding='utf-8')
          pattern = r"async function renderAttendance\(\)\{.*?\n    \}\n\n    async function clockIn"
          replacement = "async function renderAttendance(){\n      await loadAttendanceHistory();\n    }\n\n    async function clockIn"
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected exactly one renderAttendance block, got {n}')
          p.write_text(s2, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'async function renderAttendance(){' employee-v40-runtime.html
          grep -A8 'async function renderAttendance' employee-v40-runtime.html | grep -q 'loadAttendanceHistory'

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MAGASIN'
          git config user.email 'bachvantoi1994@gmail.com'
          git add employee-v40-runtime.html
          git rm .github/workflows/patch-attendance-runtime.yml
          git commit -m 'fix(attendance): preserve V40 attendance form'
          git push origin fix/attendance-runtime-clean
