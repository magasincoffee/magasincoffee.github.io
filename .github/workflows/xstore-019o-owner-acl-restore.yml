name: XSTORE-019O Isolated Owner ACL Restore Gate

on:
  pull_request:
    paths:
      - '.github/workflows/xstore-019o-owner-acl-restore.yml'
      - '09_QA/people-shift/xstore-019o-owner-acl-recovery-fingerprint.sql'
  push:
    branches: [main]
    paths:
      - '.github/workflows/xstore-019o-owner-acl-restore.yml'
      - '09_QA/people-shift/xstore-019o-owner-acl-recovery-fingerprint.sql'

permissions:
  contents: read
  actions: read

concurrency:
  group: xstore-019o-acl-restore-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-preflight:
    name: Verify read-only isolated-restore contract; no Secrets on PR
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify metadata-only catalog fingerprint and trusted-main admission
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const y=fs.readFileSync('.github/workflows/xstore-019o-owner-acl-restore.yml','utf8');
          const sql=fs.readFileSync('09_QA/people-shift/xstore-019o-owner-acl-recovery-fingerprint.sql','utf8');
          for(const p of ['github.event_name == \x27push\x27',"github.ref == 'refs/heads/main'",
            'MAGASIN_NOIBO_BACKUP_DATABASE_URL','MAGASIN_NOIBO_BACKUP_ENCRYPTION_KEY',
            'XSTORE_019O_NEW_BACKUP_ACL_PRESENT','pg_dump --format=custom',
            'supabase/postgres:17.6.1.173','--network none','pg_restore --exit-on-error',
            'XSTORE_019O_REAL_OWNER_ACL_ISOLATED_RESTORE=PASS'])
            assert(y.includes(p),'RESTORE_SOURCE_CONTRACT_MISSING');
          assert(y.includes('persist-credentials: false') && y.includes('contents: read'),'UNSAFE_GITHUB_PERMISSIONS');
          assert(sql.includes('b5b88de4957daa0e8ad372002134cdf0') &&
            sql.includes('e28436fb4f8558416d23eb8f5af57795'),'LIVE_FINGERPRINT_MISSING');
          assert(sql.includes('pg_policies') && sql.includes('pg_proc') && sql.includes('pg_class'),'INCOMPLETE_ACL_POLICY_AUDIT');
          const cap=y.lastIndexOf('\n      - name: Capture fresh ACL-bearing production backup (read-only)\n');
          assert(cap>=0, 'BACKUP_CAPTURE_STEP_MISSING');
          const capture=y.slice(cap,y.indexOf('\n      - name: AES-256-GCM encrypt',cap));
          assert(capture.includes('pg_dump --format=custom') && !capture.includes('pg_dump --format=custom --no-acl'),'BACKUP_MUST_INCLUDE_ACL');
          assert(capture.includes('pg_restore --list') && capture.includes('XSTORE_019O_NEW_BACKUP_ACL_PRESENT'),'ACL_TOC_REQUIREMENT_MISSING');
          const roles=fs.readFileSync('09_QA/people-shift/xstore-019o-isolated-platform-roles.sql','utf8');
          assert(roles.includes('ISOLATED_ROLE_BOOTSTRAP_INCOMPLETE') &&
            roles.includes('supabase_privileged_role') &&
            y.includes('xstore019o-acl-proof:/tmp/platform-roles.sql'),'MISSING_ISOLATED_ROLE_REPLAY');
          const restoreStart=y.lastIndexOf('\n      - name: Restore archive WITH owner and ACL; validate actual catalog parity\n');
          assert(restoreStart>=0,'ISOLATED_RESTORE_STEP_NOT_FOUND');
          const block=y.slice(restoreStart);
          assert(block.includes('pg_restore --exit-on-error') && !block.includes('pg_restore --exit-on-error --no-owner'),'OWNER_ACL_WOULD_BE_SKIPPED');
          const usedActions=y.split('\n').filter(x=>/^\s*-\s*uses:/.test(x));
          const eventHeader=y.slice(0,y.indexOf('\njobs:'));
          assert(usedActions.filter(x=>/upload-artifact@/.test(x)).length===1 && !eventHeader.includes('pull_request_target'),'UNSAFE_ARTIFACT_OR_EVENT');
          assert(y.includes('if: always() && steps.encryption.outcome == \'success\'') && y.includes('xstore-019o-acl-full-encrypted-') && y.includes('retention-days: 7'),'ENCRYPTED_ONLY_RECOVERY_ARTIFACT_REQUIRED');
          console.log('XSTORE_019O_OWNER_ACL_SOURCE_ADMISSION=PASS; NO_PRODUCTION_SECRETS_ON_PR');
          NODE

  owner-acl-isolated-restore:
    name: Replay genuine archive owners/ACL and compare live policy fingerprints
    needs: source-preflight
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BACKUP_WORK: ${{ github.workspace }}/.xstore-019o-private-acl
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare secured read-only production connection
        shell: bash
        env:
          DB_URL: ${{ secrets.MAGASIN_NOIBO_BACKUP_DATABASE_URL }}
          BACKUP_KEY: ${{ secrets.MAGASIN_NOIBO_BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          node 09_QA/people-shift/xstore-019o-cloud-backup.mjs prepare
      - name: Capture fresh ACL-bearing production backup (read-only)
        shell: bash
        run: |
          set -euo pipefail
          # Full pg_dump is a read-only consistent snapshot. Never omit ACL.
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            --volume "$BACKUP_WORK:/backup" \
            --env PGSERVICE=magasin \
            --env PGSERVICEFILE=/backup/service.conf \
            --env PGPASSFILE=/backup/pgpass.conf \
            postgres:17 \
            pg_dump --format=custom --lock-wait-timeout=15s \
              --file=/backup/production.dump
          docker run --rm \
            --volume "$BACKUP_WORK:/backup:ro" postgres:17 \
            pg_restore --list /backup/production.dump > "$RUNNER_TEMP/xstore019o-private-toc"
          # The old archive omitted GRANT/REVOKE; do not reuse it for ACL parity.
          # Never output TOC or object names.
          if ! grep -Eq '^[0-9]+;.*[[:space:]]ACL[[:space:]]' "$RUNNER_TEMP/xstore019o-private-toc"; then
            echo '::error::XSTORE_019O_ACL_ENTRIES_MISSING_FROM_NEW_BACKUP'
            exit 1
          fi
          echo 'XSTORE_019O_NEW_BACKUP_ACL_PRESENT=PASS; FULL_ARCHIVE=PASS; NO_PRODUCTION_WRITE'
      - name: AES-256-GCM encrypt full ACL-bearing archive
        id: encryption
        shell: bash
        env:
          BACKUP_KEY: ${{ secrets.MAGASIN_NOIBO_BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          node 09_QA/people-shift/xstore-019o-cloud-backup.mjs encrypt
      - name: Authenticate fresh archive without exposing data
        shell: bash
        env:
          BACKUP_KEY: ${{ secrets.MAGASIN_NOIBO_BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const m=JSON.parse(fs.readFileSync(process.env.BACKUP_WORK+'/manifest.json','utf8'));
          assert.equal(m.project_ref,'menvbzlsncmpuvnaifxa');
          assert.equal(m.encrypted_algorithm,'AES-256-GCM');
          assert.equal(m.restore_verified,false);
          assert.match(m.dump_sha256,/^[a-f0-9]{64}$/i);
          console.log('XSTORE_019O_NEW_ACL_BACKUP_ENCRYPTED_MANIFEST=PASS; RESTORE_NOT_YET_VERIFIED');
          NODE
          node 09_QA/people-shift/xstore-019o-cloud-backup.mjs decrypt
      - name: Restore archive WITH owner and ACL; validate actual catalog parity
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker rm -f xstore019o-acl-proof >/dev/null 2>&1 || true
            # Preserve encrypted archive until the next artifact-upload step.
            # Final always() cleanup wipes it after success or failure.
          }
          trap cleanup EXIT
          docker run --rm -d --network none --name xstore019o-acl-proof \
            --env POSTGRES_PASSWORD=synthetic-disposable-only \
            supabase/postgres:17.6.1.173 \
            postgres -c config_file=/etc/postgresql/postgresql.conf >/dev/null
          stable=0
          old_start=""
          for i in $(seq 1 75); do
            start=""
            if docker exec xstore019o-acl-proof pg_isready -U postgres -q 2>/dev/null; then
              start="$(docker exec xstore019o-acl-proof \
                psql -U postgres -d postgres -AtX -c "select pg_postmaster_start_time()::text" 2>/dev/null || true)"
            fi
            if [ -n "$start" ] && [ "$start" = "$old_start" ]; then
              stable=$((stable+1))
            else
              stable=0
            fi
            old_start="$start"
            if [ "$stable" -ge 8 ]; then break; fi
            sleep 2
          done
          if [ "$stable" -lt 8 ]; then
            echo '::error::ISOLATED_PG17_NOT_READY'
            exit 1
          fi
          echo 'XSTORE_019O_OWNER_ACL_POSTGRES_STABLE=PASS'
          docker exec xstore019o-acl-proof createdb -U postgres xstore019o_acl
          # Match non-password role names/attributes and memberships from the
          # production read-only catalog ONLY inside the network-isolated clone.
          docker cp 09_QA/people-shift/xstore-019o-isolated-platform-roles.sql \
            xstore019o-acl-proof:/tmp/platform-roles.sql
          docker exec xstore019o-acl-proof \
            psql -U supabase_admin -d postgres -q -v ON_ERROR_STOP=1 \
              -f /tmp/platform-roles.sql >/dev/null
          echo 'XSTORE_019O_ISOLATED_ROLE_MEMBERSHIP_BOOTSTRAP=PASS; NO_PRODUCTION_ROLE_WRITE'
          # Unlike historical --no-owner/--no-acl restore, this must reproduce
          # the real archive's owner and GRANT/REVOKE commands, or fail closed.
          if ! docker exec -i xstore019o-acl-proof \
            pg_restore --exit-on-error \
              --username=supabase_admin --dbname=xstore019o_acl \
              < "$BACKUP_WORK/restore-check.dump" >/dev/null 2>"$RUNNER_TEMP/xstore019o-pgrestore-stderr"; then
            # Classify first failure without outputting any database metadata, SQL,
            # restored data, role names, credentials or pg_restore stderr.
            cause=UNCLASSIFIED_RESTORE_FAILURE
            if grep -Eiq 'role .+ does not exist' "$RUNNER_TEMP/xstore019o-pgrestore-stderr"; then
              cause=MISSING_DATABASE_ROLE
            elif grep -Eiq 'must be member of role' "$RUNNER_TEMP/xstore019o-pgrestore-stderr"; then
              cause=MISSING_ROLE_MEMBERSHIP
            elif grep -Eiq 'must be owner of|not owner of' "$RUNNER_TEMP/xstore019o-pgrestore-stderr"; then
              cause=OWNER_PRIVILEGE
            elif grep -Eiq 'permission denied' "$RUNNER_TEMP/xstore019o-pgrestore-stderr"; then
              cause=INSUFFICIENT_RESTORE_PRIVILEGE
            elif grep -Eiq 'already exists' "$RUNNER_TEMP/xstore019o-pgrestore-stderr"; then
              cause=RESTORE_OBJECT_COLLISION
            elif grep -Eiq 'extension|unsupported' "$RUNNER_TEMP/xstore019o-pgrestore-stderr"; then
              cause=EXTENSION_DEPENDENCY
            fi
            echo "::error::XSTORE_019O_REAL_OWNER_ACL_ISOLATED_RESTORE=FAIL; CAUSE=$cause; NO_PRODUCTION_WRITE"
            exit 1
          fi
          docker cp 09_QA/people-shift/xstore-019o-owner-acl-recovery-fingerprint.sql \
            xstore019o-acl-proof:/tmp/owneracl-fingerprint.sql
          proof="$(docker exec xstore019o-acl-proof \
            psql -U postgres -d xstore019o_acl -AtX -v ON_ERROR_STOP=1 \
              -f /tmp/owneracl-fingerprint.sql)"
          if [ "$proof" != PASS ]; then
            echo '::error::XSTORE_019O_OWNER_ACL_RLS_FINGERPRINT=FAIL; RECOVERY_NOT_QUALIFIED'
            exit 1
          fi
          echo 'XSTORE_019O_REAL_OWNER_ACL_ISOLATED_RESTORE=PASS; OWNER_ACL_RLS_FINGERPRINTS=PASS; NO_PRODUCTION_WRITE; NO_PII_OUTPUT'
          node 09_QA/people-shift/xstore-019o-cloud-backup.mjs mark-restore
      - name: Store encrypted-only recovery artifact (no plaintext)
        if: always() && steps.encryption.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: xstore-019o-acl-full-encrypted-${{ github.run_id }}
          path: |
            ${{ env.BACKUP_WORK }}/production.dump.aes256gcm
            ${{ env.BACKUP_WORK }}/manifest.json
          if-no-files-found: error
          retention-days: 7
      - name: Clean private decrypted data after failure or success
        if: always()
        shell: bash
        run: |
          docker rm -f xstore019o-acl-proof >/dev/null 2>&1 || true
          rm -rf "$BACKUP_WORK"
          rm -f "$RUNNER_TEMP/xstore019o-private-toc" "$RUNNER_TEMP/xstore019o-pgrestore-stderr"
          echo 'XSTORE_019O_PRIVATE_ACL_RESTORE_CLEANUP=PASS'
