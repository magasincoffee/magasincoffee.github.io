name: Scheduling P0 Clock 526 Browser QA
on:
  pull_request:
    paths:
      - '05_MANAGER/SchedulingV2/editor-ui-v1.js'
      - '05_MANAGER/SchedulingV2/post-publish-ui-v1.js'
      - '09_QA/people-shift/scheduling-526-clock-*'
      - '.github/workflows/scheduling-526-clock-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  modal-clock:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JS syntax and 30-minute SQL guard contracts
        run: |
          node --check 05_MANAGER/SchedulingV2/editor-ui-v1.js
          node --check 05_MANAGER/SchedulingV2/post-publish-ui-v1.js
          node --test 09_QA/people-shift/scheduling-v2-time-boundaries.test.mjs
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Serve isolated QA fixture, no production backend
        run: |
          nohup python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/scheduling-526-server.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8767/09_QA/people-shift/scheduling-526-clock-fixture.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/scheduling-526-server.log
          exit 1
      - name: Browser — en-US and vi-VN actual 24h controls, 390px and 1440px
        env:
          QA_BASE_URL: http://127.0.0.1:8767
        run: node 09_QA/people-shift/scheduling-526-clock-browser.mjs