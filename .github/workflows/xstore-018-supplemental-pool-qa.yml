name: XSTORE-018 Supplemental Pool QA

on:
  push:
    paths:
      - '05_MANAGER/Workforce/draft-publish-v1.js'
      - '05_MANAGER/Workforce/engine-v1.js'
      - '09_QA/people-shift/manager-workforce-canonical-fixture.html'
      - '09_QA/people-shift/xstore-018-supplemental-pool-v1.test.mjs'
      - '09_QA/people-shift/xstore-018-supplemental-pool-browser.mjs'
      - '.github/workflows/xstore-018-supplemental-pool-qa.yml'
  pull_request:
    paths:
      - '05_MANAGER/Workforce/draft-publish-v1.js'
      - '05_MANAGER/Workforce/engine-v1.js'
      - '09_QA/people-shift/manager-workforce-canonical-fixture.html'
      - '09_QA/people-shift/xstore-018-supplemental-pool-v1.test.mjs'
      - '09_QA/people-shift/xstore-018-supplemental-pool-browser.mjs'
      - '.github/workflows/xstore-018-supplemental-pool-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supplemental-pool-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check XSTORE-018 runtime syntax
        run: node --check 05_MANAGER/Workforce/draft-publish-v1.js
      - name: Run XSTORE-018 static contract
        run: node --test 09_QA/people-shift/xstore-018-supplemental-pool-v1.test.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local QA server
        shell: bash
        run: |
          mkdir -p qa-artifacts/people-shift
          nohup python3 -m http.server 8775 --bind 127.0.0.1 > /tmp/xstore018-http.log 2>&1 &
          echo $! > /tmp/xstore018-http.pid
          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsS http://127.0.0.1:8775/09_QA/people-shift/ui2-012-manager-scheduling-fixture.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/xstore018-http.log || true
          exit 1
      - name: Run XSTORE-018 supplemental pool browser E2E
        env:
          QA_BASE_URL: http://127.0.0.1:8775
          QA_OUT: qa-artifacts/people-shift
        run: node 09_QA/people-shift/xstore-018-supplemental-pool-browser.mjs
      - name: Upload XSTORE-018 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xstore-018-supplemental-pool-${{ github.run_id }}
          path: qa-artifacts/people-shift/xstore-018-*
          if-no-files-found: warn
          retention-days: 30
