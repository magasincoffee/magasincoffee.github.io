name: Owner Control Tower Tests

on:
  push:
    paths:
      - '04_OWNER/ControlTower/**'
      - '04_OWNER/index.html'
      - '09_QA/owner-control-tower/**'
      - '.github/workflows/owner-control-tower-tests.yml'
  pull_request:
    paths:
      - '04_OWNER/ControlTower/**'
      - '04_OWNER/index.html'
      - '09_QA/owner-control-tower/**'
      - '.github/workflows/owner-control-tower-tests.yml'

permissions:
  contents: read

jobs:
  unit-fixture-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Control Tower unit/fixture tests
        run: node --test 09_QA/owner-control-tower/*.test.mjs

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local QA server
        shell: bash
        run: |
          mkdir -p qa-artifacts/control-tower
          nohup python3 -m http.server 8766 --bind 127.0.0.1 > /tmp/control-tower-http.log 2>&1 &
          echo $! > /tmp/control-tower-http.pid
          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsS http://127.0.0.1:8766/04_OWNER/ > /dev/null && curl -fsS http://127.0.0.1:8766/04_OWNER/ControlTower/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/control-tower-http.log || true
          exit 1

      - name: Run Control Tower browser E2E
        env:
          QA_BASE_URL: http://127.0.0.1:8766
          QA_OUT: qa-artifacts/control-tower
        run: node 09_QA/owner-control-tower/browser-e2e.mjs

      - name: Upload Control Tower browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-control-tower-e2e-${{ github.run_id }}
          path: qa-artifacts/control-tower/
          if-no-files-found: warn
          retention-days: 30
