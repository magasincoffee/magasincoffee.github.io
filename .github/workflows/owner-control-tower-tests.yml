name: Owner Control Tower Tests

on:
  push:
    paths:
      - '04_OWNER/ControlTower/**'
      - '09_QA/owner-control-tower/**'
      - '.github/workflows/owner-control-tower-tests.yml'
  pull_request:
    paths:
      - '04_OWNER/ControlTower/**'
      - '09_QA/owner-control-tower/**'
      - '.github/workflows/owner-control-tower-tests.yml'

permissions:
  contents: read

jobs:
  unit-fixture-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Control Tower unit/fixture tests
        run: node --test 09_QA/owner-control-tower/*.test.mjs
