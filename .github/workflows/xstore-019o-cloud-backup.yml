name: XSTORE-019O Cloud Backup and Restore Gate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/xstore-019o-cloud-backup.yml"
      - "09_QA/people-shift/xstore-019o-cloud-backup.mjs"
  pull_request:
    paths:
      - ".github/workflows/xstore-019o-cloud-backup.yml"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type XSTORE-019O to start a read-only production backup"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: xstore-019o-cloud-backup-only
  cancel-in-progress: false

jobs:
  source-syntax:
    name: Validate cloud backup runner source (no database)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node syntax checks, no database or secrets
        run: |
          set -euo pipefail
          node --check 09_QA/people-shift/xstore-019o-cloud-backup.mjs
          export BACKUP_WORK="$(mktemp -d)"
          trap 'rm -rf "$BACKUP_WORK"' EXIT
          export DB_URL="postgresql://postgres.menvbzlsncmpuvnaifxa:synthetic-only@aws-0-test.pooler.supabase.com:5432/postgres"
          export BACKUP_KEY="0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          node 09_QA/people-shift/xstore-019o-cloud-backup.mjs prepare
          head -c 4096 /dev/urandom > "$BACKUP_WORK/production.dump"
          node 09_QA/people-shift/xstore-019o-cloud-backup.mjs encrypt
          node 09_QA/people-shift/xstore-019o-cloud-backup.mjs decrypt
          cmp "$BACKUP_WORK/production.dump" "$BACKUP_WORK/restore-check.dump"
          test "$(node -p "require(process.env.BACKUP_WORK + '/manifest.json').restore_verified")" = "false"
          echo "CLOUD_BACKUP_CRYPTO_ROUNDTRIP=PASS; ONLY_SYNTHETIC_DATA; NO_PRODUCTION_ACCESS"

  isolated-restore-image-preflight:
    name: Test Supabase PG17 restore image without production data
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Boot network-isolated Supabase PostgreSQL 17 and validate Vault
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -d --network none --name xstore019o-supabase-image-smoke \
            --env POSTGRES_PASSWORD=synthetic-only-do-not-use-in-production \
            supabase/postgres:17.6.1.173 \
            postgres -c config_file=/etc/postgresql/postgresql.conf
          trap 'docker rm -f xstore019o-supabase-image-smoke >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if docker exec xstore019o-supabase-image-smoke pg_isready -U postgres -q; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1
          docker exec xstore019o-supabase-image-smoke \
            createdb -U postgres xstore019o_synthetic
          available=$(docker exec xstore019o-supabase-image-smoke \
            psql -U postgres -d xstore019o_synthetic -AtX -c \
              "select case when exists (select 1 from pg_available_extensions where name='supabase_vault') then 'PASS' else 'FAIL' end")
          test "$available" = PASS
          # Synthetic-only end-to-end extension restore, no Supabase credentials or personal data.
          docker exec xstore019o-supabase-image-smoke \
            psql -U postgres -d xstore019o_synthetic -v ON_ERROR_STOP=1 \
              -c 'CREATE SCHEMA vault' \
              -c 'CREATE EXTENSION supabase_vault WITH SCHEMA vault' \
              -c 'CREATE TABLE public.xstore_backup_synthetic (id int primary key, note text)' \
              -c "INSERT INTO public.xstore_backup_synthetic VALUES (1, 'synthetic')"
          docker exec xstore019o-supabase-image-smoke \
            pg_dump -U postgres --format=custom --no-owner --no-acl \
              --dbname=xstore019o_synthetic > "$RUNNER_TEMP/xstore-synthetic.dump"
          docker exec xstore019o-supabase-image-smoke \
            createdb -U postgres xstore019o_synthetic_restored
          docker exec -i xstore019o-supabase-image-smoke \
            pg_restore -U supabase_admin --exit-on-error --no-owner --no-acl \
              --dbname=xstore019o_synthetic_restored \
              < "$RUNNER_TEMP/xstore-synthetic.dump"
          restored=$(docker exec xstore019o-supabase-image-smoke \
            psql -U postgres -d xstore019o_synthetic_restored -AtX -c \
              "select case when exists (select 1 from pg_extension where extname='supabase_vault') and exists (select 1 from public.xstore_backup_synthetic where id=1 and note='synthetic') then 'PASS' else 'FAIL' end")
          test "$restored" = PASS
          echo 'XSTORE_ISOLATED_SUPABASE_PG17_SYNTHETIC_FULL_RESTORE=PASS; NO_PRODUCTION_ACCESS'

  encrypted-backup-restore:
    needs: source-syntax
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirmation == 'XSTORE-019O'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      BACKUP_WORK: ${{ github.workspace }}/.xstore-019o-cloud-work
    steps:
      - name: Fetch fixed-source backup runner
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check that cloud database and encryption secrets exist
        env:
          DB_URL: ${{ secrets.MAGASIN_NOIBO_BACKUP_DATABASE_URL }}
          BACKUP_KEY: ${{ secrets.MAGASIN_NOIBO_BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          node 09_QA/people-shift/xstore-019o-cloud-backup.mjs prepare
      - name: Capture production PostgreSQL with Docker client v17 (read-only)
        run: |
          set -euo pipefail
          docker run --rm --network host \
            --volume "$BACKUP_WORK:/backup" \
            --env PGSERVICE=magasin \
            --env PGSERVICEFILE=/backup/service.conf \
            --env PGPASSFILE=/backup/pgpass.conf \
            postgres:17 \
            pg_dump --format=custom --no-owner --no-acl \
              --lock-wait-timeout=15s --file=/backup/production.dump
          docker run --rm \
            --volume "$BACKUP_WORK:/backup:ro" postgres:17 \
            pg_restore --list /backup/production.dump > /dev/null
      - name: Encrypt the archive before it can be uploaded
        id: encryption
        env:
          BACKUP_KEY: ${{ secrets.MAGASIN_NOIBO_BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          node 09_QA/people-shift/xstore-019o-cloud-backup.mjs encrypt
      - name: Authenticate decryption in isolated runner
        env:
          BACKUP_KEY: ${{ secrets.MAGASIN_NOIBO_BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          node 09_QA/people-shift/xstore-019o-cloud-backup.mjs decrypt
      - name: Start network-isolated Supabase-compatible PostgreSQL 17
        run: |
          set -euo pipefail
          # No Docker network: restored triggers/functions cannot call production or external services.
          docker run --rm -d --network none --name xstore019o-temporary-restore \
            --env POSTGRES_PASSWORD=isolated-only-not-production \
            supabase/postgres:17.6.1.173 \
            postgres -c config_file=/etc/postgresql/postgresql.conf
          ready=0
          for i in $(seq 1 60); do
            if docker exec xstore019o-temporary-restore pg_isready -U postgres -q; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo "::error::Isolated Supabase Postgres did not become ready"
            exit 1
          fi
          docker exec xstore019o-temporary-restore \
            createdb -U postgres xstore019o_restore
      - name: Restore full database archive and verify critical relations
        run: |
          set -euo pipefail
          # Full archive, fail-closed on ANY SQL/extension/schema error; no --exclude options.
          # The ephemeral Supabase superuser is required to restore Vault's internal tables.
          # Never use this role, its password, or these permissions against production.
          # Transfer plaintext only through stdin into the disposable network-isolated DB.
          docker exec -i xstore019o-temporary-restore \
            pg_restore --exit-on-error --no-owner --no-acl \
              --username=supabase_admin --dbname=xstore019o_restore \
              < "$BACKUP_WORK/restore-check.dump"
          restored=$(docker exec xstore019o-temporary-restore \
            psql -U postgres -d xstore019o_restore -AtX -c \
              "select case when to_regclass('public.profiles') is not null and to_regclass('public.work_schedules') is not null and exists (select 1 from pg_extension where extname='supabase_vault') then 'PASS' else 'FAIL' end")
          if [ "$restored" != PASS ]; then
            echo "::error::Required restored relations or Supabase Vault extension missing"
            exit 1
          fi
          node 09_QA/people-shift/xstore-019o-cloud-backup.mjs mark-restore
      - name: Store ONLY AES-256-GCM encrypted database backup
        if: always() && steps.encryption.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: xstore-019o-noibo-encrypted-${{ github.run_id }}
          path: |
            ${{ env.BACKUP_WORK }}/production.dump.aes256gcm
            ${{ env.BACKUP_WORK }}/manifest.json
          if-no-files-found: error
          retention-days: 7
      - name: Destroy plaintext copies and temporary credentials
        if: always()
        run: |
          set +e
          docker rm -f xstore019o-temporary-restore >/dev/null 2>&1 || true
          rm -f "$BACKUP_WORK/production.dump" "$BACKUP_WORK/restore-check.dump"
          rm -f "$BACKUP_WORK/pgpass.conf" "$BACKUP_WORK/service.conf"
          echo "CLOUD_BACKUP_CLEANUP_COMPLETED; NO_PRODUCTION_DDL_OR_DATA_WRITE"
