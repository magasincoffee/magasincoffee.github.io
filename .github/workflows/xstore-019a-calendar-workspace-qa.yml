name: XSTORE-019A Calendar Workspace QA

on:
  push:
    paths:
      - '05_MANAGER/Workforce/draft-publish-v1.js'
      - '05_MANAGER/Workforce/manager-scheduling-ui2-v1.js'
      - '09_QA/people-shift/xstore-016-scheduling-ia-v1.test.mjs'
      - '09_QA/people-shift/xstore-016-scheduling-ia-browser.mjs'
      - '09_QA/people-shift/xstore-019a-calendar-workspace-v1.test.mjs'
      - '.github/workflows/xstore-019a-calendar-workspace-qa.yml'
  pull_request:
    paths:
      - '05_MANAGER/Workforce/draft-publish-v1.js'
      - '05_MANAGER/Workforce/manager-scheduling-ui2-v1.js'
      - '09_QA/people-shift/xstore-016-scheduling-ia-v1.test.mjs'
      - '09_QA/people-shift/xstore-016-scheduling-ia-browser.mjs'
      - '09_QA/people-shift/xstore-019a-calendar-workspace-v1.test.mjs'
      - '.github/workflows/xstore-019a-calendar-workspace-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  single-store-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check calendar runtime
        run: |
          node --check 05_MANAGER/Workforce/draft-publish-v1.js
          node --check 05_MANAGER/Workforce/manager-scheduling-ui2-v1.js

      - name: Run XSTORE-019A static contracts
        run: |
          node --test 09_QA/people-shift/xstore-019a-calendar-workspace-v1.test.mjs
          node --test 09_QA/people-shift/xstore-016-scheduling-ia-v1.test.mjs
          node --test 09_QA/people-shift/xstore-017-inline-shortage-v1.test.mjs
          node --test 09_QA/people-shift/xstore-018-supplemental-pool-v1.test.mjs

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start exact-head QA server
        shell: bash
        run: |
          mkdir -p qa-artifacts/xstore-019a
          nohup python3 -m http.server 8773 --bind 127.0.0.1 > /tmp/xstore019a-http.log 2>&1 &
          echo $! > /tmp/xstore019a-http.pid
          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsS http://127.0.0.1:8773/09_QA/people-shift/ui2-012-manager-scheduling-fixture.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/xstore019a-http.log || true
          exit 1

      - name: Run single-store calendar browser acceptance
        env:
          QA_BASE_URL: http://127.0.0.1:8773
          QA_OUT: qa-artifacts/xstore-019a
        run: node 09_QA/people-shift/xstore-016-scheduling-ia-browser.mjs

      - name: Upload XSTORE-019A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xstore-019a-calendar-workspace-${{ github.run_id }}
          path: qa-artifacts/xstore-019a/
          if-no-files-found: warn
          retention-days: 30
