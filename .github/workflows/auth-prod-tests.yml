name: AUTH-PROD Regression Contract

on:
  pull_request:
    paths:
      - '03_PLATFORM/01_AUTH/**'
      - '04_OWNER/Access/**'
      - '09_QA/auth/**'
      - '01_DOCS/MAGASIN/05_SYSTEM/MAGASIN_AUTH_PROD_*'
      - '.github/workflows/auth-prod-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-prod-red-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify AUTH-PROD desired-state contract
        shell: bash
        run: |
          node --test 09_QA/auth/auth-prod-001-regression-contract.test.mjs 2>&1 | tee /tmp/auth-prod-contract.log
          grep -Fq "# tests 6" /tmp/auth-prod-contract.log
          grep -Fq "# pass 6" /tmp/auth-prod-contract.log
          grep -Fq "# fail 0" /tmp/auth-prod-contract.log
          grep -Fq "ok 1 - AUTH-PROD D1: pending surface provides an authenticated escape and access recheck" /tmp/auth-prod-contract.log
          grep -Fq "ok 2 - AUTH-PROD D1/D3: signup cannot leave a returned PENDING session capturing the browser" /tmp/auth-prod-contract.log
          grep -Fq "ok 3 - AUTH-PROD D2: Owner activation is explicit and independent from ACCOUNTANT role assignment" /tmp/auth-prod-contract.log
          grep -Fq "ok 4 - AUTH-PROD D3: Auth boot explicitly distinguishes ACTIVE, PENDING and INACTIVE" /tmp/auth-prod-contract.log
          grep -Fq "ok 5 - AUTH-PROD baseline: username/email resolution and role routes remain canonical" /tmp/auth-prod-contract.log
          grep -Fq "ok 6 - AUTH-PROD D4: credential failure path remains separate from authorization mutation" /tmp/auth-prod-contract.log
          echo "AUTH_PROD_004_STATE_MACHINE_CONTRACT=PASS"

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start AUTH-PROD QA server
        shell: bash
        run: |
          nohup python3 -m http.server 8769 --bind 127.0.0.1 > /tmp/auth-prod-http.log 2>&1 &
          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsS http://127.0.0.1:8769/03_PLATFORM/01_AUTH/pending-access.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/auth-prod-http.log || true
          exit 1

      - name: Run AUTH-PROD-002 pending browser regression
        env:
          QA_BASE_URL: http://127.0.0.1:8769
        run: node 09_QA/auth/auth-prod-002-pending-browser.mjs

      - name: Run AUTH-PROD-003 Owner activation browser regression
        env:
          QA_BASE_URL: http://127.0.0.1:8769
        run: node 09_QA/auth/auth-prod-003-owner-activation-browser.mjs

      - name: Run AUTH-PROD-004 auth state-machine browser regression
        env:
          QA_BASE_URL: http://127.0.0.1:8769
        run: node 09_QA/auth/auth-prod-004-auth-state-machine-browser.mjs
