name: XSTORE-014 Interval Auto Schedule QA

on:
  push:
    paths:
      - '07_DATABASE/migrations/20261004222500_xstore_014_interval_composed_auto_schedule_v1.sql'
      - '09_QA/people-shift/xstore-014-interval-auto-schedule-v1.test.mjs'
      - '.github/workflows/xstore-014-interval-auto-schedule-qa.yml'
      - '09_QA/people-shift/xstore-019-unified-rc-v1.test.mjs'
      - '.github/workflows/xstore-019-unified-rc-qa.yml'
  pull_request:
    paths:
      - '07_DATABASE/migrations/20261004222500_xstore_014_interval_composed_auto_schedule_v1.sql'
      - '09_QA/people-shift/xstore-014-interval-auto-schedule-v1.test.mjs'
      - '.github/workflows/xstore-014-interval-auto-schedule-qa.yml'
      - '09_QA/people-shift/xstore-019-unified-rc-v1.test.mjs'
      - '.github/workflows/xstore-019-unified-rc-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres17-interval-scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xstore_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xstore_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: xstore_qa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run XSTORE-014 static contract regression
        run: node --test 09_QA/people-shift/xstore-014-interval-auto-schedule-v1.test.mjs

      - name: Install PostgreSQL client
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Build isolated Workforce scheduler fixture
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgcrypto;
          create schema if not exists auth;

          do $roles$
          begin
            if not exists(select 1 from pg_roles where rolname='anon') then create role anon; end if;
            if not exists(select 1 from pg_roles where rolname='authenticated') then create role authenticated; end if;
          end
          $roles$;

          create table public.profiles(
            id uuid primary key,
            status text,
            role text,
            full_name text,
            username text
          );

          create table public.stores(
            id uuid primary key,
            code text not null,
            status text not null
          );

          create table public.workforce_recurring_staffing_requirements(
            id uuid primary key,
            store_id uuid not null,
            day_of_week smallint not null,
            start_time time not null,
            end_time time not null,
            target_headcount integer not null
          );

          create table public.employee_store_priorities(
            employee_id uuid not null,
            store_id uuid not null,
            priority integer not null,
            primary key(employee_id,store_id)
          );

          create table public.employee_constraints(
            user_id uuid primary key,
            status text,
            max_daily_hours numeric,
            max_weekly_hours numeric
          );

          create table public.employee_availability(
            id uuid primary key default gen_random_uuid(),
            user_id uuid not null,
            work_date date not null,
            availability_type text not null,
            start_time time not null,
            end_time time not null
          );

          create table public.schedule_generation_runs(
            id uuid primary key default gen_random_uuid(),
            store_id uuid not null,
            week_start date not null,
            week_end date not null,
            status text not null,
            algorithm_version text,
            total_hours numeric default 0,
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now()
          );

          create table public.schedule_generation_assignments(
            id uuid primary key default gen_random_uuid(),
            generation_id uuid not null,
            user_id uuid not null,
            store_id uuid not null,
            work_date date not null,
            start_time time not null,
            end_time time not null,
            skill_code text,
            skill_level integer default 0,
            score numeric default 0,
            warning text,
            status text not null default 'DRAFT',
            note text
          );

          create table public.work_schedules(
            id uuid primary key default gen_random_uuid(),
            user_id uuid not null,
            store_id uuid not null,
            work_date date not null,
            start_time time not null,
            end_time time not null,
            status text not null
          );

          create or replace function auth.uid()
          returns uuid language sql stable
          as $$ select '11111111-1111-1111-1111-111111111111'::uuid $$;

          create or replace function public.current_user_role()
          returns text language sql stable
          as $$ select 'OWNER'::text $$;

          create or replace function public.can_access_store(p_store_id uuid)
          returns boolean language sql stable
          as $$ select true $$;

          create or replace function public.create_schedule_generation(
            p_store_id uuid,
            p_week_start date,
            p_algorithm_version text
          )
          returns uuid
          language plpgsql
          as $fn$
          declare v_id uuid;
          begin
            select id into v_id
            from public.schedule_generation_runs
            where store_id=p_store_id
              and week_start=p_week_start
              and status='DRAFT'
            order by created_at desc,id desc
            limit 1;

            if v_id is null then
              insert into public.schedule_generation_runs(
                store_id,week_start,week_end,status,algorithm_version
              ) values(
                p_store_id,p_week_start,p_week_start+6,'DRAFT',p_algorithm_version
              )
              returning id into v_id;
            end if;

            return v_id;
          end;
          $fn$;

          insert into public.profiles(id,status,role,full_name,username)
          values ('11111111-1111-1111-1111-111111111111','ACTIVE','OWNER','Owner','owner');
          SQL

      - name: Apply XSTORE-013 coverage primitive then exact XSTORE-014 migration
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -f 07_DATABASE/migrations/20261004220500_xstore_013_continuous_coverage_shortage_v1.sql
          psql -v ON_ERROR_STOP=1 -f 07_DATABASE/migrations/20261004222500_xstore_014_interval_composed_auto_schedule_v1.sql

      - name: Prove adjacent split Availability composes one continuous requirement
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          insert into public.stores(id,code,status)
          values ('20000000-0000-0000-0000-000000000001','CN1','ACTIVE');

          insert into public.profiles(id,status,role,full_name,username) values
          ('30000000-0000-0000-0000-000000000001','ACTIVE','STAFF','A','a'),
          ('30000000-0000-0000-0000-000000000002','ACTIVE','STAFF','B','b');

          insert into public.employee_store_priorities(employee_id,store_id,priority) values
          ('30000000-0000-0000-0000-000000000001','20000000-0000-0000-0000-000000000001',1),
          ('30000000-0000-0000-0000-000000000002','20000000-0000-0000-0000-000000000001',1);

          insert into public.employee_availability(user_id,work_date,availability_type,start_time,end_time) values
          ('30000000-0000-0000-0000-000000000001',date '2026-10-05','AVAILABLE',time '06:00',time '09:00'),
          ('30000000-0000-0000-0000-000000000002',date '2026-10-05','AVAILABLE',time '09:00',time '12:00');

          insert into public.workforce_recurring_staffing_requirements(
            id,store_id,day_of_week,start_time,end_time,target_headcount
          ) values(
            '40000000-0000-0000-0000-000000000001',
            '20000000-0000-0000-0000-000000000001',
            1,time '06:00',time '12:00',1
          );

          do $test$
          declare v_result jsonb; v_count integer;
          begin
            v_result:=public.auto_generate_cross_store_schedule_v1(date '2026-10-05',true,'XSTORE_014_QA');
            if (v_result->>'shortage_count')::integer<>0 then
              raise exception 'SPLIT_COVERAGE_REPORTED_SHORTAGE: %',v_result;
            end if;
            select count(*) into v_count
            from public.schedule_generation_assignments
            where work_date=date '2026-10-05'
              and ((start_time=time '06:00' and end_time=time '09:00')
                or (start_time=time '09:00' and end_time=time '12:00'));
            if v_count<>2 then raise exception 'SPLIT_ASSIGNMENTS_WRONG: %',v_count; end if;
            raise notice 'XSTORE_014_SPLIT_COVERAGE=PASS';
          end
          $test$;
          rollback;
          SQL

      - name: Prove real gap is returned exactly and later Availability is still used
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          insert into public.stores(id,code,status)
          values ('20000000-0000-0000-0000-000000000001','CN1','ACTIVE');

          insert into public.profiles(id,status,role,full_name,username) values
          ('30000000-0000-0000-0000-000000000001','ACTIVE','STAFF','A','a'),
          ('30000000-0000-0000-0000-000000000002','ACTIVE','STAFF','B','b');

          insert into public.employee_store_priorities(employee_id,store_id,priority) values
          ('30000000-0000-0000-0000-000000000001','20000000-0000-0000-0000-000000000001',1),
          ('30000000-0000-0000-0000-000000000002','20000000-0000-0000-0000-000000000001',1);

          insert into public.employee_availability(user_id,work_date,availability_type,start_time,end_time) values
          ('30000000-0000-0000-0000-000000000001',date '2026-10-05','AVAILABLE',time '06:00',time '08:00'),
          ('30000000-0000-0000-0000-000000000002',date '2026-10-05','AVAILABLE',time '08:30',time '12:00');

          insert into public.workforce_recurring_staffing_requirements(
            id,store_id,day_of_week,start_time,end_time,target_headcount
          ) values(
            '40000000-0000-0000-0000-000000000001',
            '20000000-0000-0000-0000-000000000001',
            1,time '06:00',time '12:00',1
          );

          do $test$
          declare v_result jsonb; v_gap jsonb; v_count integer;
          begin
            v_result:=public.auto_generate_cross_store_schedule_v1(date '2026-10-05',true,'XSTORE_014_QA');
            if (v_result->>'shortage_count')::integer<>1 then
              raise exception 'GAP_COUNT_WRONG: %',v_result;
            end if;
            v_gap:=(v_result->'shortages')->0;
            if v_gap->>'start_time'<>'08:00:00' or v_gap->>'end_time'<>'08:30:00'
               or (v_gap->>'missing')::integer<>1 then
              raise exception 'EXACT_GAP_WRONG: %',v_gap;
            end if;
            select count(*) into v_count
            from public.schedule_generation_assignments
            where user_id='30000000-0000-0000-0000-000000000002'
              and start_time=time '08:30' and end_time=time '12:00';
            if v_count<>1 then raise exception 'LATER_AVAILABILITY_NOT_USED'; end if;
            raise notice 'XSTORE_014_EXACT_GAP=PASS';
          end
          $test$;
          rollback;
          SQL

      - name: Prove target headcount boundaries and cross-store overlap remain fail-closed
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          insert into public.stores(id,code,status) values
          ('20000000-0000-0000-0000-000000000001','CN1','ACTIVE'),
          ('20000000-0000-0000-0000-000000000002','CN2','ACTIVE');

          insert into public.profiles(id,status,role,full_name,username) values
          ('30000000-0000-0000-0000-000000000001','ACTIVE','STAFF','A','a'),
          ('30000000-0000-0000-0000-000000000002','ACTIVE','STAFF','B','b'),
          ('30000000-0000-0000-0000-000000000003','ACTIVE','STAFF','C','c');

          insert into public.employee_store_priorities(employee_id,store_id,priority) values
          ('30000000-0000-0000-0000-000000000001','20000000-0000-0000-0000-000000000001',1),
          ('30000000-0000-0000-0000-000000000001','20000000-0000-0000-0000-000000000002',1),
          ('30000000-0000-0000-0000-000000000002','20000000-0000-0000-0000-000000000001',1),
          ('30000000-0000-0000-0000-000000000003','20000000-0000-0000-0000-000000000001',1);

          insert into public.employee_availability(user_id,work_date,availability_type,start_time,end_time) values
          ('30000000-0000-0000-0000-000000000001',date '2026-10-05','AVAILABLE',time '06:00',time '12:00'),
          ('30000000-0000-0000-0000-000000000002',date '2026-10-05','AVAILABLE',time '06:00',time '08:00'),
          ('30000000-0000-0000-0000-000000000003',date '2026-10-05','AVAILABLE',time '09:00',time '12:00');

          insert into public.workforce_recurring_staffing_requirements(
            id,store_id,day_of_week,start_time,end_time,target_headcount
          ) values
          ('40000000-0000-0000-0000-000000000001','20000000-0000-0000-0000-000000000001',1,time '06:00',time '12:00',2),
          ('40000000-0000-0000-0000-000000000002','20000000-0000-0000-0000-000000000002',1,time '06:00',time '12:00',1);

          do $test$
          declare v_result jsonb; v_gap jsonb; v_cn2 integer;
          begin
            v_result:=public.auto_generate_cross_store_schedule_v1(date '2026-10-05',true,'XSTORE_014_QA');
            if (v_result->>'shortage_count')::integer<>2 then
              raise exception 'EXPECTED_TWO_EXACT_SHORTAGES: %',v_result;
            end if;

            select value into v_gap
            from jsonb_array_elements(v_result->'shortages')
            where value->>'store_code'='CN1'
            limit 1;

            if v_gap->>'start_time'<>'08:00:00' or v_gap->>'end_time'<>'09:00:00'
               or (v_gap->>'assigned')::integer<>1 or (v_gap->>'missing')::integer<>1 then
              raise exception 'HEADCOUNT_BOUNDARY_WRONG: %',v_gap;
            end if;

            select count(*) into v_cn2
            from public.schedule_generation_assignments a
            join public.stores s on s.id=a.store_id
            where s.code='CN2';

            if v_cn2<>0 then
              raise exception 'CROSS_STORE_OVERLAP_WAS_NOT_BLOCKED';
            end if;

            raise notice 'XSTORE_014_HEADCOUNT_AND_GLOBAL_SAFETY=PASS';
          end
          $test$;
          rollback;
          SQL
