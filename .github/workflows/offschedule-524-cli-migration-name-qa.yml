name: Offschedule 524 Supabase CLI Migration Name QA
on:
  pull_request:
    paths:
      - '.github/workflows/offschedule-524-cli-migration-name-qa.yml'
permissions:
  contents: read
jobs:
  generate-name-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Generate migration filename in disposable local workspace
        run: |
          mkdir -p /tmp/off-524-migration
          cd /tmp/off-524-migration
          supabase --version
          supabase migration new --help >/dev/null
          supabase init --yes
          supabase migration new workforce_attendance_offschedule_request_v1
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf 'CLI_GENERATED_524_MIGRATION_FILENAME=%f\n'
      - name: Confirm no hosted operations
        run: echo 'Only local migration name generation. No Supabase credentials, schema writes or hosted database access.'
