name: Supervisor Autostart Install

on:
  push:
    branches:
      - main
    paths:
      - 08_INTEGRATIONS/supervisor/src/**
      - 08_INTEGRATIONS/supervisor/windows/**
      - 08_INTEGRATIONS/supervisor/test/**
      - 08_INTEGRATIONS/supervisor/package.json
      - 01_DOCS/MAGASIN/00_PROJECT_STATE.json
      - .github/workflows/supervisor-autostart-install.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supervisor-autostart-install
  cancel-in-progress: true

jobs:
  install:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Supervisor tests
        shell: powershell
        working-directory: 08_INTEGRATIONS/supervisor
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test

      - name: Install latest Supervisor runtime
        shell: powershell
        run: |
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File "08_INTEGRATIONS/supervisor/windows/install-supervisor.ps1"

      - name: Verify checked-out Brain/Worker source-of-truth
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $statePath = "01_DOCS/MAGASIN/00_PROJECT_STATE.json"
          if (-not (Test-Path $statePath)) { throw "Checked-out PROJECT_STATE is missing" }
          $state = Get-Content $statePath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($state.supervisor_orchestration.mode -ne "BRAIN_WORKER_V1") {
            throw "Checked-out PROJECT_STATE does not enable BRAIN_WORKER_V1"
          }
          if ($state.current_task -ne "TASK-049") {
            throw "Checked-out PROJECT_STATE is not on TASK-049"
          }
          Write-Host "SOURCE_OF_TRUTH_LOCAL_CHECK=True"

      - name: Register reboot/logon recovery and start now
        shell: powershell
        run: |
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File "08_INTEGRATIONS/supervisor/windows/install-autostart.ps1" -StartNow

      - name: Verify local recovery installation
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:LOCALAPPDATA "MAGASIN\BusinessOS\supervisor"
          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          $value = (Get-ItemProperty -Path $runKey -Name "MAGASINBusinessOSAutostart" -ErrorAction Stop).MAGASINBusinessOSAutostart
          if ($value -notmatch "autostart-bootstrap\.ps1") { throw "HKCU autostart value is invalid" }
          if (Test-Path (Join-Path $root "AUTOSTART_DISABLED")) { throw "Owner STOP latch should be clear after install" }

          $runnerRoot = "C:\actions-runner-business\actions-runner"
          $runner = Get-CimInstance Win32_Process -Filter "Name='Runner.Listener.exe'" -ErrorAction SilentlyContinue |
            Where-Object {
              ($_.ExecutablePath -and $_.ExecutablePath -like "$runnerRoot*") -or
              ($_.CommandLine -and $_.CommandLine -like "*$runnerRoot*")
            } |
            Select-Object -First 1
          if (-not $runner) { throw "Canonical GitHub Runner is not online" }

          $supervisor = Get-CimInstance Win32_Process -Filter "Name='powershell.exe'" -ErrorAction SilentlyContinue |
            Where-Object {
              $_.CommandLine -and
              $_.CommandLine -like "*run-supervisor.ps1*" -and
              $_.CommandLine -like "*MAGASIN\BusinessOS\supervisor*"
            } |
            Select-Object -First 1
          if (-not $supervisor) { throw "Supervisor wrapper is not online" }

          $profile = Join-Path $root "browser_profile"
          $chrome = $null
          $cdpPort = $null
          $version = $null

          for ($i = 0; $i -lt 30; $i++) {
            $chrome = Get-CimInstance Win32_Process -Filter "Name='chrome.exe'" -ErrorAction SilentlyContinue |
              Where-Object {
                $_.CommandLine -and
                $_.CommandLine -like "*$profile*" -and
                $_.CommandLine -match "--remote-debugging-port=(\d+)"
              } |
              Select-Object -First 1

            if ($chrome -and $chrome.CommandLine -match "--remote-debugging-port=(\d+)") {
              $cdpPort = [int]$Matches[1]
              try {
                $version = Invoke-RestMethod -Uri "http://127.0.0.1:$cdpPort/json/version" -TimeoutSec 2
              } catch {
                $version = $null
              }
              if ($version -and $version.webSocketDebuggerUrl) { break }
            }

            Start-Sleep -Seconds 1
          }

          if (-not $chrome) { throw "Dedicated Business OS Chrome is not online after bounded wait" }
          if (-not $cdpPort) { throw "Dedicated Business OS Chrome CDP port is missing after bounded wait" }
          if (-not $version -or -not $version.webSocketDebuggerUrl) { throw "Dedicated Business OS Chrome CDP endpoint is not healthy after bounded wait" }

          $statusFile = Join-Path $root "autostart-install-status.json"
          if (-not (Test-Path $statusFile)) { throw "Autostart install status is missing" }

          $brainWorker = $null
          $brainTargetReady = $false
          for ($i = 0; $i -lt 45; $i++) {
            $brainWorker = Get-CimInstance Win32_Process -Filter "Name='node.exe'" -ErrorAction SilentlyContinue |
              Where-Object { $_.CommandLine -and $_.CommandLine -like "*brain-worker-cli.mjs*" } |
              Select-Object -First 1
            $registryFile = Join-Path $root "orchestration.json"
            if ($brainWorker -and (Test-Path $registryFile)) {
              try {
                $registry = Get-Content $registryFile -Raw -Encoding UTF8 | ConvertFrom-Json
                if ($registry.mode -eq "BRAIN_WORKER_V1" -and $registry.brain.target.pathname) {
                  $brainTargetReady = $true
                  break
                }
              } catch {}
            }
            Start-Sleep -Seconds 2
          }
          if (-not $brainWorker) { throw "Brain/Worker Node runtime is not online" }
          if (-not $brainTargetReady) { throw "Brain target was not registered within bounded wait" }

          $runtimeBrain = Join-Path $root "runtime\src\runtime\brain-worker-cli.mjs"
          if (-not (Test-Path $runtimeBrain)) { throw "Installed Brain/Worker runtime is missing" }
          if (-not (Select-String -Path $runtimeBrain -SimpleMatch "2026-09-19.26" -Quiet)) {
            throw "Installed Brain/Worker runtime is not v2026-09-19.26"
          }

          $runtimeStatusFile = Join-Path $root "runtime-status.json"
          $targetHealthy = $false
          for ($i = 0; $i -lt 20; $i++) {
            if (Test-Path $runtimeStatusFile) {
              try {
                $runtimeStatus = Get-Content $runtimeStatusFile -Raw -Encoding UTF8 | ConvertFrom-Json
                if (
                  $runtimeStatus.supervisor_runtime_version -eq "2026-09-19.26" -and
                  -not (
                    $runtimeStatus.status -eq "WAIT_USER" -and
                    [string]$runtimeStatus.decision_reason -match "target mismatch"
                  )
                ) {
                  $targetHealthy = $true
                  break
                }
              } catch {}
            }
            Start-Sleep -Seconds 1
          }
          if (-not $targetHealthy) {
            $controlPanel = Join-Path $root "runtime\windows\control-panel.ps1"
            $brainRuntime = Join-Path $root "runtime\src\runtime\brain-worker-cli.mjs"
            if (
              -not (Test-Path $controlPanel) -or
              -not (Select-String -Path $controlPanel -SimpleMatch "BRAIN_REBIND.request.json" -Quiet) -or
              -not (Test-Path $brainRuntime) -or
              -not (Select-String -Path $brainRuntime -SimpleMatch "BRAIN_TARGET_REBOUND_OWNER" -Quiet)
            ) {
              throw "v2026-09-19.26 target mismatch remains but the Owner Brain rebind recovery path is unavailable"
            }
            Write-Host "BRAIN_REBIND_REQUIRED=True"
          } else {
            Write-Host "BRAIN_REBIND_REQUIRED=False"
          }

          $workerRetryRequired = $false
          if (Test-Path $runtimeStatusFile) {
            try {
              $runtimeStatus = Get-Content $runtimeStatusFile -Raw -Encoding UTF8 | ConvertFrom-Json
              $workerRetryRequired = [bool](
                $runtimeStatus.supervisor_runtime_version -eq "2026-09-19.26" -and
                $runtimeStatus.status -eq "WAIT_USER" -and
                [string]$runtimeStatus.decision_reason -match "uncertain prior create/send outcome"
              )
            } catch {}
          }

          if ($workerRetryRequired) {
            $controlPanel = Join-Path $root "runtime\windows\control-panel.ps1"
            $brainRuntime = Join-Path $root "runtime\src\runtime\brain-worker-cli.mjs"
            if (
              -not (Test-Path $controlPanel) -or
              -not (Select-String -Path $controlPanel -SimpleMatch "WORKER_RETRY.request.json" -Quiet) -or
              -not (Test-Path $brainRuntime) -or
              -not (Select-String -Path $brainRuntime -SimpleMatch "WORKER_OWNER_RETRY_ARMED" -Quiet)
            ) {
              throw "v2026-09-19.26 uncertain Worker send remains but the bounded Owner retry path is unavailable"
            }
            Write-Host "WORKER_RETRY_REQUIRED=True"
          } else {
            Write-Host "WORKER_RETRY_REQUIRED=False"
          }

          $technicalRecoveryStuck = $false
          if (Test-Path $runtimeStatusFile) {
            try {
              $runtimeStatus = Get-Content $runtimeStatusFile -Raw -Encoding UTF8 | ConvertFrom-Json
              $technicalRecoveryStuck = [bool](
                $runtimeStatus.supervisor_runtime_version -eq "2026-09-19.26" -and
                $runtimeStatus.status -eq "WAIT_USER" -and
                [string]$runtimeStatus.decision_reason -match "missing MAGASIN_BRAIN_DIRECTIVE_V1 block|Target page, context or browser has been closed"
              )
            } catch {}
          }
          if ($technicalRecoveryStuck) {
            throw "v2026-09-19.26 is still stuck on an automatically recoverable Brain/CDP condition"
          }
          Write-Host "TECHNICAL_RECOVERY_STUCK=False"

          Write-Host "AUTOSTART_REGISTERED=True"
          Write-Host "RUNNER_ONLINE=True"
          Write-Host "SUPERVISOR_ONLINE=True"
          Write-Host "BRAIN_WORKER_RUNTIME=True"
          Write-Host "BRAIN_TARGET_REGISTERED=True"
          Write-Host "BUSINESS_CHROME_ONLINE=True"
          Write-Host "BUSINESS_CHROME_CDP_HEALTHY=True"
          Write-Host "OWNER_STOP_LATCH=False"
          Write-Host "WINDOWS_LOGIN_BYPASS=False"
