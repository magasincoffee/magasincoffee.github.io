name: Supervisor Autostart Install

on:
  push:
    branches:
      - main
    paths:
      - 08_INTEGRATIONS/supervisor/src/**
      - 08_INTEGRATIONS/supervisor/windows/**
      - 08_INTEGRATIONS/supervisor/test/**
      - 08_INTEGRATIONS/supervisor/package.json
      - 01_DOCS/MAGASIN/00_PROJECT_STATE.json
      - .github/workflows/supervisor-autostart-install.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supervisor-autostart-install
  cancel-in-progress: true

jobs:
  install:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Supervisor tests
        shell: powershell
        working-directory: 08_INTEGRATIONS/supervisor
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test

      - name: Install latest Supervisor runtime
        shell: powershell
        run: |
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File "08_INTEGRATIONS/supervisor/windows/install-supervisor.ps1"

      - name: Verify checked-out Three-Lane source-of-truth
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $statePath = "01_DOCS/MAGASIN/00_PROJECT_STATE.json"
          if (-not (Test-Path $statePath)) { throw "Checked-out PROJECT_STATE is missing" }
          $state = Get-Content $statePath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($state.supervisor_orchestration.mode -ne "THREE_LANE_V1") {
            throw "Checked-out PROJECT_STATE does not enable THREE_LANE_V1"
          }
          if ([int]$state.supervisor_orchestration.lane_count -ne 3) {
            throw "Checked-out PROJECT_STATE does not define exactly three lanes"
          }
          if ([bool]$state.supervisor_orchestration.brain_autodiscovery) {
            throw "Brain autodiscovery must be disabled in THREE_LANE_V1"
          }
          if ($state.current_task -ne "TASK-049") {
            throw "Checked-out PROJECT_STATE is not on TASK-049"
          }
          Write-Host "SOURCE_OF_TRUTH_LOCAL_CHECK=True"

      - name: Register reboot/logon recovery and start now
        shell: powershell
        run: |
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File "08_INTEGRATIONS/supervisor/windows/install-autostart.ps1" -StartNow

      - name: Verify local recovery installation
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:LOCALAPPDATA "MAGASIN\BusinessOS\supervisor"
          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          $value = (Get-ItemProperty -Path $runKey -Name "MAGASINBusinessOSAutostart" -ErrorAction Stop).MAGASINBusinessOSAutostart
          if ($value -notmatch "autostart-bootstrap\.ps1") { throw "HKCU autostart value is invalid" }
          if (Test-Path (Join-Path $root "AUTOSTART_DISABLED")) { throw "Owner STOP latch should be clear after install" }

          $runnerRoot = "C:\actions-runner-business\actions-runner"
          $runner = Get-CimInstance Win32_Process -Filter "Name='Runner.Listener.exe'" -ErrorAction SilentlyContinue |
            Where-Object {
              ($_.ExecutablePath -and $_.ExecutablePath -like "$runnerRoot*") -or
              ($_.CommandLine -and $_.CommandLine -like "*$runnerRoot*")
            } |
            Select-Object -First 1
          if (-not $runner) { throw "Canonical GitHub Runner is not online" }

          $supervisor = Get-CimInstance Win32_Process -Filter "Name='powershell.exe'" -ErrorAction SilentlyContinue |
            Where-Object {
              $_.CommandLine -and
              $_.CommandLine -like "*run-supervisor.ps1*" -and
              $_.CommandLine -like "*MAGASIN\BusinessOS\supervisor*"
            } |
            Select-Object -First 1
          if (-not $supervisor) { throw "Supervisor wrapper is not online" }

          $profile = Join-Path $root "browser_profile"
          $chrome = $null
          $cdpPort = $null
          $version = $null

          for ($i = 0; $i -lt 30; $i++) {
            $chrome = Get-CimInstance Win32_Process -Filter "Name='chrome.exe'" -ErrorAction SilentlyContinue |
              Where-Object {
                $_.CommandLine -and
                $_.CommandLine -like "*$profile*" -and
                $_.CommandLine -match "--remote-debugging-port=(\d+)"
              } |
              Select-Object -First 1

            if ($chrome -and $chrome.CommandLine -match "--remote-debugging-port=(\d+)") {
              $cdpPort = [int]$Matches[1]
              try {
                $version = Invoke-RestMethod -Uri "http://127.0.0.1:$cdpPort/json/version" -TimeoutSec 2
              } catch {
                $version = $null
              }
              if ($version -and $version.webSocketDebuggerUrl) { break }
            }

            Start-Sleep -Seconds 1
          }

          if (-not $chrome) { throw "Dedicated Business OS Chrome is not online after bounded wait" }
          if (-not $cdpPort) { throw "Dedicated Business OS Chrome CDP port is missing after bounded wait" }
          if (-not $version -or -not $version.webSocketDebuggerUrl) { throw "Dedicated Business OS Chrome CDP endpoint is not healthy after bounded wait" }

          $statusFile = Join-Path $root "autostart-install-status.json"
          if (-not (Test-Path $statusFile)) { throw "Autostart install status is missing" }

          $threeLane = $null
          for ($i = 0; $i -lt 60; $i++) {
            $threeLane = Get-CimInstance Win32_Process -Filter "Name='node.exe'" -ErrorAction SilentlyContinue |
              Where-Object { $_.CommandLine -and $_.CommandLine -like "*three-lane-cli.mjs*" } |
              Select-Object -First 1
            if ($threeLane) { break }
            Start-Sleep -Seconds 1
          }
          if (-not $threeLane) { throw "Three-Lane Node runtime is not online" }

          $runtimeThreeLane = Join-Path $root "runtime\src\runtime\three-lane-cli.mjs"
          if (-not (Test-Path $runtimeThreeLane)) { throw "Installed Three-Lane runtime is missing" }
          if (-not (Select-String -Path $runtimeThreeLane -SimpleMatch "2026-09-19.39" -Quiet)) {
            throw "Installed Three-Lane runtime is not v2026-09-19.39"
          }

          $laneConfigFile = Join-Path $root "lanes.json"
          $laneStatusFile = Join-Path $root "lane-status.json"
          $laneReady = $false
          for ($i = 0; $i -lt 30; $i++) {
            if ((Test-Path $laneConfigFile) -and (Test-Path $laneStatusFile)) {
              try {
                $laneConfig = Get-Content $laneConfigFile -Raw -Encoding UTF8 | ConvertFrom-Json
                $laneStatus = Get-Content $laneStatusFile -Raw -Encoding UTF8 | ConvertFrom-Json
                if (
                  $laneConfig.mode -eq "THREE_LANE_V1" -and
                  @($laneConfig.lanes).Count -eq 3 -and
                  $laneStatus.mode -eq "THREE_LANE_V1" -and
                  $laneStatus.supervisor_runtime_version -eq "2026-09-19.39" -and
                  @($laneStatus.lanes).Count -eq 3
                ) {
                  $laneReady = $true
                  break
                }
              } catch {}
            }
            Start-Sleep -Seconds 1
          }
          if (-not $laneReady) { throw "Three-Lane local config/status did not become ready" }

          Write-Host "THREE_LANE_RUNTIME=True"
          Write-Host "THREE_LANE_COUNT=3"
          Write-Host "BRAIN_AUTODISCOVERY_ACTIVE=False"
          Write-Host "WORK_URL_OWNER_REQUIRED=False"
          Write-Host "WORK_URL_OWNER_EDITABLE=True"

          $runtimeThreeLaneSource = Get-Content $runtimeThreeLane -Raw -Encoding UTF8
          if ($runtimeThreeLaneSource -notmatch 'applyOwnerBrainTarget') { throw "Installed runtime is missing Brain target hot-swap support" }
          if ($runtimeThreeLaneSource -notmatch 'brain_url_revision') { throw "Installed runtime is missing Brain URL revision support" }

          $controlPanel = Join-Path $root "runtime\windows\control-panel.ps1"
          if (-not (Test-Path $controlPanel)) { throw "Installed Control Panel is missing" }
          $controlPanelSource = Get-Content $controlPanel -Raw -Encoding UTF8
          if ($controlPanelSource -notmatch 'Save-BrainTarget') { throw "Installed Control Panel is missing Brain target persistence action" }
          if ($controlPanelSource -notmatch 'brain_url_revision') { throw "Installed Control Panel is missing Brain revision persistence support" }

          foreach ($laneEntry in @($laneConfig.lanes)) {
            if (-not $laneEntry.PSObject.Properties['brain_url_revision']) {
              throw "lanes.json was not migrated with brain_url_revision"
            }
          }
          $laneRegistryFile = Join-Path $root "lane-registry.json"
          if (-not (Test-Path $laneRegistryFile)) { throw "lane-registry.json is missing" }
          $laneRegistry = Get-Content $laneRegistryFile -Raw -Encoding UTF8 | ConvertFrom-Json
          foreach ($laneName in @('lane-1','lane-2','lane-3')) {
            $registryEntry = $laneRegistry.lanes.$laneName
            if (-not $registryEntry.PSObject.Properties['applied_brain_url_revision']) {
              throw "lane-registry.json was not migrated with applied_brain_url_revision for $laneName"
            }
          }
          Write-Host "BRAIN_URL_OWNER_EDITABLE=True"
          Write-Host "BRAIN_URL_PERSISTED=True"
          Write-Host "BRAIN_URL_HOT_SWAP=True"

          Write-Host "AUTOSTART_REGISTERED=True"
          Write-Host "RUNNER_ONLINE=True"
          Write-Host "SUPERVISOR_ONLINE=True"
          Write-Host "THREE_LANE_RUNTIME=True"
          Write-Host "THREE_LANE_COUNT=3"
          Write-Host "BUSINESS_CHROME_ONLINE=True"
          Write-Host "BUSINESS_CHROME_CDP_HEALTHY=True"
          Write-Host "OWNER_STOP_LATCH=False"
          Write-Host "WINDOWS_LOGIN_BYPASS=False"

  verify-survival:
    name: verify-survival
    needs: install
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Verify Supervisor survived previous job cleanup
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Start-Sleep -Seconds 15

          $root = Join-Path $env:LOCALAPPDATA "MAGASIN\BusinessOS\supervisor"
          $profile = Join-Path $root "browser_profile"
          $wrapper = $null
          $threeLane = $null
          $chrome = $null

          # The self-hosted runner may clean up the first Chrome process after
          # the install job. v33 gives the Supervisor a bounded recovery window
          # to request exit code 75 and relaunch the dedicated Robot Chrome.
          for ($i = 0; $i -lt 60; $i++) {
            $wrapper = Get-CimInstance Win32_Process -Filter "Name='powershell.exe'" -ErrorAction SilentlyContinue |
              Where-Object {
                $_.CommandLine -and
                $_.CommandLine -like "*run-supervisor.ps1*" -and
                $_.CommandLine -like "*MAGASIN\BusinessOS\supervisor*"
              } |
              Select-Object -First 1

            $threeLane = Get-CimInstance Win32_Process -Filter "Name='node.exe'" -ErrorAction SilentlyContinue |
              Where-Object { $_.CommandLine -and $_.CommandLine -like "*three-lane-cli.mjs*" } |
              Select-Object -First 1

            $chrome = Get-CimInstance Win32_Process -Filter "Name='chrome.exe'" -ErrorAction SilentlyContinue |
              Where-Object {
                $_.CommandLine -and
                $_.CommandLine -like "*$profile*" -and
                $_.CommandLine -match "--remote-debugging-port=(\d+)"
              } |
              Select-Object -First 1

            if ($wrapper -and $threeLane -and $chrome) { break }
            Start-Sleep -Seconds 1
          }

          if (-not $wrapper) { throw "Supervisor wrapper did not recover after the previous self-hosted job" }
          if (-not $threeLane) { throw "Three-Lane runtime did not recover after the previous self-hosted job" }
          if (-not $chrome) { throw "Dedicated Robot Chrome did not recover after the previous self-hosted job" }

          $statusFile = Join-Path $root "lane-status.json"
          if (-not (Test-Path $statusFile)) { throw "Three-Lane status is missing after previous job cleanup" }
          $status = Get-Content $statusFile -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($status.supervisor_runtime_version -ne "2026-09-19.39") {
            throw "Post-job Three-Lane runtime is not v2026-09-19.39"
          }
          if ($status.mode -ne "THREE_LANE_V1" -or @($status.lanes).Count -ne 3) {
            throw "Post-job Three-Lane status is invalid"
          }

          Write-Host "POST_JOB_SUPERVISOR_ALIVE=True"
          Write-Host "POST_JOB_THREE_LANE_ALIVE=True"
          Write-Host "POST_JOB_ROBOT_CHROME_ALIVE=True"
          Write-Host "POST_JOB_LANE_COUNT=3"

      - name: Observe live Lane 1, print safe logs, and open Robot
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:LOCALAPPDATA "MAGASIN\BusinessOS\supervisor"
          $statusFile = Join-Path $root "lane-status.json"
          $registryFile = Join-Path $root "lane-registry.json"
          $logFile = Join-Path $root "supervisor.log"
          $configFile = Join-Path $root "lanes.json"

          # Owner explicitly asked the automated acceptance run to operate the
          # Robot without manual clicks. Resume Lane 1 only when its existing
          # Brain URL is already configured; preserve every target URL.
          if (Test-Path $configFile) {
            $config = Get-Content $configFile -Raw -Encoding UTF8 | ConvertFrom-Json
            $lane1Config = @($config.lanes | Where-Object { $_.lane_id -eq "lane-1" }) | Select-Object -First 1
            if ($lane1Config -and [string]$lane1Config.brain_url) {
              if (-not [bool]$lane1Config.enabled) {
                $lane1Config.enabled = $true
                $tmp = "$configFile.acceptance.tmp"
                $config | ConvertTo-Json -Depth 12 | Set-Content -Path $tmp -Encoding UTF8
                Move-Item -Path $tmp -Destination $configFile -Force
                Write-Host "LIVE_LANE1_RESUMED_BY_SHELL=True"
              } else {
                Write-Host "LIVE_LANE1_RESUMED_BY_SHELL=False"
              }
              Write-Host "LIVE_LANE1_BRAIN_CONFIGURED=True"
              Write-Host "LIVE_LANE1_WORK_CONFIGURED=$([bool]([string]$lane1Config.work_url))"
            } else {
              Write-Host "LIVE_LANE1_BRAIN_CONFIGURED=False"
            }
          }

          $healthy = $false
          $lane1 = $null
          $registryLane = $null

          for ($i = 0; $i -lt 45; $i++) {
            if (Test-Path $statusFile) {
              try {
                $status = Get-Content $statusFile -Raw -Encoding UTF8 | ConvertFrom-Json
                $lane1 = @($status.lanes | Where-Object { $_.lane_id -eq "lane-1" }) | Select-Object -First 1
              } catch {
                $lane1 = $null
              }
            }

            if (Test-Path $registryFile) {
              try {
                $registry = Get-Content $registryFile -Raw -Encoding UTF8 | ConvertFrom-Json
                $registryLane = $registry.lanes.'lane-1'
              } catch {
                $registryLane = $null
              }
            }

            if ($lane1) {
              $badLoopMessage = [bool](
                [string]$lane1.message -match "thay đổi trong lúc xác minh|tải lại trang lặp lại|reload loop"
              )
              $blockedLatch = [bool](
                $registryLane -and
                $registryLane.dispatch_inflight -and
                [bool]$registryLane.dispatch_inflight.reconcile_blocked
              )
              $stableStatus = [string]$lane1.status -in @(
                "WORKING",
                "RELAYING_RESULT",
                "WAITING_BRAIN",
                "READY",
                "STARTING"
              )

              if ($stableStatus -and -not $badLoopMessage -and -not $blockedLatch) {
                $healthy = $true
                break
              }
            }

            Start-Sleep -Seconds 2
          }

          if ($lane1) {
            Write-Host "LIVE_LANE1_STATUS=$($lane1.status)"
            Write-Host "LIVE_LANE1_MESSAGE=$($lane1.message)"
            Write-Host "LIVE_LANE1_TASK=$($lane1.task_id)"
          } else {
            Write-Host "LIVE_LANE1_STATUS=MISSING"
          }

          if ($registryLane) {
            Write-Host "LIVE_LANE1_AWAITING_WORK=$([bool]$registryLane.awaiting_work)"
            Write-Host "LIVE_LANE1_DISPATCH_INFLIGHT=$([bool]$registryLane.dispatch_inflight)"
          }

          Write-Host "SAFE_LOG_TAIL_BEGIN"
          if (Test-Path $logFile) {
            Get-Content $logFile -Tail 80 -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host $_
            }
          }
          Write-Host "SAFE_LOG_TAIL_END"

          if (-not $healthy) {
            throw "Lane 1 did not reach a stable non-looping runtime state within the bounded live acceptance window"
          }

          $shortcut = Join-Path ([Environment]::GetFolderPath("Desktop")) "MAGASIN BUSINESS OS CONTROL.lnk"
          if (-not (Test-Path $shortcut)) {
            throw "MAGASIN BUSINESS OS CONTROL shortcut is missing"
          }

          Start-Process $shortcut
          Start-Sleep -Seconds 2
          Write-Host "CONTROL_PANEL_OPENED=True"
          Write-Host "LIVE_ACCEPTANCE=True"
