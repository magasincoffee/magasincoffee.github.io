name: Sync Employee V40 attendance UI

on:
  workflow_run:
    workflows: ["Deploy MAGASIN workforce to GitHub Pages"]
    types: [completed]

permissions:
  contents: write

jobs:
  sync-attendance-ui:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Fetch canonical clean attendance bridge
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://raw.githubusercontent.com/magasincoffee/noibo/main/web/attendance-auto-ui.js -o attendance-auto-ui.js
          test -s attendance-auto-ui.js

      - name: Install minimal runtime fix
        shell: bash
        run: |
          set -euo pipefail
          cat > employee/attendance-runtime-fix.js <<'EOF'
          /* Minimal V40 runtime fix. No observer. No polling. */
          (function(){
            'use strict';
            const frame=document.getElementById('app');
            if(!frame)return;
            frame.addEventListener('load',function(){
              const child=frame.contentWindow;
              const native=child && child.__MAGASIN_NATIVE_SHOWVIEW;
              if(typeof native==='function'){
                try{child.showView=native;}catch(_){/* ignore */}
              }
            });
          })();
          EOF

      - name: Remove legacy guards and wire clean bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          idx=Path('employee/index.html')
          s=idx.read_text(encoding='utf-8')
          s=re.sub(r'\n?<script src="/employee/attendance-v40-guard\.js[^"]*"></script>', '', s)
          tag='<script src="/employee/attendance-runtime-fix.js?v=20260901-clean-v2"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
          idx.write_text(s,encoding='utf-8')

          v40=Path('employee-v40.html')
          s=v40.read_text(encoding='utf-8')
          s=re.sub(r'\n?<script src="/attendance-auto-ui\.js[^"]*"></script>', '', s)
          tag='<script src="/attendance-auto-ui.js?v=20260901-clean-v4"></script>'
          if tag not in s:
              if '</body>' not in s: raise SystemExit('employee-v40.html missing </body>')
              s=s.replace('</body>', tag+'\n</body>', 1)
          v40.write_text(s,encoding='utf-8')
          PY

          rm -f employee/attendance-v40-guard.js
          node --check employee/attendance-runtime-fix.js
          node --check attendance-auto-ui.js
          grep -q 'attendance-runtime-fix.js' employee/index.html
          grep -q 'attendance-auto-ui.js' employee-v40.html

      - name: Commit clean Attendance runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MAGASIN"
          git config user.email "bachvantoi1994@gmail.com"
          git add employee/index.html employee/attendance-runtime-fix.js employee-v40.html attendance-auto-ui.js .github/workflows/attendance-ui-post-deploy.yml employee/attendance-v40-guard.js
          if git diff --cached --quiet; then
            echo 'Clean Attendance runtime already synced.'
            exit 0
          fi
          git commit -m 'refactor(attendance): remove legacy guards and sync clean V40 bridge [skip pages]'
          git push origin main
