name: Business OS Contract Tests

on:
  push:
    paths:
      - '02_CORE/contracts/**'
      - '02_CORE/shared/financial-truth-v1.mjs'
      - '02_CORE/shared/monthly-revenue-baseline-v1.mjs'
      - '02_CORE/shared/cash-bridge-v1.mjs'
      - '02_CORE/shared/cash-balance-truth-v1.mjs'
      - '02_CORE/shared/cash-balance-source-mapper-v1.mjs'
      - '02_CORE/shared/procurement-financial-truth-v1.mjs'
      - '02_CORE/shared/partial-financial-baseline-v1.mjs'
      - '09_QA/business-os/**'
      - '.github/workflows/business-os-contract-tests.yml'
  pull_request:
    paths:
      - '02_CORE/contracts/**'
      - '02_CORE/shared/financial-truth-v1.mjs'
      - '02_CORE/shared/monthly-revenue-baseline-v1.mjs'
      - '02_CORE/shared/cash-bridge-v1.mjs'
      - '02_CORE/shared/cash-balance-truth-v1.mjs'
      - '02_CORE/shared/cash-balance-source-mapper-v1.mjs'
      - '02_CORE/shared/procurement-financial-truth-v1.mjs'
      - '02_CORE/shared/partial-financial-baseline-v1.mjs'
      - '09_QA/business-os/**'
      - '.github/workflows/business-os-contract-tests.yml'

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check Cash Balance Source Mapper helper syntax
        run: node --check 02_CORE/shared/cash-balance-source-mapper-v1.mjs

      - name: Run Cash Balance Source Mapper targeted tests
        run: node --test 09_QA/business-os/cash-balance-source-mapper.test.mjs

      - name: Check Cash Balance Truth helper syntax
        run: node --check 02_CORE/shared/cash-balance-truth-v1.mjs

      - name: Run Cash Balance Truth targeted tests
        run: node --test 09_QA/business-os/cash-balance-truth.test.mjs

      - name: Run Financial Truth targeted tests
        run: node --test 09_QA/business-os/financial-truth.test.mjs

      - name: Check Cash Bridge helper syntax
        run: node --check 02_CORE/shared/cash-bridge-v1.mjs

      - name: Run Cash Bridge targeted tests
        run: node --test 09_QA/business-os/cash-bridge.test.mjs

      - name: Run Cash Bridge calculator targeted tests
        run: node --test 09_QA/business-os/cash-bridge-calculator.test.mjs

      - name: Check Procurement Financial Truth helper syntax
        run: node --check 02_CORE/shared/procurement-financial-truth-v1.mjs

      - name: Run Procurement Financial Truth targeted tests
        run: node --test 09_QA/business-os/procurement-financial-truth.test.mjs

      - name: Check Partial Financial Baseline helper syntax
        run: node --check 02_CORE/shared/partial-financial-baseline-v1.mjs

      - name: Run Partial Financial Baseline targeted tests
        run: node --test 09_QA/business-os/partial-financial-baseline.test.mjs

      - name: Run all Business OS contract tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in $(find 09_QA/business-os -maxdepth 1 -name '*.test.mjs' -type f | sort); do
            echo "RUN $test_file"
            node "$test_file"
          done
