name: Business OS Contract Tests

on:
  push:
    paths:
      - '02_CORE/contracts/**'
      - '02_CORE/shared/financial-truth-v1.mjs'
      - '09_QA/business-os/**'
      - '.github/workflows/business-os-contract-tests.yml'
  pull_request:
    paths:
      - '02_CORE/contracts/**'
      - '02_CORE/shared/financial-truth-v1.mjs'
      - '09_QA/business-os/**'
      - '.github/workflows/business-os-contract-tests.yml'

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run all Business OS contract tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in $(find 09_QA/business-os -maxdepth 1 -name '*.test.mjs' -type f | sort); do
            echo "RUN $test_file"
            node "$test_file"
          done
