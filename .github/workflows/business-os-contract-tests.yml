name: Business OS Contract Tests

on:
  push:
    paths:
      - '02_CORE/contracts/**'
      - '09_QA/business-os/**'
      - '.github/workflows/business-os-contract-tests.yml'
  pull_request:
    paths:
      - '02_CORE/contracts/**'
      - '09_QA/business-os/**'
      - '.github/workflows/business-os-contract-tests.yml'

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Store/Product foundation
        run: node 09_QA/business-os/store-product-foundation.test.mjs
