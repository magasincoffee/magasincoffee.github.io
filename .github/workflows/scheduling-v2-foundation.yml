name: Scheduling V2 Foundation QA
on:
  pull_request:
    paths:
      - '05_MANAGER/SchedulingV2/**'
      - '09_QA/people-shift/scheduling-v2-*.test.mjs'
      - '01_DOCS/MAGASIN/05_SYSTEM/MAGASIN_SCHEDULING_V2_SOT.md'
      - '.github/workflows/scheduling-v2-foundation.yml'
  workflow_dispatch:
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: V2 contracts and behavioral checks
        run: node --test 09_QA/people-shift/scheduling-v2-*.test.mjs
      - name: Validate all V2 JS syntax
        run: |
          for f in 05_MANAGER/SchedulingV2/*.js; do node --check "$f"; done
