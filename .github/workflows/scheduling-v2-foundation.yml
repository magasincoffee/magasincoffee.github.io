name: Scheduling V2 Foundation QA
on:
  pull_request:
    paths:
      - '05_MANAGER/SchedulingV2/**'
      - '09_QA/people-shift/scheduling-v2-foundation.test.mjs'
      - '01_DOCS/MAGASIN/05_SYSTEM/MAGASIN_SCHEDULING_V2_SOT.md'
      - '.github/workflows/scheduling-v2-foundation.yml'
  workflow_dispatch:
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static contract and read-only gate
        run: node --test 09_QA/people-shift/scheduling-v2-foundation.test.mjs
      - name: JavaScript syntax gate
        run: |\n          node --check 05_MANAGER/SchedulingV2/schedule-v2.js\n          node --check 05_MANAGER/SchedulingV2/read-adapter-v1.js
