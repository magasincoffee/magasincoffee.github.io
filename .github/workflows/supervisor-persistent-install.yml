name: Supervisor Persistent Install

on:
  push:
    branches:
      - feat/supervisor-actions
    paths:
      - '.github/workflows/supervisor-persistent-install.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supervisor-persistent-install-${{ github.repository }}
  cancel-in-progress: false

jobs:
  install-start:
    if: github.actor == 'magasincoffee'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 08_INTEGRATIONS/supervisor
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install latest Supervisor runtime
        run: |
          & '.\windows\install-supervisor.ps1'
      - name: Start live Supervisor
        run: |
          & "$env:LOCALAPPDATA\MAGASIN\BusinessOS\supervisor\runtime\windows\start-supervisor.ps1"
          Start-Sleep -Seconds 8

          $root = Join-Path $env:LOCALAPPDATA 'MAGASIN\BusinessOS\supervisor'
          $pidFile = Join-Path $root 'supervisor.pid'
          $stop = Join-Path $root 'STOP'

          if (Test-Path $stop) { throw 'STOP sentinel unexpectedly exists after START.' }
          if (-not (Test-Path $pidFile)) { throw 'Supervisor PID file not created.' }

          $pidValue = Get-Content $pidFile | Select-Object -First 1
          if (-not (Get-Process -Id $pidValue -ErrorAction SilentlyContinue)) {
            throw 'Supervisor process is not alive after START.'
          }

          Write-Host "SUPERVISOR_STARTED=True"
          Write-Host "SUPERVISOR_PID=$pidValue"

  verify-persistence:
    needs: install-start
    if: github.actor == 'magasincoffee'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Verify Supervisor survived previous Actions job cleanup
        shell: powershell
        run: |
          $root = Join-Path $env:LOCALAPPDATA 'MAGASIN\BusinessOS\supervisor'
          $pidFile = Join-Path $root 'supervisor.pid'
          $target = Join-Path $root 'target.json'
          $startCmd = Join-Path ([Environment]::GetFolderPath('Desktop')) 'START_MAGASIN_SUPERVISOR.cmd'
          $stopCmd = Join-Path ([Environment]::GetFolderPath('Desktop')) 'STOP_MAGASIN_SUPERVISOR.cmd'

          if (-not (Test-Path $pidFile)) { throw 'Supervisor PID file missing after job boundary.' }
          $pidValue = Get-Content $pidFile | Select-Object -First 1
          if (-not (Get-Process -Id $pidValue -ErrorAction SilentlyContinue)) {
            throw 'Supervisor did not survive Actions job cleanup.'
          }
          if (-not (Test-Path $target)) { throw 'Local conversation target missing.' }
          if (-not (Test-Path $startCmd)) { throw 'Desktop START shortcut missing.' }
          if (-not (Test-Path $stopCmd)) { throw 'Desktop STOP shortcut missing.' }

          Write-Host "PERSISTENT_SUPERVISOR_ALIVE=True"
          Write-Host "DESKTOP_KILL_SWITCH_READY=True"
