name: Workforce Server Guards Signed JWT DB E2E

on:
  pull_request:
    paths:
      - '07_DATABASE/migrations/20261022080000_workforce_employee_availability_deadline_v1.sql'
      - '07_DATABASE/migrations/20261022081000_workforce_shift_swap_24h_submission_v1.sql'
      - '09_QA/people-shift/workforce-server-guards-487-*'
      - '.github/workflows/workforce-server-guards-487-signed-jwt-db-qa.yml'
  push:
    paths:
      - '07_DATABASE/migrations/20261022080000_workforce_employee_availability_deadline_v1.sql'
      - '07_DATABASE/migrations/20261022081000_workforce_shift_swap_24h_submission_v1.sql'
      - '09_QA/people-shift/workforce-server-guards-487-*'
      - '.github/workflows/workforce-server-guards-487-signed-jwt-db-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-jwt-availability-swap:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: workforce_qa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-temporary-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d workforce_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      QA_JWT_SECRET: workforce-guards-local-synthetic-hs256-secret-2026
      QA_POSTGREST_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Create disposable PostgreSQL with synthetic users and permissive QA-only RLS
        run: |
          docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d workforce_qa -v ON_ERROR_STOP=1 < 09_QA/people-shift/workforce-server-guards-487-signed-jwt-fixture.sql
      - name: Apply both staged production trigger migrations to ephemeral DB ONLY
        run: |
          docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d workforce_qa -v ON_ERROR_STOP=1 < 07_DATABASE/migrations/20261022080000_workforce_employee_availability_deadline_v1.sql
          docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d workforce_qa -v ON_ERROR_STOP=1 < 07_DATABASE/migrations/20261022081000_workforce_shift_swap_24h_submission_v1.sql
      - name: Check deterministic timezone and 24h PostgreSQL boundary assertions
        run: |
          docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d workforce_qa -v ON_ERROR_STOP=1 < 09_QA/people-shift/workforce-server-guards-487-db-boundaries.sql
      - name: Start isolated PostgREST verifying HMAC signed JWT
        run: |
          docker run -d --name qa-workforce-guards-postgrest --network host \
            -e PGRST_DB_URI=postgres://workforce_qa_authenticator:qa-workforce-temporary-password@127.0.0.1:5432/workforce_qa \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="$QA_JWT_SECRET" \
            -e PGRST_SERVER_PORT=3000 \
            postgrest/postgrest:v12.2.3
          for attempt in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)"
            if [[ "$code" =~ ^(200|401|403|404)$ ]]; then exit 0; fi
            sleep 2
          done
          docker logs qa-workforce-guards-postgrest
          exit 1
      - name: Exercise signed JWT writes and all before-trigger denials using synthetic data
        run: node 09_QA/people-shift/workforce-server-guards-487-signed-jwt-e2e.mjs
      - name: Confirm isolation
        run: |
          echo 'Only disposable PostgreSQL service, fake IDs, local JWT secret.'
          echo 'Never runs Supabase production migrations or writes live employees.'
      - name: Logs on failure
        if: failure()
        run: docker logs qa-workforce-guards-postgrest || true
