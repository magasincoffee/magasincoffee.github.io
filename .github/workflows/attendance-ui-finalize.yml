name: Finalize Employee Attendance UI

on:
  workflow_run:
    workflows: ["Deploy MAGASIN workforce to GitHub Pages"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Ensure Attendance bridge is loaded in Employee V40
        shell: python
        run: |
          from pathlib import Path
          p = Path('employee/index.html')
          s = p.read_text(encoding='utf-8')
          marker = "attendance-auto-ui.js?v=20260901-v5"
          if marker in s:
              print('Attendance bridge already loaded.')
              raise SystemExit(0)
          needle = "f.src='/employee-v40-runtime.html?v=20260901-root-role-guard-v4';f.hidden=false"
          if needle not in s:
              raise SystemExit('Expected Employee V40 iframe loader not found.')
          replacement = "f.addEventListener('load',()=>{try{const d=f.contentDocument;if(!d)return;const b=d.createElement('script');b.src='/attendance-auto-ui.js?v=20260901-v5';b.async=false;d.body.appendChild(b)}catch(e){console.error('Attendance bridge load failed',e)}},{once:true});" + needle
          p.write_text(s.replace(needle, replacement, 1), encoding='utf-8')

      - name: Commit only when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MAGASIN"
          git config user.email "bachvantoi1994@gmail.com"
          git add employee/index.html
          if git diff --cached --quiet; then
            echo "Attendance UI already finalized."
            exit 0
          fi
          git commit -m "fix(attendance): load V40 attendance bridge [skip pages]"
          git push origin main
