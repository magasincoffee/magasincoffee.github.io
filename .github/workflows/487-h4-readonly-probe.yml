name: Workforce 487 H4 Readonly Probe
on:
  push:
    branches:
      - qa/487-h4-readonly-probe-20261024
    paths:
      - .github/workflows/487-h4-readonly-probe.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/487-h4-readonly-probe.yml
permissions:
  contents: read
jobs:
  readonly-h4-probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Identify H4 runner without reading user files
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:COMPUTERNAME -ne 'H4') { throw 'NOT_H4_RUNNER_STOP' }
          Write-Output 'H4_SELF_HOSTED_RUNNER_PASS'
          $node = Get-Command node -ErrorAction SilentlyContinue
          if ($node) { Write-Output 'H4_NODE_AVAILABLE' } else { Write-Output 'H4_NODE_MISSING' }
          $chrome = (Test-Path 'C:\Program Files\Google\Chrome\Application\chrome.exe') -or (Test-Path 'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe')
          if ($chrome) { Write-Output 'H4_CHROME_AVAILABLE' } else { Write-Output 'H4_CHROME_NOT_AT_DEFAULT_PATH' }
      - name: Public website read-only reachability
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($url in @('https://magasincoffee.github.io/', 'https://magasincoffee.github.io/manager/scheduling/')) {
            $r = Invoke-WebRequest -Uri $url -UseBasicParsing -Method Get -TimeoutSec 20
            if ($r.StatusCode -ne 200) { throw 'SITE_HTTP_NOT_200' }
          }
          Write-Output 'H4_PUBLIC_WEB_READONLY_HTTP_200_PASS'
