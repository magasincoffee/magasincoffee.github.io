name: XSTORE-019O Local Supabase Platform Preflight

on:
  pull_request:
    paths:
      - '.github/workflows/xstore-019o-platform-clone-preflight.yml'
      - '09_QA/people-shift/xstore-019o-supabase-initialized-clone.sh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/xstore-019o-platform-clone-preflight.yml'
      - '09_QA/people-shift/xstore-019o-supabase-initialized-clone.sh'

permissions:
  contents: read

concurrency:
  group: xstore019o-platform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce no-secrets, no-production, bounded Supabase clone
        shell: bash
        run: |
          set -euo pipefail
          bash -n 09_QA/people-shift/xstore-019o-supabase-initialized-clone.sh
          node <<'NODE'
          const fs=require('node:fs'), assert=require('node:assert/strict');
          const sh=fs.readFileSync('09_QA/people-shift/xstore-019o-supabase-initialized-clone.sh','utf8');
          const y=fs.readFileSync('.github/workflows/xstore-019o-platform-clone-preflight.yml','utf8');
          for(const m of ['supabase init --yes','supabase start --exclude',"to_regclass('auth.users')","to_regclass('storage.objects')",'supabase stop --no-backup','TRUSTED_MAIN_ONLY'])
            assert(sh.includes(m),'PLATFORM_PREFLIGHT_CONTRACT_MISSING');
          assert(y.includes("github.event_name == 'push' && github.ref == 'refs/heads/main'"),'NO_TRUSTED_MAIN_GATE');
          assert(!y.includes('pull_request_target:'),'UNSAFE_EVENT');
          assert(!y.includes('secrets.')&&!sh.includes('DB_URL')&&!sh.includes('MAGASIN_NOIBO_'),'PRODUCTION_SECRET_PROHIBITED');
          assert(!sh.includes('supabase link')&&!sh.includes('supabase db push'),'PRODUCTION_MUTATION_PROHIBITED');
          console.log('XSTORE_019O_PLATFORM_SOURCE_ADMISSION=PASS; NO_PRODUCTION_SECRETS_ON_PR');
          NODE

  initialized-platform-proof:
    needs: source-contract
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Prove authentic local Supabase Auth and Storage schema
        shell: bash
        run: |
          set -euo pipefail
          bash 09_QA/people-shift/xstore-019o-supabase-initialized-clone.sh
