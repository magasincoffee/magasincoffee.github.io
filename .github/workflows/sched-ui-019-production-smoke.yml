name: SCHED-UI-019 Production Smoke

on:
  push:
    branches:
      - 'closure/sched-ui-019-production-smoke'
    paths:
      - '.github/sched-ui-019-production-smoke.mjs'
      - '.github/workflows/sched-ui-019-production-smoke.yml'

permissions:
  contents: read

concurrency:
  group: sched-ui-019-production-smoke
  cancel-in-progress: true

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QA_BASE_URL: https://magasincoffee.github.io
      QA_OUT: qa-artifacts/sched-ui-019
      EXPECTED_MAIN_SHA: 7eff9525697c81fc76007b92dac6d92b6333b459
      PRODUCT_MERGE_SHA: cb2371b997c4bd8e6d0526553ced9d62a1c9175a
    steps:
      - uses: actions/checkout@v4

      - name: Verify production main has not drifted
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git ls-remote https://github.com/magasincoffee/magasincoffee.github.io.git refs/heads/main | cut -f1)"
          echo "SCHED_UI_019_EXPECTED_MAIN_SHA=$EXPECTED_MAIN_SHA"
          echo "SCHED_UI_019_ACTUAL_MAIN_SHA=$actual"
          test "$actual" = "$EXPECTED_MAIN_SHA"
          echo "SCHED_UI_019_EXACT_MAIN=PASS"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run read-only Scheduling production smoke
        run: node .github/sched-ui-019-production-smoke.mjs

      - name: Detect ACTIVE production QA credentials
        id: creds
        shell: bash
        env:
          QA_USER: ${{ secrets.PROCUREMENT_QA_USERNAME }}
          QA_PASS: ${{ secrets.PROCUREMENT_QA_PASSWORD }}
        run: |
          if [ -n "$QA_USER" ] && [ -n "$QA_PASS" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'SCHED_UI_019_CREDENTIALED_AUTH=OWNER_REQUIRED'
          fi

      - name: Run credentialed production login/logout smoke
        if: steps.creds.outputs.enabled == 'true'
        env:
          AUTH_PROD_BASE_URL: https://magasincoffee.github.io
          AUTH_PROD_ACTIVE_USERNAME: ${{ secrets.PROCUREMENT_QA_USERNAME }}
          AUTH_PROD_ACTIVE_PASSWORD: ${{ secrets.PROCUREMENT_QA_PASSWORD }}
          AUTH_PROD_REQUIRE_ACTIVE_LOGOUT: 'true'
          AUTH_PROD_RUN_RECOVERY_REQUEST: 'false'
        run: |
          node 09_QA/auth/auth-prod-005-credentialed-production-smoke.mjs
          echo 'SCHED_UI_019_CREDENTIALED_AUTH=PASS'

      - name: Record unrelated Procurement gate history
        shell: bash
        run: |
          cat > "$QA_OUT/procurement-scope-note.json" <<'JSON'
          {
            "scope": "non-scheduling / pre-existing",
            "release_run": 37138935861,
            "prior_failed_runs": [37067115455,36968536459,36932667520],
            "release_failure_reason": "production Procurement reference coverage data: 31 items missing reference price/spec",
            "release_diagnostics": {
              "app_loaded": "PASS",
              "console_errors": "PASS",
              "page_errors": "PASS",
              "request_failures": "PASS",
              "http_5xx": "PASS"
            },
            "scheduling_release_regression": false
          }
          JSON
          echo 'SCHED_UI_019_PROCUREMENT_NON_SCOPE_PREEXISTING=RECORDED'

      - name: Upload SCHED-UI-019 smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sched-ui-019-production-smoke-${{ github.run_id }}
          path: qa-artifacts/sched-ui-019/
          if-no-files-found: warn
          retention-days: 30
