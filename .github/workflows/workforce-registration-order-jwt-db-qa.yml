name: Workforce Registration Order Signed JWT DB E2E

on:
  pull_request:
    paths:
      - 'supabase/migrations/20261022092000_workforce_registration_order_v1.sql'
      - '05_MANAGER/SchedulingV2/store-planner-v1.js'
      - '05_MANAGER/SchedulingV2/auto-ui-v1.js'
      - '09_QA/people-shift/workforce-registration-order-*'
      - '.github/workflows/workforce-registration-order-jwt-db-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-signed-jwt-db-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: workforce_qa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: qa-temporary-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d workforce_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      QA_JWT_SECRET: workforce-registration-order-ci-signing-key-v1-32chars
      QA_POSTGREST_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Create synthetic identities and permission fixtures (isolated PostgreSQL)
        shell: bash
        run: |
          docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d workforce_qa -v ON_ERROR_STOP=1 < 09_QA/people-shift/workforce-registration-order-db-fixture.sql
      - name: Apply staged read-only RPC ONLY to isolated PostgreSQL
        shell: bash
        run: |
          docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d workforce_qa -v ON_ERROR_STOP=1 < supabase/migrations/20261022092000_workforce_registration_order_v1.sql
      - name: Start local PostgREST enforcing signed JWT claims
        shell: bash
        run: |
          docker run -d --name qa-workforce-postgrest --network host \
            -e PGRST_DB_URI=postgres://qa_authenticator:qa-local-disposable-password@127.0.0.1:5432/workforce_qa \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="$QA_JWT_SECRET" \
            -e PGRST_SERVER_PORT=3000 \
            postgrest/postgrest:v12.2.3
          for attempt in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)"
            if [[ "$code" =~ ^(200|401|403|404)$ ]]; then exit 0; fi
            sleep 2
          done
          docker logs qa-workforce-postgrest
          exit 1
      - name: Test actual PostgREST JWT signatures, RLS boundaries and branch scope
        run: node 09_QA/people-shift/workforce-registration-order-jwt-e2e.mjs
      - name: Confirm no production access
        run: |
          echo 'This job runs only synthetic data on its own PostgreSQL service.'
          echo 'No Supabase credentials, hosted database references or production writes.'
      - name: Show PostgREST diagnostics on failure
        if: failure()
        run: docker logs qa-workforce-postgrest || true
