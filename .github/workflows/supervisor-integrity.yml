name: Supervisor Integrity

on:
  pull_request:
    paths:
      - "08_INTEGRATIONS/supervisor/**"
      - ".github/workflows/supervisor-*.yml"
  push:
    branches:
      - main
    paths:
      - "08_INTEGRATIONS/supervisor/**"
      - ".github/workflows/supervisor-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supervisor-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-audit:
    name: static-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run Supervisor tests
        working-directory: 08_INTEGRATIONS/supervisor
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test

      - name: Enforce production cleanup invariants
        shell: bash
        run: |
          set -euo pipefail

          test ! -e .github/workflows/task-049-v36-live-start.yml
          test ! -e .github/workflows/task-049-open-robot-now.yml
          test -e .github/workflows/supervisor-open-control-panel.yml
          test -e .github/workflows/supervisor-integrity.yml

          if grep -R -nE '2026-09-19\.(36|37|38|39|40|41|42)'             08_INTEGRATIONS/supervisor/src             08_INTEGRATIONS/supervisor/windows             .github/workflows/supervisor-autostart-install.yml             .github/workflows/supervisor-open-control-panel.yml             .github/workflows/supervisor-integrity.yml; then
            echo "Stale operational runtime fingerprint found"
            exit 1
          fi

          if grep -R -nE 'LANE_RESULT_RELAY_RECONCILE_BLOCKED|stable Brain target changed without matching relay digest'             08_INTEGRATIONS/supervisor/src/runtime; then
            echo "Terminal relay blocking path remains"
            exit 1
          fi

          if grep -R -nE 'TASK-0[0-9]+' 08_INTEGRATIONS/supervisor/src 08_INTEGRATIONS/supervisor/windows .github/workflows/supervisor-autostart-install.yml .github/workflows/supervisor-open-control-panel.yml .github/workflows/supervisor-integrity.yml; then
            echo "Task-specific production hard-code found"
            exit 1
          fi

          echo "STATIC_SUPERVISOR_INTEGRITY=True"

  runtime-audit:
    name: runtime-audit
    needs: static-audit
    if: github.event_name != 'pull_request'
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Audit installed Supervisor runtime without mutation
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $sourceUrl = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/08_INTEGRATIONS/supervisor/src/runtime/three-lane-cli.mjs"
          $sourceRuntime = (Invoke-WebRequest -UseBasicParsing -Uri $sourceUrl -TimeoutSec 15).Content
          $versionMatch = [regex]::Match($sourceRuntime, 'SUPERVISOR_RUNTIME_VERSION\s*=\s*"([^"]+)"')
          if (-not $versionMatch.Success) { throw "Source runtime version not found" }
          $expectedVersion = $versionMatch.Groups[1].Value

          $root = Join-Path $env:LOCALAPPDATA "MAGASIN\BusinessOS\supervisor"
          $statusFile = Join-Path $root "lane-status.json"
          $registryFile = Join-Path $root "lane-registry.json"
          $evidenceDir = Join-Path $root "lane-evidence"
          $profile = Join-Path $root "browser_profile"

          $healthy = $false
          $status = $null
          $registry = $null
          $cdpHealthy = $false

          for ($i = 0; $i -lt 90; $i++) {
            try {
              if ((Test-Path $statusFile) -and (Test-Path $registryFile)) {
                $status = Get-Content $statusFile -Raw -Encoding UTF8 | ConvertFrom-Json
                $registry = Get-Content $registryFile -Raw -Encoding UTF8 | ConvertFrom-Json
              }

              $wrapper = Get-CimInstance Win32_Process -Filter "Name='powershell.exe'" -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.CommandLine -and
                  $_.CommandLine -like "*run-supervisor.ps1*" -and
                  $_.CommandLine -like "*MAGASIN\BusinessOS\supervisor*"
                } |
                Select-Object -First 1

              $threeLane = Get-CimInstance Win32_Process -Filter "Name='node.exe'" -ErrorAction SilentlyContinue |
                Where-Object { $_.CommandLine -and $_.CommandLine -like "*three-lane-cli.mjs*" } |
                Select-Object -First 1

              $chrome = Get-CimInstance Win32_Process -Filter "Name='chrome.exe'" -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.CommandLine -and
                  $_.CommandLine -like "*$profile*" -and
                  $_.CommandLine -match "--remote-debugging-port=(\d+)"
                } |
                Select-Object -First 1

              $cdpHealthy = $false
              if ($chrome -and $chrome.CommandLine -match "--remote-debugging-port=(\d+)") {
                $port = [int]$Matches[1]
                try {
                  $version = Invoke-RestMethod -Uri "http://127.0.0.1:$port/json/version" -TimeoutSec 2
                  $cdpHealthy = [bool]$version.webSocketDebuggerUrl
                } catch {
                  $cdpHealthy = $false
                }
              }

              if (
                $wrapper -and
                $threeLane -and
                $chrome -and
                $cdpHealthy -and
                $status -and
                $registry -and
                [string]$status.mode -eq "THREE_LANE_V1" -and
                [string]$status.supervisor_runtime_version -eq $expectedVersion -and
                @($status.lanes).Count -eq 3
              ) {
                $healthy = $true
                break
              }
            } catch {}

            Start-Sleep -Seconds 2
          }

          if (-not $healthy) {
            throw "Installed Supervisor did not reach the exact-commit Three-Lane runtime version and healthy CDP state"
          }

          $blockedRelayCount = 0
          $activeEvidence = New-Object System.Collections.Generic.HashSet[string]
          foreach ($laneId in @("lane-1","lane-2","lane-3")) {
            $lane = $registry.lanes.$laneId
            if ($lane -and $lane.relay_inflight) {
              if ([bool]$lane.relay_inflight.reconcile_blocked) {
                $blockedRelayCount += 1
              }
              $p = [string]$lane.relay_inflight.screenshot_path
              if (-not [string]::IsNullOrWhiteSpace($p)) {
                [void]$activeEvidence.Add([IO.Path]::GetFullPath($p))
              }
            }
          }

          if ($blockedRelayCount -gt 0) {
            throw "A relay_inflight latch remains reconcile_blocked"
          }

          $orphanEvidenceCount = 0
          if (Test-Path $evidenceDir) {
            foreach ($file in @(Get-ChildItem $evidenceDir -File -Filter "*.png" -ErrorAction SilentlyContinue)) {
              if (-not $activeEvidence.Contains([IO.Path]::GetFullPath($file.FullName))) {
                $orphanEvidenceCount += 1
              }
            }
          }
          if ($orphanEvidenceCount -gt 0) {
            throw "Orphan relay evidence remains after runtime startup cleanup"
          }

          Write-Host "SUPERVISOR_RUNTIME_VERSION_MATCH=True"
          Write-Host "SUPERVISOR_WRAPPER_HEALTHY=True"
          Write-Host "THREE_LANE_HEALTHY=True"
          Write-Host "ROBOT_CHROME_HEALTHY=True"
          Write-Host "ROBOT_CDP_HEALTHY=True"
          Write-Host "RELAY_BLOCKED_LATCH_COUNT=0"
          Write-Host "ORPHAN_RELAY_EVIDENCE_COUNT=0"
          Write-Host "RUNTIME_SUPERVISOR_INTEGRITY=True"
