name: Night Run Hard Stop

on:
  schedule:
    - cron: "15 2 19 9 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: night-run-2026-09-18-hard-stop
  cancel-in-progress: false

jobs:
  hard-stop:
    runs-on: ubuntu-latest
    steps:
      - name: Guard approved night window
        id: guard
        shell: bash
        run: |
          now_epoch="$(date -u +%s)"
          boundary_epoch="$(date -u -d '2026-09-19T02:15:00Z' +%s)"
          day_end_epoch="$(date -u -d '2026-09-20T00:00:00Z' +%s)"
          if [ "$now_epoch" -ge "$boundary_epoch" ] && [ "$now_epoch" -lt "$day_end_epoch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Enforce 09:15 +07 hard stop
        if: steps.guard.outputs.run == 'true'
        shell: python
        run: |
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          state_path = Path("01_DOCS/MAGASIN/00_PROJECT_STATE.json")
          cursor_path = Path("02_CORE/contracts/business-os-execution-cursor.v1.json")
          current_state_path = Path("01_DOCS/MAGASIN/00_CURRENT_STATE.md")
          task_queue_path = Path("01_DOCS/MAGASIN/00_TASK_QUEUE.md")
          architecture_path = Path("01_DOCS/MAGASIN/00_ARCHITECTURE_5_STEP_RESET.md")
          report_path = Path("01_DOCS/MAGASIN/08_AUTONOMY/NIGHT_RUN_REPORT_2026-09-19.md")

          def replace_required(path, replacements):
              text = path.read_text(encoding="utf-8")
              for old, new in replacements:
                  if old in text:
                      text = text.replace(old, new, 1)
                  elif new not in text:
                      raise SystemExit(f"Hard-stop reconciliation marker missing in {path}: {old}")
              path.write_text(text, encoding="utf-8")

          state = json.loads(state_path.read_text(encoding="utf-8"))
          night = state.get("night_run") or {}
          if night.get("id") != "NIGHT_RUN_2026-09-18":
              raise SystemExit("Approved night-run id is not active; no mutation.")

          completed_at = night.get("completed_at") or datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
          night["status"] = "NIGHT_WINDOW_COMPLETE"
          night["completed_at"] = completed_at
          night["hard_stop_enforced_by"] = night.get("hard_stop_enforced_by") or "GITHUB_HOSTED_WORKFLOW"
          night["hard_stop_pending"] = False
          state["night_run"] = night
          state["current_task"] = "TASK-048"
          state["current_task_title"] = "Night final checkpoint / Owner review"
          state["status"] = "WAIT_USER"
          state["autonomy"] = "MANUAL"
          state["blocked"] = False
          state["requires_user"] = True
          state["next_task"] = None
          state["last_updated"] = "2026-09-19"
          state["owner_boundary"] = {
              "task": "TASK-048",
              "resolved": ["NIGHT_RUN_HARD_STOP_ENFORCED"],
              "pending": ["OWNER_REVIEW_NIGHT_RUN_REPORT"]
          }
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          if cursor_path.exists():
              cursor = json.loads(cursor_path.read_text(encoding="utf-8"))
              cursor_already_complete = (
                  cursor.get("status") == "WAIT_USER"
                  and cursor.get("checkpoint") == "NIGHT_WINDOW_COMPLETE"
              )
              cursor_updated_at = cursor.get("updated_at") if cursor_already_complete else completed_at
              completed_operations = cursor.setdefault("completed_operations", [])
              if "NIGHT_WINDOW_COMPLETE" not in completed_operations:
                  completed_operations.append("NIGHT_WINDOW_COMPLETE")
              cursor.update({
                  "project_id": "magasin-business-os",
                  "task": "TASK-048",
                  "micro_task": "night_final_checkpoint",
                  "status": "WAIT_USER",
                  "checkpoint": "NIGHT_WINDOW_COMPLETE",
                  "lease": None,
                  "updated_at": cursor_updated_at
              })
              cursor_path.write_text(json.dumps(cursor, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          replace_required(current_state_path, [
              (
                  "**TASK-048 — Night final checkpoint — IN_PROGRESS / AUTO_CONTINUE**",
                  "**TASK-048 — Night final checkpoint / Owner review — WAIT_USER / MANUAL**"
              ),
              (
                  "**AUTO_CONTINUE — TASK-048:** TASK-047 documentation/evidence is complete.",
                  "**WAIT_USER — TASK-048:** `NIGHT_WINDOW_COMPLETE` has been enforced; Owner review of the night-run report is required."
              ),
              (
                  "TASK-048 is now a temporal safety gate, not a feature task:",
                  "TASK-048 is now an Owner-review gate after the completed autonomous night window:"
              ),
              (
                  "5. at **2026-09-19 09:15 +07**, the GitHub-hosted hard-stop workflow sets `NIGHT_WINDOW_COMPLETE / WAIT_USER / MANUAL` and requires Owner review.",
                  "5. the GitHub-hosted hard-stop enforced `NIGHT_WINDOW_COMPLETE / WAIT_USER / MANUAL`; Owner review is now required."
              ),
              (
                  "The GitHub-hosted hard-stop guard will set the project to `WAIT_USER / NIGHT_WINDOW_COMPLETE` at 09:15 +07 even if the PC is offline.",
                  "The GitHub-hosted hard-stop guard set the project to `WAIT_USER / NIGHT_WINDOW_COMPLETE` at the approved boundary independently of the PC."
              )
          ])

          replace_required(task_queue_path, [
              (
                  "| TASK-048 | Night final checkpoint | 10m | report + NIGHT_WINDOW_COMPLETE + WAIT_USER | IN_PROGRESS |",
                  "| TASK-048 | Night final checkpoint | 10m | report + NIGHT_WINDOW_COMPLETE + WAIT_USER | WAIT_USER |"
              )
          ])

          replace_required(architecture_path, [
              (
                  "- **TASK-048 — Night final checkpoint:** final report prepared; remain time-gated until the approved 09:15 +07 GitHub-hosted hard stop sets NIGHT_WINDOW_COMPLETE / WAIT_USER. IN_PROGRESS.",
                  "- **TASK-048 — Night final checkpoint:** hard stop enforced; final report ready; Owner review required before any new autonomous window. WAIT_USER."
              )
          ])

          replace_required(report_path, [
              (
                  "**Current status:** FINAL_CHECKPOINT_IN_PROGRESS / AUTO_CONTINUE",
                  "**Current status:** NIGHT_WINDOW_COMPLETE / WAIT_USER"
              ),
              (
                  "TASK-048 must **not** declare `NIGHT_WINDOW_COMPLETE` before the approved boundary.",
                  "The approved 09:15 +07 boundary has been reached and the GitHub-hosted hard-stop declared `NIGHT_WINDOW_COMPLETE`."
              ),
              (
                  "At **09:15 +07**, `.github/workflows/night-run-hard-stop.yml` is the canonical GitHub-hosted enforcement path. It will:",
                  "At **09:15 +07**, `.github/workflows/night-run-hard-stop.yml` enforced the canonical boundary and:"
              ),
              (
                  "Until that boundary, no new feature work, merge, live provider action, or production activation is authorized by TASK-048.",
                  "Autonomy is now **MANUAL**. Owner review is required before any new autonomous window, merge, live provider action, or production activation."
              )
          ])

      - name: Commit hard-stop checkpoint
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No hard-stop changes required."
            exit 0
          fi
          git config user.name "MAGASIN Night Guard"
          git config user.email "actions@users.noreply.github.com"
          git add \
            01_DOCS/MAGASIN/00_PROJECT_STATE.json \
            01_DOCS/MAGASIN/00_CURRENT_STATE.md \
            01_DOCS/MAGASIN/00_TASK_QUEUE.md \
            01_DOCS/MAGASIN/00_ARCHITECTURE_5_STEP_RESET.md \
            02_CORE/contracts/business-os-execution-cursor.v1.json \
            01_DOCS/MAGASIN/08_AUTONOMY/NIGHT_RUN_REPORT_2026-09-19.md
          git commit -m "state: enforce approved night-run hard stop"
          git push origin HEAD:main
