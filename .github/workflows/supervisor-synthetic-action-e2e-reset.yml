name: Supervisor Synthetic E2E Concurrency Reset

on:
  push:
    branches:
      - feat/supervisor-actions
    paths:
      - '.github/workflows/supervisor-synthetic-action-e2e-reset.yml'

permissions:
  contents: read

concurrency:
  group: supervisor-synthetic-action-e2e-${{ github.repository }}
  cancel-in-progress: true

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Cancelling synthetic E2E to inspect any stalled action."
