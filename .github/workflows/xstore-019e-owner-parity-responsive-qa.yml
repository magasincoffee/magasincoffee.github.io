name: XSTORE-019E Owner Parity Responsive QA
on:
  push:
    paths:
      - '05_MANAGER/Workforce/draft-publish-v1.js'
      - '02_CORE/ui/workforce-scheduling-polish-v1.css'
      - '05_MANAGER/Workforce/manager-scheduling-ui2-v1.js'
      - '04_OWNER/Workforce/runtime/owner-workforce-runtime.html'
      - '09_QA/people-shift/sched-05-owner-scheduling-fixture.html'
      - '09_QA/people-shift/xstore-019e-owner-parity-responsive-v1.test.mjs'
      - '09_QA/people-shift/xstore-019e-owner-parity-responsive-browser.mjs'
      - '09_QA/people-shift/sched-07-ui-responsive-browser.mjs'
      - '.github/workflows/xstore-019e-owner-parity-responsive-qa.yml'
  pull_request:
    paths:
      - '05_MANAGER/Workforce/draft-publish-v1.js'
      - '02_CORE/ui/workforce-scheduling-polish-v1.css'
      - '05_MANAGER/Workforce/manager-scheduling-ui2-v1.js'
      - '04_OWNER/Workforce/runtime/owner-workforce-runtime.html'
      - '09_QA/people-shift/sched-05-owner-scheduling-fixture.html'
      - '09_QA/people-shift/xstore-019e-owner-parity-responsive-v1.test.mjs'
      - '09_QA/people-shift/xstore-019e-owner-parity-responsive-browser.mjs'
      - '09_QA/people-shift/sched-07-ui-responsive-browser.mjs'
      - '.github/workflows/xstore-019e-owner-parity-responsive-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-parity-responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check shared scheduling runtime and QA
        run: |
          node --check 05_MANAGER/Workforce/draft-publish-v1.js
          node --check 05_MANAGER/Workforce/manager-scheduling-ui2-v1.js
          node --check 09_QA/people-shift/xstore-019e-owner-parity-responsive-browser.mjs
          node --check 09_QA/people-shift/sched-07-ui-responsive-browser.mjs
      - name: Run XSTORE-019E static parity contracts
        run: node --test 09_QA/people-shift/xstore-019e-owner-parity-responsive-v1.test.mjs
      - name: Run existing shared scheduling contracts
        run: |
          node --test 09_QA/people-shift/sched-05-owner-scheduling-v1.test.mjs
          node --test 09_QA/people-shift/xstore-019b-direct-calendar-editing-v1.test.mjs
          node --test 09_QA/people-shift/sched-ui-011-responsive-contract.test.mjs
          node --test 09_QA/people-shift/ui2-012-manager-scheduling-contract.test.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start exact-head QA server
        shell: bash
        run: |
          mkdir -p qa-artifacts/xstore-019e
          nohup python3 -m http.server 8784 --bind 127.0.0.1 > /tmp/xstore019e-http.log 2>&1 &
          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsS http://127.0.0.1:8784/09_QA/people-shift/sched-05-owner-scheduling-fixture.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/xstore019e-http.log || true
          exit 1
      - name: Run XSTORE-019E Owner and Manager browser acceptance
        env:
          QA_BASE_URL: http://127.0.0.1:8784
          QA_OUT: qa-artifacts/xstore-019e
        run: node 09_QA/people-shift/xstore-019e-owner-parity-responsive-browser.mjs
      - name: Run accepted responsive regression
        env:
          QA_BASE_URL: http://127.0.0.1:8784
          QA_OUT: qa-artifacts/xstore-019e
        run: node 09_QA/people-shift/sched-07-ui-responsive-browser.mjs
      - name: Upload XSTORE-019E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xstore-019e-owner-parity-responsive-${{ github.run_id }}
          path: qa-artifacts/xstore-019e/
          if-no-files-found: warn
          retention-days: 30
