name: Supervisor Installer Dry Run Smoke

on:
  push:
    branches:
      - feat/supervisor-actions
    paths:
      - '.github/workflows/supervisor-installer-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supervisor-installer-smoke-${{ github.repository }}
  cancel-in-progress: false

jobs:
  install-smoke:
    if: github.actor == 'magasincoffee'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 08_INTEGRATIONS/supervisor
        shell: powershell

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Supervisor runtime locally
        run: |
          & '.\windows\install-supervisor.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Start Supervisor in dry-run mode
        run: |
          $env:RUNNER_TRACKING_ID = 'MAGASIN_SUPERVISOR_SMOKE'
          & "$env:LOCALAPPDATA\MAGASIN\BusinessOS\supervisor\runtime\windows\start-supervisor.ps1" -DryRun
          Start-Sleep -Seconds 8

          $pidFile = Join-Path $env:LOCALAPPDATA 'MAGASIN\BusinessOS\supervisor\supervisor.pid'
          if (-not (Test-Path $pidFile)) { throw 'Supervisor PID file was not created.' }

          $pidValue = Get-Content $pidFile | Select-Object -First 1
          if (-not (Get-Process -Id $pidValue -ErrorAction SilentlyContinue)) {
            throw 'Supervisor dry-run process is not alive.'
          }

          Write-Host "DRY_RUN_SUPERVISOR_PID=$pidValue"

      - name: Stop Supervisor through kill switch
        run: |
          & "$env:LOCALAPPDATA\MAGASIN\BusinessOS\supervisor\runtime\windows\stop-supervisor.ps1"

          $pidFile = Join-Path $env:LOCALAPPDATA 'MAGASIN\BusinessOS\supervisor\supervisor.pid'
          for ($i = 0; $i -lt 20; $i++) {
            if (-not (Test-Path $pidFile)) { break }
            Start-Sleep -Seconds 1
          }

          if (Test-Path $pidFile) {
            throw 'Supervisor PID file still exists after STOP sentinel.'
          }

          Write-Host 'PASS: START/STOP kill switch works and dry-run process exited.'
