name: Supervisor One-Shot E2E Concurrency Reset

on:
  push:
    branches:
      - feat/supervisor-actions
    paths:
      - '.github/workflows/supervisor-one-shot-reset.yml'

permissions:
  contents: read

concurrency:
  group: supervisor-one-shot-e2e-${{ github.repository }}
  cancel-in-progress: true

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Resetting queued one-shot so the fixed CLI can be tested."
