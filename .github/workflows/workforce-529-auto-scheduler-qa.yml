      - name: Synthetic Owner Manager Staff JWT API test and isolated teardown
        shell: bash
        env:
          QA_529_JWT_SECRET: qa-529-isolated-synthetic-only-hs256-signature-key
          QA_529_URL: http://127.0.0.1:3059
        run: |
          set -euo pipefail
          node --check 09_QA/people-shift/workforce-529-signed-jwt-http.mjs
          psql -v ON_ERROR_STOP=1 -f 09_QA/people-shift/workforce-529-signed-jwt-fixture.sql
          docker run -d --rm --name workforce529-jwt-pgrst --network host \
            -e PGRST_DB_URI='postgres://authenticator:qa-529-synthetic-only@127.0.0.1:5432/xstore_qa' \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="$QA_529_JWT_SECRET" \
            -e PGRST_SERVER_PORT=3059 \
            postgrest/postgrest:v12.2.8 >/dev/null
          trap 'docker rm -f workforce529-jwt-pgrst >/dev/null 2>&1 || true' EXIT
          ready=0
          for n in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3059/ >/dev/null 2>&1; then ready=1;break;fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then docker logs workforce529-jwt-pgrst;exit 1;fi
          node 09_QA/people-shift/workforce-529-signed-jwt-http.mjs
          # Real headless browser fetches signed role JWTs from disposable localhost PostgREST.
          # No cloud project credentials, no production API calls or published shifts.
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          QA_529_CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$QA_529_CHROME" ]; then echo "QA_CHROME_NOT_FOUND"; exit 1; fi
          export QA_529_CHROME
          node --check 09_QA/people-shift/workforce-529-authenticated-browser.mjs
          node 09_QA/people-shift/workforce-529-authenticated-browser.mjs
          # Isolated DB rollback/teardown check: no production project access.
          psql -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          delete from public.schedule_generation_assignments;
          delete from public.schedule_generation_runs;
          rollback;
          do $proof$
          begin
            if (select count(*) from public.schedule_generation_assignments)=0 then
              raise exception 'QA_ROLLBACK_DID_NOT_RESTORE_ROWS';
            end if;
            raise notice 'JWT_529_TRANSACTION_ROLLBACK=PASS';
          end
          $proof$;
          SQL



      - name: Rehearse backend-only rollback on disposable PG17
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          -- Disposable job database only: no hosted project or real shifts.
          drop function public.auto_generate_cross_store_schedule_529(date,boolean,text);
          drop function public.get_workforce_auto_scheduler_capabilities_529();
          drop function public.auto_generate_cross_store_schedule_529_core(date,boolean,text);
          do $proof$
          begin
            if to_regprocedure('public.auto_generate_cross_store_schedule_529(date,boolean,text)') is not null
              or to_regprocedure('public.get_workforce_auto_scheduler_capabilities_529()') is not null
              or to_regprocedure('public.auto_generate_cross_store_schedule_529_core(date,boolean,text)') is not null then
              raise exception 'VERSIONED_529_ROLLBACK_INCOMPLETE';
            end if;
            if public.auto_generate_cross_store_schedule_v1('2026-10-05',false)->>'legacy'<>'unchanged' then
              raise exception 'LEGACY_V1_CHANGED_DURING_ROLLBACK';
            end if;
            raise notice '529_BACKEND_ONLY_ROLLBACK_LEGACY_V1_PRESERVED=PASS';
          end
          $proof$;
          SQL

  hosted-synthetic-ui-guard:
    # Synthetic browser + static contract tests on a GitHub-hosted runner.
    # No H4 machine, real login, production SQL, or employee schedule writes.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Manager JS and scheduler contract
        run: |
          set -euo pipefail
          node --check 05_MANAGER/Workforce/cross-store-auto-schedule-v1.js
          node --test 09_QA/people-shift/workforce-529-auto-scheduler-contract.test.mjs
      - name: Run isolated Chrome scheduling DOM fixture
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then echo "CHROME_NOT_AVAILABLE"; exit 1; fi
          url="file://$PWD/09_QA/people-shift/workforce-529-h4-browser-fixture.html"
          "$CHROME" --headless --no-sandbox --no-first-run --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=4500 --dump-dom "$url" > /tmp/529-synthetic-dom.html
          if ! grep -q '<output id="qa-result">H4_529_REAL_CHROME_SYNTHETIC_DOM_PASS</output>' /tmp/529-synthetic-dom.html; then
            grep -o 'H4_529_FAIL:[^<]*' /tmp/529-synthetic-dom.html || true
            echo "HOSTED_529_SYNTHETIC_DOM_FAILED"
            exit 1
          fi
          echo "HOSTED_529_SYNTHETIC_DOM_PASS"
