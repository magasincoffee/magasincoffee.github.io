name: Supervisor One-Shot Continue E2E

on:
  push:
    branches:
      - feat/supervisor-actions
    paths:
      - '.github/workflows/supervisor-one-shot-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supervisor-one-shot-e2e-${{ github.repository }}
  cancel-in-progress: false

jobs:
  one-shot:
    if: github.actor == 'magasincoffee'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: 08_INTEGRATIONS/supervisor
        shell: powershell

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pinned dependency
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Resolve real Chrome and local target
        run: |
          $candidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe"
          )
          $chrome = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $chrome) { throw 'Installed Google Chrome not found.' }

          $target = Join-Path $env:LOCALAPPDATA 'MAGASIN\BusinessOS\supervisor\target.json'
          if (-not (Test-Path $target)) { throw 'Supervisor local target missing.' }

          "MAGASIN_SUPERVISOR_CHROME=$chrome" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Ensure real Chrome CDP session
        run: |
          $profile = Join-Path $env:LOCALAPPDATA 'MAGASIN\BusinessOS\supervisor\browser_profile'
          $ready = $false

          try {
            $null = Invoke-RestMethod -Uri 'http://127.0.0.1:9222/json/version' -TimeoutSec 2
            $ready = $true
          } catch {}

          if (-not $ready) {
            Start-Process -FilePath $env:MAGASIN_SUPERVISOR_CHROME -ArgumentList @(
              '--remote-debugging-address=127.0.0.1',
              '--remote-debugging-port=9222',
              "--user-data-dir=$profile",
              '--no-first-run',
              '--no-default-browser-check',
              'https://chatgpt.com/'
            )

            for ($i = 0; $i -lt 30; $i++) {
              try {
                $null = Invoke-RestMethod -Uri 'http://127.0.0.1:9222/json/version' -TimeoutSec 2
                $ready = $true
                break
              } catch {
                Start-Sleep -Seconds 1
              }
            }
          }

          if (-not $ready) { throw 'Real Chrome CDP endpoint unavailable.' }

      - name: Execute at most one approved Supervisor action
        run: |
          node src/runtime/one-shot-cli.mjs --cdp-url http://127.0.0.1:9222 --execute --wait-seconds 600
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Safety assertion
        run: |
          Write-Host 'PASS: one-shot executor is bounded to one Continue or safe Retry action and respects PROJECT_STATE stop gates.'
