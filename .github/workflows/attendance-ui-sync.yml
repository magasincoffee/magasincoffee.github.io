name: Sync Employee attendance UI

on:
  workflow_run:
    workflows: ["Deploy MAGASIN workforce to GitHub Pages"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: attendance-ui-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Fetch canonical attendance module
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://raw.githubusercontent.com/magasincoffee/noibo/main/web/attendance-auto-ui.js -o attendance-auto-ui.js
          test -s attendance-auto-ui.js
          node --check attendance-auto-ui.js

      - name: Inject attendance module into V40
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('employee-v40.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="/attendance-auto-ui.js?v=20260901-v3"></script>'
          if tag not in s:
              marker = '</body>'
              if marker not in s:
                  raise SystemExit('employee-v40.html missing </body>')
              s = s.replace(marker, tag + '\n' + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
          grep -q 'attendance-auto-ui.js' employee-v40.html

      - name: Commit synced module
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MAGASIN"
          git config user.email "bachvantoi1994@gmail.com"
          git add employee-v40.html attendance-auto-ui.js
          if git diff --cached --quiet; then
            echo 'Attendance module already synced.'
            exit 0
          fi
          git commit -m 'chore(attendance): sync V40 attendance module [skip attendance-ui] [skip pages]'
          git push origin main
