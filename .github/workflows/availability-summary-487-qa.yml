name: Availability Summary P1 487 QA
on:
  pull_request:
    paths:
      - '05_MANAGER/Workforce/availability-summary-v1.js'
      - '05_MANAGER/Workforce/ui-consolidation-v1.js'
      - '04_OWNER/Workforce/owner-scheduling-overview-v1.js'
      - '09_QA/people-shift/availability-summary-487-*'
      - '.github/workflows/availability-summary-487-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check availability and Owner UI
        run: |
          node --check 05_MANAGER/Workforce/availability-summary-v1.js
          node --check 04_OWNER/Workforce/owner-scheduling-overview-v1.js
          node --check 05_MANAGER/Workforce/ui-consolidation-v1.js
          node --check 02_CORE/ui/magasin-ui-v2-shell.js
      - name: Install browser dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Serve checked-out PR source locally
        run: |
          nohup python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/availability-487-server.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8767/09_QA/people-shift/availability-summary-487-fixture.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/availability-487-server.log
          exit 1
      - name: Browser QA — Manager 390px / Owner 1440px, no real sessions
        env:
          QA_BASE_URL: http://127.0.0.1:8767
        run: node 09_QA/people-shift/availability-summary-487-browser.mjs
      - name: Assert no backend writer in availability viewer
        run: |
          if grep -En '\.(insert|update|delete|upsert)\(|(sb|client|supabase)\.from\(' 05_MANAGER/Workforce/availability-summary-v1.js; then
            echo "Direct table API / writer call forbidden"; exit 1
          fi
          echo "AS487_READONLY_RPC_ONLY_PASS"