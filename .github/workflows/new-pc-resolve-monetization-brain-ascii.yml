name: New PC Resolve Monetization Brain ASCII

on:
  push:
    branches:
      - migration/new-pc-bootstrap-v1
    paths:
      - ".github/workflows/new-pc-resolve-monetization-brain-ascii.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: [self-hosted, new-pc]
    timeout-minutes: 10
    steps:
      - name: Resolve monetization Brain URL using normalized labels
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $runtime = Join-Path $env:LOCALAPPDATA "MAGASIN\BusinessOS\supervisor\runtime"
          Push-Location $runtime
          try {
            @'
          import { chromium } from "playwright-core";

          const browser = await chromium.connectOverCDP("http://127.0.0.1:9222");
          const page = browser.contexts().flatMap(c=>c.pages()).find(p=>p.url().includes("chatgpt.com"));
          if (!page) throw new Error("No ChatGPT page.");
          await page.bringToFront();

          const resolved = await page.evaluate(async () => {
            const norm = (s) => (s || "")
              .normalize("NFD")
              .replace(/[\u0300-\u036f]/g, "")
              .replace(/Đ/g, "D")
              .replace(/đ/g, "d")
              .toUpperCase();

            const open = [...document.querySelectorAll('[aria-label]')]
              .find(el => norm(el.getAttribute('aria-label')) === "MO THANH BEN");
            if (open) {
              open.click();
              await new Promise(r => setTimeout(r, 700));
            }

            const controls = [...document.querySelectorAll('[aria-label]')]
              .filter(el => norm(el.getAttribute('aria-label')).includes("NAO KIEM TIEN"));

            for (const el of controls) {
              let p = el;
              for (let i = 0; i < 18 && p; i++, p = p.parentElement) {
                if (p.tagName === "A") {
                  const href = p.getAttribute("href") || "";
                  if (href.includes("/c/")) return new URL(href, location.origin).href;
                }
                const anchors = [...(p.querySelectorAll?.('a[href*="/c/"]') || [])];
                if (anchors.length === 1) return anchors[0].href;
                const hit = anchors.find(a => norm(a.textContent).includes("NAO KIEM TIEN"));
                if (hit?.href) return hit.href;
              }
            }
            return null;
          });

          if (!resolved || !/chatgpt\.com\/c\//.test(resolved)) {
            throw new Error("Monetization Brain URL not resolved.");
          }

          console.log("MONETIZATION_BRAIN_URL=" + resolved);
          console.log("MONETIZATION_BRAIN_RESOLVED=True");
          await browser.close();
          '@ | Set-Content ".\tmp-resolve-monetization-ascii.mjs" -Encoding UTF8

            node ".\tmp-resolve-monetization-ascii.mjs"
            if ($LASTEXITCODE -ne 0) { throw "ASCII-normalized Brain resolve failed." }
          } finally {
            Remove-Item ".\tmp-resolve-monetization-ascii.mjs" -Force -ErrorAction SilentlyContinue
            Pop-Location
          }
