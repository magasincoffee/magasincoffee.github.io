name: Supervisor Action Dry Run Concurrency Reset

on:
  push:
    branches:
      - feat/supervisor-actions
    paths:
      - '.github/workflows/supervisor-action-dry-run-reset.yml'

permissions:
  contents: read

concurrency:
  group: supervisor-action-dry-run-${{ github.repository }}
  cancel-in-progress: true

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Cancelling stale dry-run so logs can be inspected and the runner can continue."
