name: TASK-049 v38 Final Live Monitor

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/task-049-v36-live-start.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - name: Prove Brain to Work to Brain live cycle
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:LOCALAPPDATA "MAGASIN\BusinessOS\supervisor"
          $configFile = Join-Path $root "lanes.json"
          $registryFile = Join-Path $root "lane-registry.json"
          $statusFile = Join-Path $root "lane-status.json"
          $logFile = Join-Path $root "supervisor.log"
          $runtimeFile = Join-Path $root "runtime\src\runtime\three-lane-cli.mjs"

          if (-not (Test-Path $runtimeFile)) { throw "Installed Three-Lane runtime is missing" }
          if (-not (Select-String -Path $runtimeFile -SimpleMatch "2026-09-19.38" -Quiet)) {
            throw "Installed runtime is not v2026-09-19.38"
          }
          if (-not (Test-Path $configFile)) { throw "lanes.json is missing" }

          $config = Get-Content $configFile -Raw -Encoding UTF8 | ConvertFrom-Json
          $lane1Config = @($config.lanes | Where-Object { $_.lane_id -eq "lane-1" }) | Select-Object -First 1
          if (-not $lane1Config) { throw "lane-1 config is missing" }
          if (-not [bool]$lane1Config.enabled) { throw "lane-1 is not enabled" }
          if ([string]::IsNullOrWhiteSpace([string]$lane1Config.brain_url)) {
            throw "lane-1 Brain URL is missing"
          }

          $logStartCount = if (Test-Path $logFile) {
            @(Get-Content $logFile -ErrorAction SilentlyContinue).Count
          } else {
            0
          }

          $dispatchSeen = $false
          $relaySeen = $false
          $oldRelayDuplicateSeen = $false
          $lastStatus = $null
          $lastRegistryLane = $null
          $newLines = @()

          for ($i = 0; $i -lt 180; $i++) {
            Start-Sleep -Seconds 2

            if (Test-Path $statusFile) {
              try {
                $status = Get-Content $statusFile -Raw -Encoding UTF8 | ConvertFrom-Json
                $lastStatus = @($status.lanes | Where-Object { $_.lane_id -eq "lane-1" }) | Select-Object -First 1
              } catch {}
            }

            if (Test-Path $registryFile) {
              try {
                $registry = Get-Content $registryFile -Raw -Encoding UTF8 | ConvertFrom-Json
                $lastRegistryLane = $registry.lanes.'lane-1'
              } catch {}
            }

            if (Test-Path $logFile) {
              $allLines = @(Get-Content $logFile -ErrorAction SilentlyContinue)
              if ($allLines.Count -gt $logStartCount) {
                $newLines = @($allLines | Select-Object -Skip $logStartCount)
              }
            }

            $reloadCount = @(
              $newLines | Where-Object {
                $_ -match '"type":"LANE_WORK_SEND_RECONCILE_RELOAD"' -and
                $_ -match '"lane_id":"lane-1"'
              }
            ).Count
            if ($reloadCount -gt 1) {
              throw "lane-1 exceeded the one-reload reconciliation budget"
            }

            if ($newLines -match '"type":"LANE_WORK_(DISPATCHED|CREATED)".*"task_id":"TASK-049/THREE-LANE-E2E-03"') {
              $dispatchSeen = $true
            }
            if ($newLines -match '"type":"LANE_WORK_RESULT_RELAYED".*"task_id":"TASK-049/THREE-LANE-E2E-03"') {
              $relaySeen = $true
            }

            $oldRelayDuplicateSeen = [bool](
              $newLines -match '"type":"LANE_RESULT_RELAY_(PENDING_CONFIRMATION|ATTEMPT_ERROR|RECONCILE_RELOAD|NOT_CONFIRMED_RETRY)".*"relay_id":"8aadc974646fce649ff60950992bd20c"'
            )
            if ($oldRelayDuplicateSeen) {
              throw "v38 attempted to resend the already-delivered E2E-02 relay"
            }
            if ($newLines -match '"type":"LANE_WORK_SEND_RECONCILE_BLOCKED"') {
              throw "lane-1 reconciliation blocked during final live monitor"
            }
            if ($newLines -match '"type":"LANE_ERROR".*"Owner/security boundary detected"') {
              throw "lane-1 hit an Owner/security boundary"
            }

            if ($dispatchSeen -and $relaySeen -and $lastRegistryLane) {
              $dispatchInflight = [bool]$lastRegistryLane.dispatch_inflight
              $relayInflight = [bool]$lastRegistryLane.relay_inflight
              if (-not $dispatchInflight -and -not $relayInflight) {
                break
              }
            }
          }

          Write-Host "FINAL_LIVE_LOG_BEGIN"
          $newLines | Select-Object -Last 160 | ForEach-Object { Write-Host $_ }
          Write-Host "FINAL_LIVE_LOG_END"

          if ($lastStatus) {
            Write-Host "FINAL_LANE1_STATUS=$($lastStatus.status)"
            Write-Host "FINAL_LANE1_MESSAGE=$($lastStatus.message)"
            Write-Host "FINAL_LANE1_TASK=$($lastStatus.task_id)"
          }
          if ($lastRegistryLane) {
            Write-Host "FINAL_LANE1_AWAITING_WORK=$([bool]$lastRegistryLane.awaiting_work)"
            Write-Host "FINAL_LANE1_DISPATCH_INFLIGHT=$([bool]$lastRegistryLane.dispatch_inflight)"
            Write-Host "FINAL_LANE1_RELAY_INFLIGHT=$([bool]$lastRegistryLane.relay_inflight)"
          }

          Write-Host "FINAL_DISPATCH_SEEN=$dispatchSeen"
          Write-Host "FINAL_RELAY_SEEN=$relaySeen"
          Write-Host "OLD_RELAY_DUPLICATE_SEEN=$oldRelayDuplicateSeen"

          if (-not $dispatchSeen) {
            throw "No live Brain-to-Work dispatch was observed"
          }
          if (-not $relaySeen) {
            throw "No live Work-to-Brain result relay was observed"
          }
          if (-not $lastRegistryLane) {
            throw "lane-1 registry is missing"
          }
          if ([bool]$lastRegistryLane.dispatch_inflight -or [bool]$lastRegistryLane.relay_inflight) {
            throw "lane-1 still has an inflight exact-once latch after the live cycle"
          }

          $shortcut = Join-Path ([Environment]::GetFolderPath("Desktop")) "MAGASIN BUSINESS OS CONTROL.lnk"
          if (-not (Test-Path $shortcut)) { throw "Control Panel shortcut is missing" }
          Start-Process $shortcut
          Start-Sleep -Seconds 2

          Write-Host "CONTROL_PANEL_OPENED=True"
          Write-Host "ROBOT_FINAL_LIVE=True"
          Write-Host "RELAY_MARKER_DEDUPE=True"
