name: TASK-049 v36 One-Time Live Start

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/task-049-v36-live-start.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-start:
    runs-on: self-hosted
    timeout-minutes: 6
    steps:
      - name: Start Lane 1 and prove live Work dispatch
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:LOCALAPPDATA "MAGASIN\BusinessOS\supervisor"
          $configFile = Join-Path $root "lanes.json"
          $registryFile = Join-Path $root "lane-registry.json"
          $statusFile = Join-Path $root "lane-status.json"
          $logFile = Join-Path $root "supervisor.log"
          $runtimeFile = Join-Path $root "runtime\src\runtime\three-lane-cli.mjs"

          if (-not (Test-Path $runtimeFile)) { throw "Installed Three-Lane runtime is missing" }
          if (-not (Select-String -Path $runtimeFile -SimpleMatch "2026-09-19.36" -Quiet)) {
            throw "Installed runtime is not v2026-09-19.36"
          }
          if (-not (Test-Path $configFile)) { throw "lanes.json is missing" }

          $logStartCount = if (Test-Path $logFile) {
            @(Get-Content $logFile -ErrorAction SilentlyContinue).Count
          } else {
            0
          }

          $config = Get-Content $configFile -Raw -Encoding UTF8 | ConvertFrom-Json
          $lane1 = @($config.lanes | Where-Object { $_.lane_id -eq "lane-1" }) | Select-Object -First 1
          if (-not $lane1) { throw "lane-1 config is missing" }
          if ([string]::IsNullOrWhiteSpace([string]$lane1.brain_url)) {
            throw "lane-1 Brain URL is missing"
          }
          if ([string]$lane1.brain_url -notmatch '^https://chatgpt\.com/c/') {
            throw "lane-1 Brain URL is invalid"
          }

          $lane1.enabled = $true
          $temp = "$configFile.tmp"
          $config | ConvertTo-Json -Depth 20 | Set-Content -Path $temp -Encoding UTF8
          Move-Item -Path $temp -Destination $configFile -Force
          Write-Host "OWNER_REQUESTED_LANE1_START=True"

          $healthy = $false
          $lastStatus = $null
          $lastRegistryLane = $null
          $newLines = @()

          for ($i = 0; $i -lt 75; $i++) {
            Start-Sleep -Seconds 2

            if (Test-Path $statusFile) {
              try {
                $status = Get-Content $statusFile -Raw -Encoding UTF8 | ConvertFrom-Json
                $lastStatus = @($status.lanes | Where-Object { $_.lane_id -eq "lane-1" }) | Select-Object -First 1
              } catch {}
            }

            if (Test-Path $registryFile) {
              try {
                $registry = Get-Content $registryFile -Raw -Encoding UTF8 | ConvertFrom-Json
                $lastRegistryLane = $registry.lanes.'lane-1'
              } catch {}
            }

            if (Test-Path $logFile) {
              $allLines = @(Get-Content $logFile -ErrorAction SilentlyContinue)
              if ($allLines.Count -gt $logStartCount) {
                $newLines = @($allLines | Select-Object -Skip $logStartCount)
              }
            }

            $reloadCount = @(
              $newLines | Where-Object {
                $_ -match '"type":"LANE_WORK_SEND_RECONCILE_RELOAD"' -and
                $_ -match '"lane_id":"lane-1"'
              }
            ).Count

            if ($reloadCount -gt 1) {
              throw "v36 violated one-reload budget for lane-1"
            }

            $dispatchEvidence = [bool](
              $newLines -match '"type":"LANE_WORK_(DISPATCHED|CREATED|RESULT_RELAYED)"'
            )

            $dispatchInflight = [bool](
              $lastRegistryLane -and $lastRegistryLane.dispatch_inflight
            )
            $blocked = [bool](
              $lastRegistryLane -and
              $lastRegistryLane.dispatch_inflight -and
              [bool]$lastRegistryLane.dispatch_inflight.reconcile_blocked
            )

            if ($blocked) {
              throw "lane-1 reconciliation became blocked during live acceptance"
            }

            if (
              $dispatchEvidence -and
              -not $dispatchInflight -and
              $lastStatus -and
              [string]$lastStatus.status -in @("WORKING","RELAYING_RESULT","WAITING_BRAIN","READY")
            ) {
              $healthy = $true
              break
            }
          }

          Write-Host "LIVE_SAFE_LOG_BEGIN"
          $newLines | Select-Object -Last 120 | ForEach-Object { Write-Host $_ }
          Write-Host "LIVE_SAFE_LOG_END"

          if ($lastStatus) {
            Write-Host "LIVE_LANE1_STATUS=$($lastStatus.status)"
            Write-Host "LIVE_LANE1_MESSAGE=$($lastStatus.message)"
            Write-Host "LIVE_LANE1_TASK=$($lastStatus.task_id)"
          }
          if ($lastRegistryLane) {
            Write-Host "LIVE_LANE1_AWAITING_WORK=$([bool]$lastRegistryLane.awaiting_work)"
            Write-Host "LIVE_LANE1_DISPATCH_INFLIGHT=$([bool]$lastRegistryLane.dispatch_inflight)"
          }

          if (-not $healthy) {
            throw "lane-1 did not prove a live Work dispatch/result cycle within 150 seconds"
          }

          $shortcut = Join-Path ([Environment]::GetFolderPath("Desktop")) "MAGASIN BUSINESS OS CONTROL.lnk"
          if (-not (Test-Path $shortcut)) { throw "Control Panel shortcut is missing" }
          Start-Process $shortcut
          Start-Sleep -Seconds 2

          Write-Host "LIVE_WORK_DISPATCH=True"
          Write-Host "CONTROL_PANEL_OPENED=True"
          Write-Host "ROBOT_LIVE_ACCEPTANCE=True"
