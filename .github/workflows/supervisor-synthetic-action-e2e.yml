name: Supervisor Synthetic Action E2E
# isolated headless browser; no authenticated session

on:
  push:
    branches:
      - feat/supervisor-actions
    paths:
      - '.github/workflows/supervisor-synthetic-action-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supervisor-synthetic-action-e2e-${{ github.repository }}
  cancel-in-progress: false

jobs:
  synthetic-e2e:
    if: github.actor == 'magasincoffee'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 08_INTEGRATIONS/supervisor
        shell: powershell

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pinned dependency
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Resolve installed Chrome
        run: |
          $candidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe"
          )
          $chrome = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $chrome) { throw 'Chrome not found.' }
          "MAGASIN_SUPERVISOR_CHROME=$chrome" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Execute CONTINUE and RETRY against isolated synthetic DOM
        run: |
          node src/runtime/synthetic-action-e2e-cli.mjs --chrome "$env:MAGASIN_SUPERVISOR_CHROME"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assert boundary
        run: |
          Write-Host 'PASS: real Chrome action semantics verified in isolated synthetic DOM; no ChatGPT or external side effect.'
