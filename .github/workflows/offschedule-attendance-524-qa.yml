name: Offschedule Attendance 524 Isolated SQL
on:
  pull_request:
    paths:
      - '09_QA/people-shift/attendance-offschedule-524-*'
      - '.github/workflows/offschedule-attendance-524-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sql-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: offschedule_qa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d offschedule_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install disposable schema
        run: psql 'postgresql://postgres:synthetic-only-password@localhost:5432/offschedule_qa' -v ON_ERROR_STOP=1 -f 09_QA/people-shift/attendance-offschedule-524-fixture.sql
      - name: Install candidate only in disposable PostgreSQL
        run: psql 'postgresql://postgres:synthetic-only-password@localhost:5432/offschedule_qa' -v ON_ERROR_STOP=1 -f 09_QA/people-shift/attendance-offschedule-524-candidate.sql
      - name: Execute role and payroll-firewall SQL regression
        run: psql 'postgresql://postgres:synthetic-only-password@localhost:5432/offschedule_qa' -v ON_ERROR_STOP=1 -f 09_QA/people-shift/attendance-offschedule-524.test.sql
      - name: Install disposable PostgREST JWT role permissions
        run: psql 'postgresql://postgres:synthetic-only-password@localhost:5432/offschedule_qa' -v ON_ERROR_STOP=1 -f 09_QA/people-shift/attendance-offschedule-524-jwt-fixture.sql
      - name: Start local PostgREST with verified HS256 JWT
        env:
          QA_JWT_SECRET: local-offschedule-524-jwt-signature-secret-over-32-chars
        run: |
          docker run -d --name qa-offschedule-postgrest --network host \
            -e PGRST_DB_URI=postgres://qa_authenticator:qa-only-524-password@127.0.0.1:5432/offschedule_qa \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="$QA_JWT_SECRET" \
            -e PGRST_SERVER_PORT=3000 postgrest/postgrest:v12.2.3
          for attempt in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)"
            if [[ "$code" =~ ^(200|401|403|404)$ ]]; then exit 0; fi
            sleep 2
          done
          docker logs qa-offschedule-postgrest
          exit 1
      - name: Run signed JWT PostgREST cross-role writer integration
        env:
          QA_JWT_SECRET: local-offschedule-524-jwt-signature-secret-over-32-chars
          QA_POSTGREST_URL: http://127.0.0.1:3000
        run: node 09_QA/people-shift/attendance-offschedule-524-jwt-e2e.mjs
      - name: Install browser-only canonical empty attendance readers
        run: psql 'postgresql://postgres:synthetic-only-password@localhost:5432/offschedule_qa' -v ON_ERROR_STOP=1 -f 09_QA/people-shift/attendance-offschedule-524-browser-fixture.sql
      - name: Install Playwright Chromium in disposable Actions runner
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Serve PR source locally for signed browser QA
        run: |
          nohup python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/off-524-http.log 2>&1 &
          for attempt in $(seq 1 12); do
            if curl -fsS http://127.0.0.1:8767/09_QA/people-shift/ui2-009-employee-people-fixture.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/off-524-http.log
          exit 1
      - name: Signed JWT actual Employee Manager Owner UI browser E2E
        env:
          QA_JWT_SECRET: local-offschedule-524-jwt-signature-secret-over-32-chars
          QA_POSTGREST_URL: http://127.0.0.1:3000
          QA_BASE_URL: http://127.0.0.1:8767
        run: node 09_QA/people-shift/attendance-offschedule-524-browser-jwt-e2e.mjs
      - name: Diagnostics on failure
        if: failure()
        run: docker logs qa-offschedule-postgrest || true
      - name: Confirm no hosted connection
        run: echo 'Disposable PostgreSQL only; this job does not use production credentials or deploy SQL.'
