name: Offschedule Attendance 524 Isolated SQL
on:
  pull_request:
    paths:
      - '09_QA/people-shift/attendance-offschedule-524-*'
      - '.github/workflows/offschedule-attendance-524-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sql-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: offschedule_qa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d offschedule_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install disposable schema
        run: psql 'postgresql://postgres:synthetic-only-password@localhost:5432/offschedule_qa' -v ON_ERROR_STOP=1 -f 09_QA/people-shift/attendance-offschedule-524-fixture.sql
      - name: Install candidate only in disposable PostgreSQL
        run: psql 'postgresql://postgres:synthetic-only-password@localhost:5432/offschedule_qa' -v ON_ERROR_STOP=1 -f 09_QA/people-shift/attendance-offschedule-524-candidate.sql
      - name: Execute role and payroll-firewall SQL regression
        run: psql 'postgresql://postgres:synthetic-only-password@localhost:5432/offschedule_qa' -v ON_ERROR_STOP=1 -f 09_QA/people-shift/attendance-offschedule-524.test.sql
      - name: Confirm no hosted connection
        run: echo 'Disposable PostgreSQL only; this job does not use production credentials or deploy SQL.'
