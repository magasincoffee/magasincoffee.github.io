name: XSTORE-019H Employee Mobile Presentation QA
on:
  push:
    paths:
      - '02_CORE/ui/magasin-ui-v2-employee-shell.js'
      - '02_CORE/ui/magasin-ui-v2-employee-shell.css'
      - '02_CORE/ui/magasin-ui-v2-employee-presentation-v4.css'
      - '06_EMPLOYEE/employee-presentation-v4.js'
      - '06_EMPLOYEE/app/employee-v40.html'
      - '06_EMPLOYEE/runtime/employee-runtime-v1.html'
      - '06_EMPLOYEE/index.html'
      - '06_EMPLOYEE/profile/engine-v1.js'
      - '09_QA/people-shift/xstore-019h-employee-mobile-presentation-v1.test.mjs'
      - '09_QA/people-shift/xstore-019h-employee-mobile-presentation-browser.mjs'
      - '.github/workflows/xstore-019h-employee-mobile-presentation-qa.yml'
  pull_request:
    paths:
      - '02_CORE/ui/magasin-ui-v2-employee-shell.js'
      - '02_CORE/ui/magasin-ui-v2-employee-shell.css'
      - '02_CORE/ui/magasin-ui-v2-employee-presentation-v4.css'
      - '06_EMPLOYEE/employee-presentation-v4.js'
      - '06_EMPLOYEE/app/employee-v40.html'
      - '06_EMPLOYEE/runtime/employee-runtime-v1.html'
      - '06_EMPLOYEE/index.html'
      - '06_EMPLOYEE/profile/engine-v1.js'
      - '09_QA/people-shift/xstore-019h-employee-mobile-presentation-v1.test.mjs'
      - '09_QA/people-shift/xstore-019h-employee-mobile-presentation-browser.mjs'
      - '.github/workflows/xstore-019h-employee-mobile-presentation-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  employee-mobile-presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check XSTORE-019H presentation and QA
        run: |
          node --check 02_CORE/ui/magasin-ui-v2-employee-shell.js
          node --check 06_EMPLOYEE/employee-presentation-v4.js
          node --check 06_EMPLOYEE/profile/engine-v1.js
          node --check 09_QA/people-shift/xstore-019h-employee-mobile-presentation-browser.mjs
      - name: Run XSTORE-019H targeted static contracts
        run: |
          node --test 09_QA/people-shift/xstore-019h-employee-mobile-presentation-v1.test.mjs
          node --test 09_QA/people-shift/ui2-005-employee-shell-contract.test.mjs
          node --test 09_QA/people-shift/ui2-008-employee-secondary-contract.test.mjs
          node --test 09_QA/people-shift/ui2-009-employee-people-contract.test.mjs
          node --test 09_QA/people-shift/employee-profile-projection-v1.test.mjs
          node --test 09_QA/people-shift/xstore-019d-employee-availability-calendar-v1.test.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start exact-head QA server
        shell: bash
        run: |
          mkdir -p qa-artifacts/xstore-019h qa-artifacts/people-shift
          nohup python3 -m http.server 8783 --bind 127.0.0.1 > /tmp/xstore019h-http.log 2>&1 &
          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsS http://127.0.0.1:8783/09_QA/people-shift/ui2-008-employee-secondary-fixture.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/xstore019h-http.log || true
          exit 1
      - name: Run XSTORE-019H mobile browser acceptance
        env:
          QA_BASE_URL: http://127.0.0.1:8783
          QA_OUT: qa-artifacts/xstore-019h
        run: node 09_QA/people-shift/xstore-019h-employee-mobile-presentation-browser.mjs
      - name: Run impacted Availability browser regression
        env:
          QA_BASE_URL: http://127.0.0.1:8783
          QA_OUT: qa-artifacts/xstore-019h
        run: node 09_QA/people-shift/xstore-019d-employee-availability-calendar-browser.mjs
      - name: Run impacted Profile browser regression
        env:
          QA_BASE_URL: http://127.0.0.1:8783
          QA_OUT: qa-artifacts/people-shift
        run: node 09_QA/people-shift/employee-profile-projection-browser.mjs
      - name: Upload XSTORE-019H evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xstore-019h-employee-mobile-presentation-${{ github.run_id }}
          path: |
            qa-artifacts/xstore-019h/
            qa-artifacts/people-shift/task-101-employee-profile-projection*
          if-no-files-found: warn
          retention-days: 30
