name: Auth Password Reset Hotfix

on:
  push:
    paths:
      - '03_PLATFORM/01_AUTH/**'
      - '09_QA/auth/password-reset-hotfix-browser.mjs'
      - '.github/workflows/auth-password-reset-hotfix.yml'
  pull_request:
    paths:
      - '03_PLATFORM/01_AUTH/**'
      - '09_QA/auth/password-reset-hotfix-browser.mjs'
      - '.github/workflows/auth-password-reset-hotfix.yml'

permissions:
  contents: read

jobs:
  auth-password-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local auth QA server
        shell: bash
        run: |
          nohup python3 -m http.server 8768 --bind 127.0.0.1 > /tmp/auth-hotfix-http.log 2>&1 &
          echo $! > /tmp/auth-hotfix-http.pid
          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsS http://127.0.0.1:8768/03_PLATFORM/01_AUTH/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/auth-hotfix-http.log || true
          exit 1

      - name: Run password reset browser regression
        env:
          QA_BASE_URL: http://127.0.0.1:8768
        run: node 09_QA/auth/password-reset-hotfix-browser.mjs
