name: Supervisor Installer Smoke Concurrency Reset

on:
  push:
    branches:
      - feat/supervisor-actions
    paths:
      - '.github/workflows/supervisor-installer-smoke-reset.yml'

permissions:
  contents: read

concurrency:
  group: supervisor-installer-smoke-${{ github.repository }}
  cancel-in-progress: true

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Cancelling failed installer smoke so logs can be inspected."
